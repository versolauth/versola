    post:
      operationId: createEdge
      summary: Register an edge
      description: |
        Registers an edge in the partner's group and issues its signing key and its first
        enrollment token. The private half of the key, the token and the bundle are **shown once**:
        the operator does not keep the private key. The number of edges is limited by the partner's
        limits (`maxEdges`); central answers `400`/`409` beyond it.

        **Minimum level:** developer. **Served by:** central (`POST /edge/partner/edges`).
      tags: [Edges]
      x-staff-level: developer
      x-served-by: central
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, publicUrl]
