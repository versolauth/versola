        '403':
          $ref: '#/components/responses/ForbiddenCentral'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/CentralUnavailable'

  /partner/api/profile:
    get:
      operationId: getProfile
      summary: Read the pending profile change
      description: |
        What waits for the operator of a profile change. Central does not serve it for the partner
        to read back (the answer of the change itself is the only place it is told), so this
        **always answers `{ "approval": null }`** until central does. The partner's current name and
        logo are in `GET /partner/api/me`.

        **Minimum level:** admin. **Served by:** the edge itself (central is not called).
      tags: [Organisation]
      x-staff-level: admin
      x-served-by: edge
      responses:
        '200':
          description: Always no approval.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/RotatedSession'
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval:
                    type: 'null'
              example:
                approval: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: requestProfileChange
      summary: Request a change of the partner's name or logo
      description: |
        Asks the operator to change the partner's display name or logo. The change does not
        apply until the operator approves it; the answer names the request, always `waiting`.

        **Minimum level:** admin. **Served by:** central (`PUT /edge/partner/profile`).
      tags: [Organisation]
      x-staff-level: admin
      x-served-by: central
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileChange'
            example:
              displayName: Acme Corporation
              logoUri: https://acme.example.com/logo-new.png
      responses:
        '202':
          description: The request waits for the operator.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/RotatedSession'
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval:
                    $ref: '#/components/schemas/ProfileApproval'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenCentral'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/CentralUnavailable'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: EDGE_SESSION
      description: |
        The console's session: `EDGE_SESSION=<presetId>:<accessToken>`, set by the edge's
        `/complete` after a sign-in started at `/partner/login`. `Secure`, `HttpOnly`,
        `SameSite=Strict`. The token must have been issued to the partner's console client through
        the console's preset; a session of any other preset or client shares the cookie name but
        is not a staff session. When the access token has expired the edge refreshes it and
        replies with a rotated cookie.

  headers:
    NoStore:
      description: Always `no-store`.
      schema:
        type: string
        example: no-store
    RotatedSession:
      description: |
        Present only when the edge refreshed the session's expired access token while handling
        the call: the new `EDGE_SESSION` cookie (same attributes as the one `/complete` sets).
      schema:
        type: string

  parameters:
    ClientId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: A client of the partner.
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: The `resourceId` of a resource of the partner.
    EdgeId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: An edge of the partner's group.
    StaffId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: |
        A team entry: a member's `sub`, or the id of a pending invitation (the `id` of a
        `StaffMember`).

  responses:
    Unauthenticated:
      description: |
        No usable staff session: no `EDGE_SESSION` cookie, a token that is invalid, expired beyond
        refresh or revoked, or a session that is not the console's. The console goes to
        `loginPath`. When the cookie holds a session that can never be refreshed the response
        carries a `Set-Cookie` that clears it.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Set-Cookie:
          description: Clears `EDGE_SESSION`, when there is a cookie that cannot be used.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthenticated
            loginPath: /partner/login
    Forbidden:
      description: |
        Refused: `origin_mismatch` (a state-changing request from another origin, checked before
        the session), `not_a_member` (signed in, not on the team; carries the masked
        `identifier` the sign-in named and the `partner`), or `insufficient_level` (carries the level
        `required`; only on an operation whose minimum level is above `viewer`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notAMember:
              value:
                error: not_a_member
                identifier: +7••••••••01
                partner: Acme Corp
            insufficientLevel:
              value:
                error: insufficient_level
                required: admin
            originMismatch:
              value:
                error: origin_mismatch
    ForbiddenCentral:
      description: |
        As `Forbidden`, and, for a call to central: `partner_suspended` (the operator has suspended
        the partner) or `partner_principal_mismatch` (central does not accept the staff member's
        token as a live token of the partner's console client).
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            partnerSuspended:
              value:
                error: partner_suspended
            partnerPrincipalMismatch:
              value:
                error: partner_principal_mismatch
            insufficientLevel:
              value:
                error: insufficient_level
                required: developer
            notAMember:
              value:
                error: not_a_member
                identifier: d•••@acme.example.com
                partner: Acme Corp
            originMismatch:
              value:
                error: origin_mismatch
    InvalidRequest:
      description: |
        The body is not a JSON object, a field is missing or invalid, a path id and a body id
        differ, or central refused the request as invalid (its text, up to 500 characters, is
        in `message`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_request
            message: kind must be web or native
    NotFound:
      description: |
        The client, resource, edge or team entry does not exist for the partner. For a call to
        central, `message` holds the start of central's answer.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
    Conflict:
      description: |
        `conflict`: a change central refused as conflicting (`message` holds the start of its
        answer), or, for the team, a change that would leave no administrator or remove oneself.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: conflict
            message: this would leave the team without an administrator
    BadGateway:
      description: |
        Central answered a success the edge could not read (`central_unreadable`), or a status the
        edge does not translate (`central_answered_<status>`; `message` holds the start of its
        body).
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: central_answered_422
            message: '{"error":"unprocessable"}'
    CentralUnavailable:
      description: |
        Central cannot be used: it is unreachable, timed out (15 seconds), answered `5xx`, or
        refused the edge's own token or certificate. Nothing was changed. The edge's own sessions
        and its proxying carry on from their last snapshot.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: central_unavailable
    InternalError:
      description: An unexpected failure; the body carries only the code.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error

  schemas:
    Error:
      type: object
      required: [error]
      description: |
        A refusal. `error` is the code (see the table in the description of the API). `fields`
        names the fields at fault, when the edge knows them (central's refusals are relayed as
        text in `message`, so it is rarely present). `message` is a human-readable reason, and
        for a relayed refusal the start of central's answer. Further properties are specific to the
        code.
      properties:
        error:
          type: string
          description: |
            One of `invalid_request`, `unauthenticated`, `not_a_member`, `insufficient_level`,
            `origin_mismatch`, `partner_suspended`, `partner_principal_mismatch`, `not_found`,
            `conflict`, `not_supported`, `central_unreadable`, `central_answered_<status>`,
            `central_unavailable`, `internal_error`.
        fields:
          type: array
          items:
            type: string
        message:
          type: string
        loginPath:
          type: string
          description: '`unauthenticated` only: where to sign in, `/partner/login`.'
        identifier:
          type: string
          description: |
            `not_a_member` only: the identifier the sign-in carried, masked so that a person can
            tell which account they used (for example `+7••••••••01` or `d•••@acme.example.com`);
            empty if the sign-in carried none.
        partner:
          type: string
          description: '`not_a_member` only: the display name of the partner.'
        required:
          $ref: '#/components/schemas/StaffLevel'
      additionalProperties: true

    StaffLevel:
      type: string
      enum: [admin, developer, viewer]
      description: |
        A member's level, ordered `admin` > `developer` > `viewer`; a level has what the ones below
        it have.

    PartnerStatus:
      type: string
      enum: [onboarding, active, suspended]
      description: |
        `onboarding` until the partner's first edge has called central, then `active`; `suspended`
        is the operator's kill switch.

    PartnerLimits:
      type: object
      description: What the operator lets the partner have, as central holds it. Shown for hints.
      properties:
        scopes:
          type: array
          items:
            type: string
          description: What a partner client may request, as a whole.
        redirectDomains:
          type: array
          items:
            type: string
          description: Every redirect URI of a client is `https` and under one of these.
        maxClients:
          type: integer
        maxEdges:
          type: integer
        accessTokenTtlMax:
          type: integer
          description: Seconds.
        refreshTokenTtlMax:
          type: integer
          description: Seconds.
        clientAuthMethods:
          type: array
          items:
            $ref: '#/components/schemas/PartnerClientAuthMethod'
        rateLimitPolicy:
          type: string

    PartnerClientAuthMethod:
      type: string
      enum: [tls_client_auth, private_key_jwt]

    PartnerMe:
      type: object
      required: [partner, staff, edge, console]
      properties:
        partner:
          type: object
          required: [id, displayName, status, limits, operator]
          properties:
            id:
              type: string
            displayName:
              type: string
            logoUri:
              type: [string, 'null']
              format: uri
            status:
              $ref: '#/components/schemas/PartnerStatus'
            limits:
              $ref: '#/components/schemas/PartnerLimits'
            reviewAt:
              type: [string, 'null']
              format: date-time
              description: When the operator next reviews the partner, if it set a date.
            operator:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                issuer:
                  type: [string, 'null']
                  description: The operator's authorization server's issuer.
                mtlsUrl:
                  type: [string, 'null']
                  description: Where the partner's clients authenticate with the group's certificate.
                centralMtlsUrl:
                  type: [string, 'null']
                  description: Central's mutual-TLS address, where an edge's enrollment ends up.
        staff:
          type: object
          required: [sub, display, level]
          properties:
            sub:
              type: string
            display:
              type: string
              description: The name from the sign-in, or the masked identifier when it had none.
            level:
              $ref: '#/components/schemas/StaffLevel'
        edge:
          type: object
          required: [id, central]
          properties:
            id:
              type: string
            publicUrl:
              type: [string, 'null']
            central:
              type: string
              enum: [ok, unavailable]
              description: Whether the edge's last read of central succeeded.
        console:
          type: object
          required: [clientId, presetId]
          description: The partner's own console client and its authorization preset.
          properties:
            clientId:
              type: string
            presetId:
              type: string

    PartnerClientApproval:
      type: object
      required: [kind, status, waitingFields]
      properties:
        kind:
          type: string
          enum: [create, change]
          description: Whether the request is the client's creation or a change to an approved client.
        status:
          type: string
          enum: [pending, approved, rejected]
        waitingFields:
          type: array
          items:
            type: string
          description: The fields that wait for the operator.
        requestedAt:
          type: [string, 'null']
          format: date-time
        note:
          type: [string, 'null']
          description: The operator's note, if it left one.

    PartnerClient:
      type: object
      required: [id, kind, clientName, redirectUris, scope, accessTokenTtl, refreshTokenTtl, loginPath, createdAt, approval, fixed, limits]
      description: |
        A client as the partner sees it: what it may read and change, what waits for the operator,
        and what is fixed. `jwks` and `dpopBoundAccessTokens` of central's client are not shown.
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/PartnerClientKind'
        clientName:
          type: string
          description: One string; central keeps a map of locales, of which English is shown if there is one.
        logoUri:
          type: [string, 'null']
        policyUri:
          type: [string, 'null']
        tosUri:
          type: [string, 'null']
        redirectUris:
          type: array
          items:
            type: string
        scope:
          type: array
          items:
            type: string
        authMethod:
          $ref: '#/components/schemas/PartnerClientAuthMethod'
        accessTokenTtl:
          type: integer
          description: Seconds.
        refreshTokenTtl:
          type: integer
          description: Seconds.
        backChannelLogoutUri:
          type: [string, 'null']
        consentFlow:
          type:
            - object
            - 'null'
          description: The client's consent flow as central holds it. Not set through this API.
        createdAt:
          type: string
          format: date-time
        loginPath:
          type: string
          description: |
            `/login/<clientId>` on the partner's own edge: the edge keeps one authorization preset
            per approved partner client. Prefix it with the edge's public URL.
        approval:
          $ref: '#/components/schemas/PartnerClientApproval'
        fixed:
          type: object
          required: [consent, flow, authMethod, group]
          description: What is the same for every partner client.
          properties:
            consent:
              type: boolean
              const: true
            flow:
              type: string
              const: code+pkce+par
            authMethod:
              $ref: '#/components/schemas/PartnerClientAuthMethod'
            group:
              type: string
              description: The partner's edge group.
        limits:
          $ref: '#/components/schemas/PartnerLimits'

    PartnerClientKind:
      type: string
      enum: [web, native]

    PartnerClientWrite:
      type: object
      required: [id, kind, clientName, redirectUris, scope, accessTokenTtl]
      description: |
        A client as the partner writes it. On create `id`, `kind`, `clientName`, `redirectUris`,
        `scope` and `accessTokenTtl` are required; on update the console sends the whole client and
        the edge changes what differs (see `updateClient`). Fields not listed here, and server-owned
        ones (`createdAt`, `approval`, `fixed`, `loginPath`), are ignored.
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/PartnerClientKind'
        clientName:
          type: string
          description: Stored as the English name; may not be blank.
        logoUri:
          type: [string, 'null']
          description: Blank is stored as absent.
        policyUri:
          type: [string, 'null']
        tosUri:
          type: [string, 'null']
        redirectUris:
          type: array
          items:
            type: string
          description: Must be `https` and under one of the partner's `redirectDomains`; central decides.
        scope:
          type: array
          items:
            type: string
          description: A subset of the partner's `limits.scopes`; central decides.
        accessTokenTtl:
          type: integer
          description: Seconds, up to `limits.accessTokenTtlMax`.
        refreshTokenTtl:
          type: [integer, 'null']
          description: Seconds, up to `limits.refreshTokenTtlMax`.
        backChannelLogoutUri:
          type: [string, 'null']
          description: Blank is stored as absent.
        authMethod:
          $ref: '#/components/schemas/PartnerClientAuthMethod'

    InjectRule:
      type: object
      required: [target, name, expression]
      properties:
        target:
          type: string
          enum: [header, query, body]
        name:
          type: string
        expression:
          type: string
          description: A CEL expression evaluated for the request.

    ResourceEndpoint:
      type: object
      required: [method, path]
      description: An endpoint of a resource, as central has it.
      properties:
        id:
          oneOf:
            - type: string
            - type: integer
          description: Assigned by the edge (a UUID) when a new endpoint has none.
        method:
          type: string
        path:
          type: string
        fetchUserInfo:
          type: boolean
          default: false
        allow:
          type: [string, 'null']
          description: A CEL expression that decides whether the request is allowed.
        inject:
          type: array
          items:
            $ref: '#/components/schemas/InjectRule'
          default: []
        stepUpCondition:
          type: [string, 'null']
        stepUpAcr:
          type: [string, 'null']
        maxAge:
          type: [integer, 'null']
        rateLimit:
          type: [object, 'null']
          description: |
            A limit on how often the endpoint is called (`limits`, `burst`, `by`, `mode`), as in
            the central API.
          additionalProperties: true

    PartnerResource:
      type: object
      required: [resourceId, resource, audience, endpoints, secretRotation]
      description: |
        A resource of the partner as the console reads it: no `internal` (always true for a
        partner), no owner, no audience limits.
      properties:
        resourceId:
          type: string
        resource:
          type: string
          description: The resource's URI, the upstream the edge proxies to.
        audience:
          type: array
          items:
            type: string
          description: Identifiers of the partner's clients that may call it.
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/ResourceEndpoint'
        secretRotation:
          type: boolean
          description: Whether a previous secret is still accepted after a rotation.

    PartnerResourceWrite:
      type: object
      required: [resourceId, resource, audience]
      properties:
        resourceId:
          type: string
        resource:
          type: string
        audience:
          type: array
          items:
            type: string
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/ResourceEndpoint'

    CreatedResource:
      type: object
      required: [resource, secret]
      properties:
        resource:
          $ref: '#/components/schemas/PartnerResource'
        secret:
          type: [string, 'null']
          description: The secret the edge authenticates to the upstream with. Shown once.

    PartnerEdge:
      type: object
      required: [id, publicUrl, status, replicas, policies]
      properties:
        id:
          type: string
        publicUrl:
          type: string
          description: Empty if none was registered.
        status:
          type: string
          enum: [waiting, enrolled, suspended]
          description: |
            `waiting` until central has issued the edge a certificate, then `enrolled`;
            `suspended` for every edge of a suspended partner.
        certificateNotAfter:
          type: [string, 'null']
          format: date-time
          description: When the edge's current certificate expires; absent until it enrolled.
        lastRenewedAt:
          type: [string, 'null']
          format: date-time
        replicas:
          type: integer
          const: 0
          description: Always `0`, because central does not count the replicas behind an edge.
        policies:
          type: object
          required: [overload, accessLog, rateLimits]
          description: The operator's policies for the group, read-only; `{}` for one that is not set.
          properties:
            overload:
              type: object
              additionalProperties: true
            accessLog:
              type: object
              additionalProperties: true
            rateLimits:
              type: object
              additionalProperties: true

    SigningKey:
      type: object
      required: [keyId, privateKey]
      description: The edge's signing key, created with it and shown once; the operator does not keep the private half.
      properties:
        keyId:
          type: string
        privateKey:
          type: string

    EnrollmentToken:
      type: object
      required: [token, bundle, expiresAt]
      properties:
        token:
          type: string
          description: Shown once.
        bundle:
          type: string
          description: |
            What the edge is deployed with, as a JSON document in a string. From
            `POST /partner/api/edges/{id}/enrollment-tokens` it does not hold the signing key or the
            enrollment address, so it cannot be used as `partner.bundle-file` on its own
            (`bundleComplete` is `false`): the token goes in `central.identity.enrollment`.
        bundleComplete:
          type: boolean
          description: Whether `bundle` can enroll an edge as it is. Only the bundle of `POST /partner/api/edges` can be.
        expiresAt:
          type: [string, 'null']
          format: date-time

    CreatedEdge:
      allOf:
        - $ref: '#/components/schemas/EnrollmentToken'
        - type: object
          required: [edge, signingKey]
          properties:
            edge:
              $ref: '#/components/schemas/PartnerEdge'
            signingKey:
              $ref: '#/components/schemas/SigningKey'

    RevocationRequest:
      type: object
      required: [by, value]
      properties:
        by:
          type: string
          enum: [user, sid, fam]
          description: What `value` names.
        value:
          type: string
          description: The user's `sub`, the SSO session id (`sid`) or the refresh-token family (`fam_id`).

    Revocation:
      type: object
      required: [id, at, by_staff, by, value, clients, edges, ended]
      description: |
        A revocation an administrator made on this edge. `clients` and `edges` are always empty.
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        by_staff:
          type: string
          description: The `sub` of the staff member.
        by:
          type: string
        value:
          type: string
        clients:
          type: array
          items:
            type: string
        edges:
          type: array
          items:
            type: string
        ended:
          type: integer

    AuditEvent:
      type: object
      required: [id, at, actor, action, target, outcome]
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        actor:
          type: object
          required: [sub]
          properties:
            sub:
              type: string
              description: The staff member's `sub`; `operator` (or the operator's actor id) for an operator's action.
            display:
              type: string
              description: The member's name as the team shows it, `Operator`, or `Configuration` for an invite made from `partner.admins`.
            byOperator:
              type: boolean
              const: true
              description: Present when the action was the operator's.
        kind:
          type: string
          description: The audit kind, for example `admin.partner-client.create`, or `team.invite` for an event of the team.
        action:
          type: string
          description: What was done, in words ("Created client", "Invited a•••@example.com as developer"); the kind itself where it has none.
        target:
          type: string
          description: '`<targetType>:<targetId>`.'
        outcome:
          type: string
          enum: [ok, refused, failed]
          description: Central's `success`, `denied` and `failure`.
        from:
          type: string
          description: The edge the action came through, when the event names one.

    AuditPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next:
          type: [string, 'null']
          description: Cursor of the next page; `null` at the end.

    StaffMember:
      type: object
      required: [id, level, state, addedBy, addedAt]
      description: A row of the team, either a member or an invitation nobody has taken yet.
      properties:
        id:
          type: string
          description: The `sub` of a member, the invitation's id while it is an invitation.
        subject:
          type: string
          description: A member's `sub`; absent for an invitation.
        identifier:
          type: object
          required: [kind, masked]
          description: An invitation's identifier, masked; absent for a member.
          properties:
            kind:
              type: string
              enum: [phone, email]
            masked:
              type: string
        display:
          type: string
          description: A member's name; absent for an invitation.
        level:
          $ref: '#/components/schemas/StaffLevel'
        state:
          type: string
          enum: [member, invited]
        addedBy:
          type: string
          description: The `sub` of whoever invited them, or `config` for a first administrator named in the edge's configuration.
        addedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When an invitation lapses; absent for a member.

    StaffInvite:
      type: object
      required: [identifier, level]
      properties:
        identifier:
          type: string
          description: A phone number in international format (`+7701...`) or an email address.
        level:
          $ref: '#/components/schemas/StaffLevel'
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 90
          description: Lifetime of the invitation; outside the range it is ignored, and the configured one used.

    PartnerSettings:
      type: object
      required: [contact, defaults]
      properties:
        contact:
          type: object
          required: [email]
          properties:
            email:
              type: string
            phone:
              type: [string, 'null']
        defaults:
          type: object
          description: What the console offers for a new client; central applies none of it by itself.
          properties:
            backChannelLogoutUri:
              type: [string, 'null']
            accessTokenTtl:
              type: [integer, 'null']
              description: Seconds.
            refreshTokenTtl:
              type: [integer, 'null']
              description: Seconds.

    ProfileChange:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
        logoUri:
          type: [string, 'null']

    ProfileApproval:
      type: object
      required: [id, status, requestedAt, requested]
      properties:
        id:
          type: string
          description: The id of the operator's approval request; empty if central did not name one.
        status:
          type: string
          const: waiting
        requestedAt:
          type: [string, 'null']
          format: date-time
        requested:
          $ref: '#/components/schemas/ProfileChange'
