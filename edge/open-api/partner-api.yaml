    post:
      operationId: issueEnrollmentToken
      summary: Issue an enrollment token
      description: |
        Issues a fresh enrollment token for an edge that exists. The token is **shown once**.
        `bundle` is a JSON document, as a string, that carries what the edge is deployed with
        (`edgeId`, `group`, central's and the authorization server's mutual-TLS addresses and
        issuer, and the token). It does **not** carry the signing key, which is shown only when the
        edge is created. No body.

        **Minimum level:** developer. **Served by:** central
        (`POST /edge/partner/edges/enrollment-tokens`).
      tags: [Edges]
