openapi: 3.1.0

info:
  title: Versola Partner Console API
  version: '1.0'
  description: |
    The API of the partner console: what a partner's own edge serves, on its own origin, to the
    people who run that partner's integration with the operator's Versola. Through it a partner's
    staff register OAuth clients and resources, enrol edges, end grants of their own clients, read
    the audit trail and manage their team.

    **This API is served only by an edge started with `mode = "partner"`.** A first-party edge
    (`mode = "first-party"`, the default) does not mount any of these paths and answers `404` to
    them. The first-party edge's own reference, `edge/open-api/edge.yaml`, is unchanged and does not
    describe anything here.

    This reference covers `/partner/api/*`, plus the three fixed paths of the console that sit
    beside it: `GET /partner/login`, `GET /partner/logout` and the static console under
    `GET /partner/`. The proxied traffic, the browser login (`/login/{presetId}`, `/complete`),
    the native endpoints and the operations endpoints of a partner edge are those of `edge.yaml`.

    ## Surfaces

    * **Who is asking, the team, revocations** — `/partner/api/me`, `/partner/api/staff`, `/partner/api/revocations`, answered by the edge itself
      (from what central last said about the partner, and from the team the edge keeps in its own
      database).
    * **Clients, resources, edges, audit, settings, profile** — each call is a call to
      central's `/edge/partner/...` surface made by the edge on the staff member's behalf, then
      translated to and from the shapes below. These are not served from a cache: they are
      answered by central or not at all (`503 central_unavailable`).
    * **Console** — `/partner/login`, `/partner/logout` and the static files under `/partner/`.

    ## Authentication and authorization

    Every `/partner/api/*` call carries the `EDGE_SESSION` cookie (see `securitySchemes`): the
    session of a person who signed in at the operator's authorization server through the
    console's own preset (`/partner/login` starts that). A `Bearer` or `DPoP` token in
    `Authorization` is not a console session and is ignored. When the access token inside the
    cookie has expired, the edge refreshes it and replies with the rotated `EDGE_SESSION`
    cookie, whatever the status of the answer (the refresh token it replaced is spent).

    Before an operation runs, the edge checks, in this order, and refuses at the first that fails:

    1. **Origin.** A state-changing request (any method but `GET` and `HEAD`) that carries an
       `Origin` header other than the edge's own origin is refused `403 origin_mismatch`. A request
       with no `Origin` is not a browser's and is let through to the next check.
    2. **Session.** No cookie, or a token that is not valid, expired beyond refresh or revoked:
       `401 unauthenticated`. A valid session of the partner's *own applications* (an end user of
       one of its clients, which shares the cookie name) is not a staff session and is `401` too:
       the token must have been issued to the console's client through the console's preset.
    3. **Team.** The person must be on the partner's team. Nobody is until they sign in: an
       invitation made by phone number or email address waits for the first sign-in whose
       `/userinfo` carries that verified identifier, and then becomes the member, known from then on
       by `sub`. Anyone else: `403 not_a_member`, which names the (masked) identifier the sign-in
       carried and the partner.
    4. **Level.** A member has a level, ordered `admin` > `developer` > `viewer`, and a level also
       has what the ones below it have. Each operation names the lowest level it needs; a lower one
       is `403 insufficient_level`, naming the level required.
       * `viewer` reads clients, resources, edges and the audit trail.
       * `developer` also changes clients, resources and edges.
       * `admin` also manages revocations, the team, the settings and the profile.

    Every operation below states its minimum level (`x-staff-level`) and whether it is answered
    by the edge itself (`x-served-by: edge`) or is a call to central (`x-served-by: central`).
    A call to central is made over the edge's own mutual-TLS identity and carries the staff
    member's access token in a `Versola-Principal` header, which central verifies as a live token
    of the partner's console client and writes into its audit log as the actor.

    ## Errors

    Every refusal has the body `{ "error": <code>, "fields"?: [...], "message": <text>, ...extra }`
    with `Content-Type: application/json` and `Cache-Control: no-store` (see `Error`). `message` is
    always there: central's own text where it gave one, else a sentence for the code. A partner
    central has suspended is refused any change by the edge itself with `partner_suspended`, and
    `/me` then reports `status: suspended`. Codes:

    | Status | `error` | When |
    |---|---|---|
    | 400 | `invalid_request` | The body is not a JSON object, a required field is missing or invalid, the path and body ids differ, or central refused the request as invalid (its text is in `message`). |
    | 401 | `unauthenticated` | No usable staff session. Carries `loginPath`; the console goes there. |
    | 403 | `not_a_member` | Signed in, not on the team. Carries `identifier` (masked) and `partner`. |
    | 403 | `insufficient_level` | The member's level is below the operation's. Carries `required`. |
    | 403 | `origin_mismatch` | A state-changing request from another origin. |
    | 403 | `partner_suspended` | The operator has suspended the partner: central refuses everything of it. Central operations only. |
    | 403 | `partner_principal_mismatch` | Central does not accept the staff member's token as a live token of the partner's console. Central operations only. |
    | 404 | `not_found` | The client, resource, edge or team entry does not exist (for the partner). |
    | 409 | `conflict` | A team change that would leave no administrator, or remove oneself. Also central's `409`. |
    | 409 | `not_supported` | The operation does not exist for a partner (rotating a client's secret). |
    | 500 | `internal_error` | An unexpected failure; the body is only `{ "error": "internal_error" }`. |
    | 502 | `central_unreadable` | Central answered a success the edge could not read. |
    | 502 | `central_answered_<status>` | Central answered a status the edge does not translate. `message` holds the start of its body. |
    | 503 | `central_unavailable` | Central cannot be reached, timed out, answered `5xx`, or refused the edge itself. Nothing was changed. |

    A rotated session cookie is set on every answer to a request that refreshed the session, a refusal
    included; a refusal before the session is established (`401`, `403 origin_mismatch`) carries none.
  license:
    name: Versola Community License v1.0
    url: https://github.com/versolauth/versola/blob/main/LICENCE.md

externalDocs:
  description: Versola documentation
  url: https://docs.versola.io

servers:
  - url: '{edgeBaseUrl}'
    description: |
      The public origin of the partner's edge — its `edge-url`. The console is served from this
      origin and calls this API on it; the `Origin` check above is made against it.
    variables:
      edgeBaseUrl:
        default: https://edge.partner.example.com

security:
  - sessionCookie: []

tags:
  - name: Console
    description: The fixed sign-in and sign-out paths, and the static files of the console.
  - name: Me
    description: Who is signed in and what the edge knows of the partner.
  - name: Clients
    description: The partner's OAuth clients. Registration and some changes wait for the operator.
  - name: Resources
    description: The partner's resource servers and their endpoints.
  - name: Edges
    description: The edges of the partner's group and their enrollment tokens.
  - name: Revocations
    description: Ending the grants of the partner's own clients.
  - name: Audit
    description: The partner's audit trail, as kept by central.
  - name: Staff
    description: The partner's team, kept in the edge's own database.
  - name: Organisation
    description: The partner's settings and profile.

paths:
  /partner/login:
    get:
      operationId: partnerLogin
      summary: Sign in to the console
      description: |
        Redirects the browser to `/login/{presetId}` of the console's preset, which starts the
        authorization-code flow at the operator's authorization server. The console cannot know the
        preset before it has signed in, which is why this path is fixed and the edge looks it up.
        Both this path and the redirect target are served by the edge on its own origin.

        Not authenticated, and not served from central: the preset is the one central last
        reported for this partner (`GET /edge/partner/me`), held by the edge.
      tags: [Console]
      security: []
      responses:
        '303':
          description: Redirect to `/login/{presetId}`.
          headers:
            Location:
              description: The login path of the console's preset, for example `/login/console`.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '500':
          description: The preset's identifier could not be made into a redirect target (not expected in practice).

  /partner/logout:
    get:
      operationId: partnerLogout
      summary: Sign out of the console
      description: |
        Redirects the browser to `/logout/{presetId}` of the console's preset, which ends the
        session at the operator's authorization server and clears the cookie (see `edge.yaml`).
        Not authenticated.
      tags: [Console]
      security: []
      responses:
        '303':
          description: Redirect to `/logout/{presetId}`.
          headers:
            Location:
              description: The logout path of the console's preset, for example `/logout/console`.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '500':
          description: The preset's identifier could not be made into a redirect target (not expected in practice).

  /partner:
    get:
      operationId: partnerConsole
      summary: The console
      description: |
        The static console: `/partner` and `/partner/` answer the console's HTML page, and any other
        path under `/partner/` (for example `/partner/versola-partner.js`) a plain file from the
        directory the edge is configured with (`partner.console-directory`). Only plain files
        with a known extension (`html`, `js`, `css`, `map`, `svg`, `png`, `ico`, `woff2`, `json`,
        `txt`) are served; a path under `/partner/api` is never a file, a path with an empty or
        dot-leading segment is refused, and a symbolic link out of the directory is not a file of it.
        When no directory is configured, or the file is missing, the answer is `404`.

        The page is served with a strict `Content-Security-Policy` (own origin only, no framing)
        and `X-Content-Type-Options`, `X-Frame-Options` and `Referrer-Policy` headers.
        Not authenticated: the files hold no data; the API does.
      tags: [Console]
      security: []
      responses:
        '200':
          description: The page or file, with the security headers above and `Cache-Control` set to `no-cache`.
          content:
            text/html:
              schema:
                type: string
            '*/*':
              schema: {}
        '404':
          description: No console directory is configured, or no such servable file.

  /partner/api/me:
    get:
      operationId: getMe
      summary: Who is signed in
      description: |
        The partner, where the operator's services are, the signed-in staff member and their
        level, this edge, and the console's own client and preset.

        **Minimum level:** viewer. **Served by:** the edge itself, from what central last said
        (`GET /edge/partner/me`) and the team it keeps. It stays available while central is
        unreachable, and says so in `edge.central`; the partner data is then the last read, or
        the configuration snapshot's.
      tags: [Me]
      x-staff-level: viewer
      x-served-by: edge
      responses:
        '200':
          description: The signed-in member and their partner.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/RotatedSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerMe'
              example:
                partner:
                  id: acme
                  displayName: Acme Corp
                  logoUri: https://acme.example.com/logo.png
                  status: active
                  limits:
                    scopes: [openid, profile, orders.read]
                    redirectDomains: [acme.example.com]
                    maxClients: 5
                    maxEdges: 2
                    accessTokenTtlMax: 3600
                    refreshTokenTtlMax: 2592000
                    clientAuthMethods: [tls_client_auth, private_key_jwt]
                    rateLimitPolicy: standard
                  reviewAt: null
                  operator:
                    name: Versola
                    issuer: https://auth.example.com
                    mtlsUrl: https://mtls.auth.example.com
                    centralMtlsUrl: https://mtls.central.example.com
                staff:
                  sub: 7a1c2f0e-5c5b-4f10-9e3f-2d6c1c8d0b11
                  display: Aigul S.
                  level: admin
                edge:
                  id: acme-edge-1
                  publicUrl: https://edge.partner.example.com
                  central: ok
                console:
                  clientId: acme-console
                  presetId: acme-console
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /partner/api/clients:
    get:
      operationId: listClients
      summary: List the partner's clients
      description: |
        Every client of the partner, those waiting for the operator included. The name is one
        string (English if the client has an English name, otherwise any locale's). `jwks` and
        `dpopBoundAccessTokens` are not shown.

        **Minimum level:** viewer. **Served by:** central (`GET /edge/partner/clients`).
      tags: [Clients]
      x-staff-level: viewer
      x-served-by: central
      responses:
        '200':
          description: The partner's clients.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/RotatedSession'
          content:
            application/json:
              schema:
                type: object
                required: [clients]
                properties:
                  clients:
                    type: array
                    items:
                      $ref: '#/components/schemas/PartnerClient'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenCentral'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/CentralUnavailable'
    post:
      operationId: createClient
      summary: Register a client
      description: |
        Registers a client of the partner. It is created waiting for the operator
        (`approval.status` `pending`, `approval.kind` `create`) and is answered `202` with the client
        as it now stands.

        Exactly the fields of `PartnerClientWrite` that are listed there are read; any other
        field (for example `postLogoutRedirectUris`) is ignored. `clientName` is stored as the
        English name. `authMethod` defaults to `tls_client_auth`; a partner client has no secret
        and no keys held by the operator. A blank `logoUri`, `policyUri`, `tosUri` or
        `backChannelLogoutUri` is stored as absent. Whether the values are inside the partner's
        limits is decided by central, which answers `400`; the text is in `message` (the
        `outside_limits` and `needs_approval` codes of the console's TypeScript contract are not
        sent by this edge).

        **Minimum level:** developer. **Served by:** central (`POST /edge/partner/clients`).
      tags: [Clients]
      x-staff-level: developer
      x-served-by: central
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerClientWrite'
            example:
              id: acme-web
              kind: web
              clientName: Acme web shop
              redirectUris: [https://acme.example.com/callback]
              scope: [openid, profile]
              accessTokenTtl: 900
              refreshTokenTtl: 86400
              backChannelLogoutUri: https://acme.example.com/logout/backchannel
      responses:
        '202':
          description: The client was registered and waits for the operator.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/RotatedSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerClient'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenCentral'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/CentralUnavailable'

  /partner/api/clients/{id}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    put:
      operationId: updateClient
      summary: Change a client
      description: |
        The console sends the client whole; the edge works out what changed against the client as
        central has it, and sends central only that. The fields compared are `clientName`,
        `logoUri`, `policyUri`, `tosUri`, `backChannelLogoutUri`, `redirectUris`, `scope`,
        `accessTokenTtl` and `refreshTokenTtl`; `kind` and `authMethod` are not changed by this
        call. A body `id`, if given, must equal the path's, else `400 invalid_request`.

        Inside the partner's limits and away from what the consent screen shows the change
        applies: `200`, with the client read back. A change of the name or the logo, or one
        outside what the operator lets through, waits for the operator: `202`, with the client
        and its `approval` naming the `waitingFields`.

        **Minimum level:** developer. **Served by:** central (`GET` then `PUT /edge/partner/clients`,
        then `GET` again).
      tags: [Clients]
      x-staff-level: developer
      x-served-by: central
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerClientWrite'
      responses:
        '200':
          description: The change applied; the client as it now stands.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/RotatedSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerClient'
        '202':
          description: The change waits for the operator; the client, with its `approval`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/RotatedSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerClient'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenCentral'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/CentralUnavailable'
    delete:
      operationId: deleteClient
      summary: Delete a client
      description: |
        **Minimum level:** developer. **Served by:** central (`DELETE /edge/partner/clients`).
      tags: [Clients]
      x-staff-level: developer
      x-served-by: central
      responses:
        '204':
          description: The client is deleted.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RotatedSession'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenCentral'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/CentralUnavailable'

  /partner/api/clients/{id}/withdraw:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    post:
      operationId: withdrawClient
      summary: Withdraw a client's pending request
      description: |
        Withdraws a request of the client that waits for the operator. A client that was never
        approved is gone afterwards, and the answer is what it was, with `approval.status`
        `rejected`; an approved client whose change was withdrawn is read back as it stands. No
        body.

        **Minimum level:** developer. **Served by:** central (`POST /edge/partner/clients/withdraw`,
        around two reads of the client).
      tags: [Clients]
      x-staff-level: developer
      x-served-by: central
      responses:
        '200':
          description: The client after the withdrawal.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/RotatedSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerClient'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenCentral'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/CentralUnavailable'

  /partner/api/clients/{id}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    post:
      operationId: rotateClientSecret
      summary: Rotate a client's secret (not supported)
      description: |
        A partner client has no secret: it authenticates with the group's certificate, which
        central issues and the edge renews, or with a key the partner holds. There is nothing to
        rotate, so this always answers `409 not_supported`. (The path exists because the console's
        contract names it; the TypeScript contract's `{ jwksUri, rotatedAt }` answer is never
        produced.) Central is not called.

        **Minimum level:** developer. **Served by:** the edge itself.
      tags: [Clients]
      x-staff-level: developer
      x-served-by: edge
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Always `not_supported`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not_supported
                message: 'a partner client authenticates with the group''s certificate: it has no secret to rotate'
        '500':
          $ref: '#/components/responses/InternalError'

  /partner/api/resources:
    get:
      operationId: listResources
      summary: List the partner's resources
      description: |
        The partner's resource servers. `internal`, `partnerId` and `audienceRateLimits` of
        central's resource are not shown: a partner's resource is always internal (the edge
        authenticates to it with a secret), is owned by the partner, and takes no audience limits
        here. The secret itself is never listed.

        **Minimum level:** viewer. **Served by:** central (`GET /edge/partner/resources`).
      tags: [Resources]
      x-staff-level: viewer
      x-served-by: central
      responses:
        '200':
          description: The partner's resources.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/RotatedSession'
          content:
            application/json:
              schema:
                type: object
                required: [resources]
                properties:
                  resources:
                    type: array
                    items:
                      $ref: '#/components/schemas/PartnerResource'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenCentral'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/CentralUnavailable'
    post:
      operationId: createResource
      summary: Register a resource
      description: |
        Registers a resource of the partner, with its endpoints. The audience must be the
        partner's own clients (central refuses others with `400`). An endpoint with no `id` is given
        a fresh UUID. The answer carries the resource as central now has it and the secret the edge
        authenticates to the upstream with, **shown once**.

        **Minimum level:** developer. **Served by:** central (`POST /edge/partner/resources`, then
        `GET` to read the resource back).
      tags: [Resources]
      x-staff-level: developer
      x-served-by: central
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerResourceWrite'
            example:
              resourceId: orders-api
              resource: https://orders.acme.example.com
              audience: [acme-web]
              endpoints:
                - method: GET
                  path: /orders
                  fetchUserInfo: false
                  allow: 'true'
                  inject: []
      responses:
        '201':
          description: The resource was created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/RotatedSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResource'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenCentral'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/CentralUnavailable'

  /partner/api/resources/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      operationId: updateResource
      summary: Replace a resource
      description: |
        The console sends the resource whole; central takes a change, so the edge works it out
