  /partner/api/edges:
    get:
      operationId: listEdges
      summary: List the partner's edges
      description: |
        The edges of the partner's group. An edge is `waiting` until central has issued it a
        certificate, then `enrolled`; every edge of a suspended partner is `suspended`. The group's
        policies are the operator's and read-only. `replicas` is always `0`: central does not count
        the replicas behind an edge.

        **Minimum level:** viewer. **Served by:** central (`GET /edge/partner/edges`).
      tags: [Edges]
      x-staff-level: viewer
      x-served-by: central
      responses:
        '200':
          description: The partner's edges.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
