  /partner/api/revocations:
    post:
      operationId: createRevocation
      summary: End sessions on this edge
      description: |
        Ends sessions that this edge holds: the next request made with any of them is refused
        (`401`), and the refresh tokens the edge kept for them are deleted. The sessions are those
        of the partner's own applications and of the console, which are the only ones this edge has.

        **This is local to the edge.** Its own revocation list and session store are used: central
        and the authorization server are not asked and nothing is sent anywhere, so it works while
        central is unavailable. Access tokens that the edge does not hold a session for (a native
        app's, which keeps its own) are not reached.

        * `by: user`: `value` is the user's `sub`; every session of that user here ends, and the
          user is put on the revocation list (they can sign in again at once).
        * `by: sid`: `value` is the SSO session id (`sid`); that session ends.
        * `by: fam`: `value` is a refresh-token family (`fam_id`); the sessions of that family end.

        `ended` is how many live sessions of this edge it ended. A session stored before the edge
        kept its access token is revoked but not counted. `clients` and `edges` of the console's
        request are ignored (there is one edge, and its store holds this partner's clients' sessions
        only), as is any `by` other than the three above (`by: client` is `400`).

        **Minimum level:** admin. **Served by:** the edge.
      tags: [Revocations]
      x-staff-level: admin
      x-served-by: edge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevocationRequest'
            example:
              by: user
              value: 2f6d0f70-6a0e-4b8e-a2a1-0f7c5b8f7d11
      responses:
        '200':
          description: The sessions were ended.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/RotatedSession'
          content:
            application/json:
              schema:
                type: object
                required: [ended]
                properties:
                  ended:
                    type: integer
                    minimum: 0
                    description: How many live sessions of this edge were ended.
    get:
      operationId: listRevocations
      summary: List the revocations staff made
      description: |
        The revocations the partner's administrators made on this edge, newest first, from the
        edge's own record of them (the same events appear in the audit trail under
        `kind=revocations`). `clients` and `edges` are always empty.

        **Minimum level:** admin. **Served by:** the edge.
      tags: [Revocations]
      x-staff-level: admin
      x-served-by: edge
      responses:
        '200':
          description: The revocations, newest first.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/RotatedSession'
          content:
            application/json:
              schema:
                type: object
                required: [revocations]
                properties:
                  revocations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Revocation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenCentral'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/CentralUnavailable'

  /partner/api/audit:
    get:
      operationId: listAudit
      summary: Read the audit trail
      description: |
        The events about the partner, newest first: what its staff did through its edges and what
        the operator decided about it. A page is at most 50 events; `next` is the cursor of the
        following page, `null` at the end (an opaque cursor of the edge's own). `kind` is a group of
        the console (`clients`, `resources`, `edges`, `team`, `revocations`, `security`) or, for any
        other value, one audit kind of central's such as `admin.partner-client.create`; `actor` is
        `team`, `operator` or `edges`, or one staff `sub`; `q` is a free-text search. A group is
        matched on the edge against the kinds of central's events, which are read page by page
        until a page's worth is found (so a page may hold fewer, or a little more, than 50). The
        events of the team itself (an invite, a change of level, a removal, an admission) are the
        edge's own and are laid among central's by time; `kind=team` is those alone. Other query
        parameters are ignored.

        **Minimum level:** viewer. **Served by:** central (`GET /edge/partner/audit`) and the edge
        (the team's events).
      tags: [Audit]
      x-staff-level: viewer
      x-served-by: central
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: The `next` of the previous page. An invalid cursor is `400 invalid_request`.
        - name: actor
          in: query
          required: false
          schema:
            type: string
          description: Only events of this actor (a staff `sub`).
        - name: kind
          in: query
          required: false
          schema:
            type: string
          description: Only events of this audit kind.
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Free-text filter.
      responses:
        '200':
          description: A page of events.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/RotatedSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
              example:
                events:
                  - id: 8d3a3b0a-9c1f-4a3e-a7a7-5a3b5d0f1c11
                    at: '2026-11-10T09:14:21Z'
                    actor:
                      sub: 7a1c2f0e-5c5b-4f10-9e3f-2d6c1c8d0b11
                    action: admin.partner-client.create
                    target: partner-client:acme-web
                    outcome: ok
                    from: acme-edge-1
                  - id: 1b9e4d3f-2c70-4c4e-8f5c-0d3b9a7e6a22
                    at: '2026-11-10T10:02:05Z'
                    actor:
                      sub: operator
                      byOperator: true
                    action: admin.partner-approval.update
                    target: partner-approval:3f1c
                    outcome: ok
                next: null
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenCentral'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/CentralUnavailable'

  /partner/api/staff:
    get:
      operationId: listStaff
      summary: List the team
      description: |
        The partner's team: members (those who have signed in) and invitations nobody has taken
        yet. Neither the identifier an invitation names nor its hash is returned, only its masked
        form.

        **Minimum level:** admin. **Served by:** the edge itself (its own database).
