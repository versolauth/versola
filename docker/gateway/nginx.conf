# versola-gateway's main nginx.conf: nginx:1.30-alpine's stock file, copied
# verbatim, plus the load_module line right below. load_module only works
# in this main context -- conf.d/ (where versola-tools' routing is mounted)
# is inside `http`, too late for it.
#
# Shipped with COPY rather than patched with `RUN sed` on purpose: the
# gateway is built for linux/amd64 and linux/arm64 on an amd64 runner with
# no QEMU (see ci-cd.yml), so nothing may execute at build time. And it's
# not loaded via `nginx -g` at runtime either: every other nginx command in
# the container (nginx -t / -T / -s reload) re-reads this file without that
# -g and would fail on the acme_* directives.
#
# ngx_http_acme_module ships in the official image since 1.29.1 (vps TLS,
# see versola-tools' entrypoint.sh). Loading it is harmless where no
# acme_issuer is configured (docker-local, vps behind an external proxy).
#
# When bumping the base image, re-diff against its stock file:
#   docker run --rm nginx:<version>-alpine cat /etc/nginx/nginx.conf
load_module modules/ngx_http_acme_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
