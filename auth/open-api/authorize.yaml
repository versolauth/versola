openapi: 3.1.0
info:
  title: Versola Auth — Authorization Endpoint
  version: 1.0.0
  description: |
    OAuth 2.1 authorization endpoint. Starts the Authorization Code flow with PKCE.

    The endpoint accepts the same parameter set over `GET` (query string) and `POST`
    (`application/x-www-form-urlencoded` body). A parameter supplied more than once is
    rejected, except `resource`, which is repeatable.

    Either the request carries its parameters inline, or it carries a single `request_uri`
    obtained from `POST /par` alongside `client_id`; in the latter case the pushed payload
    replaces every other parameter and is consumed on first use. A third form carries a signed
    JWT-Secured Authorization Request (RFC 9101) in `request`, again alongside `client_id`;
    the object's claims then replace every other parameter.

    PKCE is mandatory and only `S256` is accepted. The authorization response always carries
    the RFC 9207 `iss` parameter, and may be returned as a signed JARM `response` JWT
    depending on `response_mode`.
  license:
    name: Business Source License 1.1
    url: https://github.com/versolauth/versola/blob/main/LICENCE.md

servers:
  - url: https://auth.example.com
    description: Auth service issuer origin

paths:
  /authorize:
    get:
      operationId: authorizeGet
      summary: Start an authorization request
      description: |
        Parameters are read from the query string.
      tags: [Authorization]
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/RedirectUri'
        - $ref: '#/components/parameters/ResponseType'
        - $ref: '#/components/parameters/ResponseMode'
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/CodeChallenge'
        - $ref: '#/components/parameters/CodeChallengeMethod'
        - $ref: '#/components/parameters/State'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Prompt'
        - $ref: '#/components/parameters/MaxAge'
        - $ref: '#/components/parameters/AcrValues'
        - $ref: '#/components/parameters/UiLocales'
        - $ref: '#/components/parameters/Claims'
        - $ref: '#/components/parameters/LoginHint'
        - $ref: '#/components/parameters/IdTokenHint'
        - $ref: '#/components/parameters/Resource'
        - $ref: '#/components/parameters/AuthorizationDetails'
        - $ref: '#/components/parameters/DpopJkt'
        - $ref: '#/components/parameters/RequestUri'
        - $ref: '#/components/parameters/Request'
        - $ref: '#/components/parameters/UserAgent'
        - $ref: '#/components/parameters/SessionCookie'
        - $ref: '#/components/parameters/UserAgentCookie'
      responses:
        '303':
          $ref: '#/components/responses/SeeOther'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      operationId: authorizePost
      summary: Start an authorization request
      description: |
        Parameters are read from the form body. A repeated `resource` field is joined by
        zio-http into one comma-separated value; the server splits it back apart only before
        another absolute-URI scheme, so a comma that belongs to a resource URI is preserved.
      tags: [Authorization]
      security: []
      parameters:
        - $ref: '#/components/parameters/UserAgent'
        - $ref: '#/components/parameters/SessionCookie'
        - $ref: '#/components/parameters/UserAgentCookie'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthorizeRequest'
      responses:
        '303':
          $ref: '#/components/responses/SeeOther'
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  parameters:
    ClientId:
      name: client_id
      in: query
      required: true
      description: |
        Identifier of the registered client. Required even when `request_uri` or `request` is
        used, and must then match the client that pushed or signed the request.
      schema:
        type: string
      example: web-app

    RedirectUri:
      name: redirect_uri
      in: query
      required: false
      description: |
        Absolute URI without a fragment, exactly matching one of the client's registered
        redirect URIs. Required unless `request_uri` or `request` is used, in which case it
        comes from the pushed payload or the request object.
      schema:
        type: string
        format: uri
      example: https://app.example.com/callback

    ResponseType:
      name: response_type
      in: query
      required: false
      description: |
        `code` for the plain authorization code flow, `code id_token` to additionally receive an
        ID token in the redirect (OIDC hybrid; `nonce` is then required and the response
        defaults to the fragment). Required unless `request_uri` or `request` is used. Any
        other value fails with `unsupported_response_type`.
      schema:
        type: string
        enum: [code, code id_token]
      example: code

    ResponseMode:
      name: response_mode
      in: query
      required: false
      description: |
        Where the authorization response is placed, and whether it is a signed JARM `response`
        JWT. Defaults to `query` for `code` and `fragment` for `code id_token`. `query` and
        `query.jwt` are refused for `code id_token`, as is any unknown value
        (`invalid_request`). `jwt` is shorthand for `fragment.jwt` when the response type
        returns an `id_token` and `query.jwt` otherwise.
      schema:
        type: string
        enum: [query, fragment, jwt, query.jwt, fragment.jwt]
      example: query

    Scope:
      name: scope
      in: query
      required: false
      description: |
        Space-delimited scope tokens. Include `openid` to obtain an ID token from `/token`
        and to be allowed to call `/userinfo`. Omitting it defaults to the client's full
        registered scope, both here and when the request arrives via `request_uri` or
        `request`.

        Every token must be one the client is registered for; naming any other fails the
        request with `invalid_scope`.
      schema:
        type: string
      example: openid profile email

    CodeChallenge:
      name: code_challenge
      in: query
      required: false
      description: |
        PKCE code challenge (RFC 7636 §4.2): the unpadded base64url encoding of a SHA-256
        digest, so exactly 43 characters. Required unless `request_uri` or `request` is used,
        in which case it comes from the pushed payload or the request object.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
      example: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM

    CodeChallengeMethod:
      name: code_challenge_method
      in: query
      required: false
      description: |
        Transformation applied to the code verifier. Only `S256` is accepted; there is no
        default, so omitting it fails with `invalid_request` just like any other value.
        Required unless `request_uri` or `request` is used.
      schema:
        type: string
        enum: [S256]
      example: S256

    State:
      name: state
      in: query
      required: false
      description: |
        Opaque value echoed back on the redirect, used by the client for CSRF protection.
        Limited to 128 characters, because it is also carried in the conversation cookie.
      schema:
        type: string
        maxLength: 128
      example: af0ifjsldkj

    Nonce:
      name: nonce
      in: query
      required: false
      description: |
        Value bound into the ID token to associate it with this client session. Required when
        `response_type` is `code id_token`.
      schema:
        type: string

    Prompt:
      name: prompt
      in: query
      required: false
      description: |
        Space-delimited list of `none`, `login`, `consent` and `select_account`. `none` must not
        be combined with any other value; unrecognised values are ignored.
      schema:
        type: string
      example: login consent

    MaxAge:
      name: max_age
      in: query
      required: false
      description: |
        Maximum acceptable age of the existing authentication, in seconds. An older
        authentication forces re-authentication. Non-numeric values are ignored.
      schema:
        type: integer
        format: int64
        minimum: 0

    AcrValues:
      name: acr_values
      in: query
      required: false
      description: |
        Space-delimited Authentication Context Class Reference values, in order of preference.
        Present but empty is rejected. A value the client's auth flow cannot satisfy fails
        with `unmet_authentication_requirements`.
      schema:
        type: string

    UiLocales:
      name: ui_locales
      in: query
      required: false
      description: |
        Space-delimited BCP 47 language tags, in order of preference. If none of them is
        supported the request fails with `invalid_request`.
      schema:
        type: string
      example: ru en

    Claims:
      name: claims
      in: query
      required: false
      description: |
        OIDC claims request as a JSON object (OpenID Connect Core §5.5), selecting individual
        claims for the ID token and the UserInfo response. A value that is not valid JSON of
        that shape fails with `invalid_request`.
      schema:
        type: string
        contentMediaType: application/json

    LoginHint:
      name: login_hint
      in: query
      required: false
      description: |
        Pre-fills the identifier on the login form. A value beginning with `+` followed by
        digits is treated as a phone number, anything else as an email address. The hint is
        rejected unless the client's auth flow accepts that credential type, and phone hints
        must additionally match one of the configured phone prefixes.
      schema:
        type: string
      example: user@example.com

    IdTokenHint:
      name: id_token_hint
      in: query
      required: false
      description: |
        Previously issued ID token identifying the user the client expects to authenticate.
        One that cannot be verified fails with `invalid_request`, and it must not be combined
        with `login_hint` (also `invalid_request`).
      schema:
        type: string

    Resource:
      name: resource
      in: query
      required: false
      description: |
        RFC 8707 resource indicator. Repeatable; each value must resolve to a resource
        registered for the client's tenant, and determines the `aud` of the issued access
        token. When omitted, the client's public resources plus the edge indicator
        (`resource://edge`) are used.

        Resources are either public or internal. A public resource's own URI may be requested
        directly; the issued token is meant to be presented to it. An internal resource is
        addressed as `resource://{resourceId}` and may be requested on its own — the token is
        then presented to the edge service, which holds the credentials to call the resource
        and strips the caller's token before forwarding — but not together with the explicit
        edge indicator `resource://edge` in the same request; that combination is rejected.
      schema:
        type: array
        items:
          type: string
          format: uri
      style: form
      explode: true
      example: [https://api.example.com]

    AuthorizationDetails:
      name: authorization_details
      in: query
      required: false
      description: |
        RFC 9396 fine-grained authorization request: a JSON array of objects, each with a
        `type` member (required) selecting one of the authorization detail types registered
        for the client's tenant, plus whatever type-specific members that type's schema
        defines. An object may also carry `locations`, validated exactly like the `resource`
        parameter above (including the internal-resource / edge-indicator rule).

        Every object must validate against its type's registered JSON Schema; an unknown
        `type`, a schema violation, or a `locations` value that fails the same validation as
        `resource` fails the whole request with `invalid_authorization_details`. The granted
        details are echoed back unchanged in the token response's `authorization_details`
        member and carried in the access token, for the resource server to act on.
      schema:
        type: string
        contentMediaType: application/json
      example: |
        [{"type": "payment_initiation", "actions": ["initiate"], "locations": ["https://api.example.com"]}]

    DpopJkt:
      name: dpop_jkt
      in: query
      required: false
      description: |
        RFC 9449 §10: the JWK thumbprint of the key the client will redeem the resulting code
        against — base64url-encoded SHA-256, 43 characters. The code is bound to it, and
        `POST /token` refuses to redeem that code for a DPoP proof over any other key (or for
        no proof at all) with `invalid_grant`. A value that is not a thumbprint is rejected
        here rather than at redemption, with `invalid_request`.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
      example: 0ZcOCORZNYy-DWpqq30jZyJGHTN0d2HglBV3uiguA4I

    RequestUri:
      name: request_uri
      in: query
      required: false
      description: |
        Reference returned by `POST /par`. Replaces every other authorization parameter except
        `client_id`, which is required and must match the client that pushed the request.
        Single-use; an unknown, expired, already used or mismatched reference is answered
        with the `400` below, since the pushed payload (and so its `redirect_uri`) cannot be
        trusted.
      schema:
        type: string
        pattern: '^urn:ietf:params:oauth:request_uri:'
      example: urn:ietf:params:oauth:request_uri:6esc_11ACC5bwc014ltc14eY22c

    Request:
      name: request
      in: query
      required: false
      description: |
        RFC 9101 signed request object (JWT) carrying the authorization parameters as claims,
        signed with a key from the client's registered JWK Set using an algorithm listed in
        `request_object_signing_alg_values_supported`. `client_id` must accompany it. When
        present, the object's claims replace every other parameter; anything added outside
        the signature is ignored. `iss`, `aud`, `exp` and `jti` are validated and a `jti` may
        be used only once. A request object that fails verification is answered with `400`
        and `invalid_request_object`. Must not be repeated, and is not combined with
        `request_uri`.
      schema:
        type: string

    UserAgent:
      name: User-Agent
      in: header
      required: false
      description: Recorded with the authentication session for device recognition.
      schema:
        type: string

    SessionCookie:
      name: SSO_SESSION
      in: cookie
      required: false
      description: |
        Signed session cookie from an earlier authentication. When it resolves to a live
        session that satisfies `prompt`, `max_age` and `acr_values`, the request is
        authorized without showing the login form.
      schema:
        type: string

    UserAgentCookie:
      name: SSO_USER_AGENT_ID
      in: cookie
      required: false
      description: Signed device identifier, used to recognise a returning browser.
      schema:
        type: string

  schemas:
    AuthorizeRequest:
      type: object
      description: |
        Only `client_id` is unconditionally required. `redirect_uri`, `response_type` and
        `code_challenge` (with `code_challenge_method`) are required inline, but come from the
        pushed payload when `request_uri` is used, or from the request object when `request`
        is used. `scope` may always be omitted.
      required: [client_id]
      properties:
        client_id:
          type: string
        redirect_uri:
          type: string
          format: uri
        response_type:
          type: string
          enum: [code, code id_token]
        response_mode:
          type: string
          enum: [query, fragment, jwt, query.jwt, fragment.jwt]
        scope:
          type: string
        code_challenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        code_challenge_method:
          type: string
          enum: [S256]
        state:
          type: string
          maxLength: 128
        nonce:
          type: string
        prompt:
          type: string
        max_age:
          type: integer
          format: int64
        acr_values:
          type: string
        ui_locales:
          type: string
        claims:
          type: string
          contentMediaType: application/json
        login_hint:
          type: string
        id_token_hint:
          type: string
        resource:
          type: array
          items:
            type: string
            format: uri
        authorization_details:
          type: string
          contentMediaType: application/json
        dpop_jkt:
          type: string
          pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
        request_uri:
          type: string
        request:
          type: string
          description: RFC 9101 signed request object (JWT).

  responses:
    SeeOther:
      description: |
        Every outcome is a redirect. There are three shapes:

        - **Authorized** — back to `redirect_uri` with `code`, `iss` (RFC 9207), and `state`
          and `id_token` when applicable (`id_token` only for `response_type=code id_token`).
          Placed in the query or the fragment according to `response_mode`; under a `.jwt`
          mode every parameter instead travels as claims of a single signed `response` JWT.
        - **Authentication required** — to `/challenge`, setting the `SSO_CONVERSATION`
          cookie that carries the pending authorization request.
        - **Failed** — back to `redirect_uri` with `error`, `error_description`, `error_uri`
          (when available), `iss` and `state`, placed like a successful response.

        Failures that cannot be attributed to a registered redirect URI are answered with
        `400` instead, since redirecting them would be an open redirect.

        Error codes returned on the redirect: `invalid_request`, `unsupported_response_type`,
        `invalid_scope`, `login_required`, `consent_required`, `interaction_required`,
        `access_denied`, `invalid_target`, `invalid_authorization_details`,
        `unmet_authentication_requirements`. The `*_required` codes are only returned for
        `prompt=none`.

        A client registered with `requireSignedRequestObject` (RFC 9101 §10.5) or
        `requirePushedAuthorizationRequests` (RFC 9126 §6.2) is redirected `invalid_request`
        when the request it sent is not in that form — a plain parameter set from a client
        that must sign, or a request without a `request_uri` from one that must push.
      headers:
        Location:
          required: true
          schema:
            type: string
            format: uri
          examples:
            authorized:
              summary: Authorization code issued
              value: https://app.example.com/callback?code=SplxlOBeZQQYbYS6WxSbIA&state=af0ifjsldkj
            challenge:
              summary: User must authenticate
              value: /challenge
            failed:
              summary: Request rejected
              value: https://app.example.com/callback?error=invalid_request&error_description=Missing+required+parameter+-+code_challenge&state=af0ifjsldkj
        Set-Cookie:
          description: |
            `SSO_CONVERSATION`, set only when redirecting to `/challenge`. Holds the pending
            authorization request and expires with the client's conversation TTL. `/challenge`
            and the other conversation endpoints are the browser sign-in UI and are not part
            of this specification.
          schema:
            type: string

    BadRequest:
      description: |
        Answered directly, without a redirect, when the request cannot be attributed to a
        verified redirect URI or cannot be trusted to name one:

        - `client_id` or `redirect_uri` is missing, malformed, supplied more than once, or not
          registered for the client; or `request_uri` is unknown, expired, already used or
          belongs to another client. The body is a plain-text message.
        - the `request` object failed verification (bad signature, algorithm, audience,
          expiry, replayed `jti`, unknown client, ...). The body is JSON with
          `invalid_request_object`; the cause is never disclosed.
      content:
        text/plain:
          schema:
            type: string
          example: Either client_id or redirect_uri is somehow missing, invalid, provided multiple times or not registered
        application/json:
          schema:
            type: object
            required: [error, error_description]
            properties:
              error:
                type: string
                const: invalid_request_object
              error_description:
                type: string
          example:
            error: invalid_request_object
            error_description: The request parameter does not contain a valid Request Object for this client
