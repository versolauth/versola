openapi: 3.1.0
info:
  title: Versola Auth — Token Revocation Endpoint
  version: 1.0.0
  description: |
    OAuth 2.0 Token Revocation (RFC 7009). Invalidates an access token or a refresh token
    before it would otherwise expire.

    Both token formats are accepted and detected automatically. Revoking a refresh token also
    invalidates the tokens derived from it.

    Per RFC 7009 §2.2 the endpoint answers `200` for a token that is unknown, already expired,
    already revoked, or issued to a different client: the client's goal — that the token is no
    longer usable — is satisfied either way, and distinguishing the cases would leak whether a
    token exists. Only a client authentication failure is reported as an error.
  license:
    name: Business Source License 1.1
    url: https://github.com/versolauth/versola/blob/main/LICENCE.md

servers:
  - url: https://auth.example.com
    description: Auth service issuer origin

paths:
  /revoke:
    post:
      operationId: revoke
      summary: Revoke a token
      description: |
        Client authentication uses either `client_secret_basic` (the `Authorization` header) or
        `client_secret_post` (the `client_id` and `client_secret` form fields of the request
        body). Exactly one of the two must be used. The empty security requirement below stands
        for `client_secret_post`, which OpenAPI cannot express as a security scheme.
      tags: [Token]
      security:
        - clientSecretBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RevocationRequest'
            example:
              token: tGzv3JOkF0XG5Qx2TlKWIA
      responses:
        '200':
          $ref: '#/components/responses/Revoked'
        '401':
          $ref: '#/components/responses/InvalidClient'

components:
  securitySchemes:
    clientSecretBasic:
      type: http
      scheme: basic
      description: '`client_secret_basic` — `client_id` as the username, `client_secret` as the password.'

  schemas:
    RevocationRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: |
            The token to revoke. A value in JWT form is treated as an access token, anything
            else as an opaque refresh token.
        client_id:
          type: string
          description: Required for `client_secret_post`.
        client_secret:
          type: string
          description: Confidential clients using `client_secret_post`.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_client, unsupported_token_type]
        errorDescription:
          type: string

  responses:
    Revoked:
      description: |
        The token is not usable. Returned both when it was revoked by this call and when it
        was already unusable, with an empty body.

    InvalidClient:
      description: |
        Client authentication failed, or the `token` field is missing or malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid_client
            errorDescription: Client authentication failed
