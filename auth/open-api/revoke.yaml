openapi: 3.1.0
info:
  title: Versola Auth — Token Revocation Endpoint
  version: 1.0.0
  description: |
    OAuth 2.0 Token Revocation (RFC 7009). Invalidates an access token or a refresh token
    before it would otherwise expire.

    Both token formats are accepted and detected automatically. Revoking a refresh token also
    invalidates the tokens derived from it.

    Per RFC 7009 §2.2 the endpoint answers `200` for a token that is unknown, already expired,
    already revoked, malformed, or whose signature does not verify: the client's goal — that
    the token is no longer usable — is satisfied either way. Client authentication is still
    enforced first in every case.

    Errors are reported for a client authentication failure (`401`), for a token that was
    issued to a different client (`401 invalid_client`, RFC 7009 §2.1), and for a request
    without a `token` field (`400`).

    Revoking an access token (or a refresh token, for the access tokens of its family) also
    notifies the client's back channel, so the token is rejected there until it would have
    expired.
  license:
    name: Business Source License 1.1
    url: https://github.com/versolauth/versola/blob/main/LICENCE.md

servers:
  - url: https://auth.example.com
    description: Auth service issuer origin

paths:
  /revoke:
    post:
      operationId: revoke
      summary: Revoke a token
      description: |
        The client authenticates with the method it registered: `client_secret_basic` (the
        `Authorization` header), `client_secret_post` (`client_id` and `client_secret` as form
        fields), `private_key_jwt` (`client_assertion_type` and `client_assertion` form
        fields), a client certificate (`tls_client_auth` / `self_signed_tls_client_auth`, RFC
        8705), or, for a public client, `client_id` alone with no secret at all. At most one
        method may be used per request. The empty security requirement below stands for the
        form-field and certificate cases, which OpenAPI cannot express as a security scheme.

        The endpoint is also served at the `mtls_endpoint_aliases` address advertised in the
        discovery document.
      tags: [Token]
      security:
        - clientSecretBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RevocationRequest'
            example:
              token: tGzv3JOkF0XG5Qx2TlKWIA
      responses:
        '200':
          $ref: '#/components/responses/Revoked'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidClient'

components:
  securitySchemes:
    clientSecretBasic:
      type: http
      scheme: basic
      description: '`client_secret_basic` — `client_id` as the username, `client_secret` as the password.'

  schemas:
    RevocationRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: |
            The token to revoke. A value in JWT form is treated as an access token, anything
            else as an opaque refresh token.
        client_id:
          type: string
          description: Required for `client_secret_post` and for public clients.
        client_secret:
          type: string
          description: Confidential clients using `client_secret_post`.
        client_assertion_type:
          type: string
          const: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
          description: Clients using `private_key_jwt`; sent together with `client_assertion`.
        client_assertion:
          type: string
          description: Signed client assertion JWT (RFC 7523) for `private_key_jwt`.
        token_type_hint:
          type: string
          description: Accepted but ignored; the token format is detected from its shape.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_client, invalid_request]
        errorDescription:
          type: string
          description: |
            Note the camelCase member name: unlike the other endpoints, this one does not use
            `error_description`.

  responses:
    Revoked:
      description: |
        The token is not usable. Returned both when it was revoked by this call and when it
        was already unusable, with an empty body.

    InvalidRequest:
      description: The body is not a readable form, or the `token` field is missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid_request
            errorDescription: The request is missing the required 'token' parameter

    InvalidClient:
      description: |
        Client authentication failed (including an unreadable client certificate), or the
        token belongs to a different client.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid_client
            errorDescription: Client authentication failed
