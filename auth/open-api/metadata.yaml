openapi: 3.1.0
info:
  title: Versola Auth — Discovery Metadata Endpoints
  version: 1.0.0
  description: |
    Authorization server discovery metadata, published under both well-known locations
    defined by RFC 8414 (OAuth 2.0 Authorization Server Metadata) and OpenID Connect
    Discovery 1.0.

    Both paths serve the same document, so an OAuth-only client and an OIDC client discover
    the same server. Clients typically fetch this once at startup to learn the endpoint URLs
    and the capabilities to negotiate, rather than hard-coding them.

    The document is administrator-configured in `central` and synced to `auth`, so the exact
    member set reflects how the deployment is configured. The properties below are the ones a
    client should expect.
  license:
    name: Business Source License 1.1
    url: https://github.com/versolauth/versola/blob/main/LICENCE.md

servers:
  - url: https://auth.example.com
    description: Auth service issuer origin

paths:
  /.well-known/oauth-authorization-server:
    get:
      operationId: oauthAuthorizationServerMetadata
      summary: Retrieve authorization server metadata
      description: RFC 8414 location. No authentication required.
      tags: [Discovery]
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Metadata'

  /.well-known/openid-configuration:
    get:
      operationId: openIdConfiguration
      summary: Retrieve authorization server metadata
      description: |
        OpenID Connect Discovery location. Serves the same document as
        `/.well-known/oauth-authorization-server`.
      tags: [Discovery]
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Metadata'

components:
  schemas:
    ServerMetadata:
      type: object
      additionalProperties: true
      required: [issuer, authorization_endpoint, token_endpoint, jwks_uri, response_types_supported]
      properties:
        issuer:
          type: string
          format: uri
          description: |
            Identifier of this authorization server. Must equal the `iss` claim of issued
            tokens, and clients must reject tokens whose issuer differs.
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        userinfo_endpoint:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        introspection_endpoint:
          type: string
          format: uri
        revocation_endpoint:
          type: string
          format: uri
        pushed_authorization_request_endpoint:
          type: string
          format: uri
        end_session_endpoint:
          type: string
          format: uri
        response_types_supported:
          type: array
          items:
            type: string
        response_modes_supported:
          type: array
          items:
            type: string
          description: |
            Where the authorization response is placed, and whether it is signed. The `.jwt`
            forms (and the `jwt` shorthand, which resolves to `fragment.jwt` for a response
            type that returns an `id_token` and to `query.jwt` otherwise) are JARM: every
            response parameter travels inside a single signed `response` parameter.
        authorization_signing_alg_values_supported:
          type: array
          items:
            type: string
          description: |
            JARM §4: the algorithms a `response` JWT may be signed with, never `none`. Derived
            from the deployment's synced JWKS -- not a value an operator sets directly -- since
            a given response actually carries the algorithm of the tenant's own signing key; a
            client reads the `alg` of the JWKS entry named by the response's `kid` for the one
            it must verify with. Published so a client has this instead of having to assume
            the `RS256` default of JARM §3, which no client metadata here can override.
        grant_types_supported:
          type: array
          items:
            type: string
        scopes_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
          description: PKCE is mandatory, so this always includes `S256`.
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
        subject_types_supported:
          type: array
          items:
            type: string
        claims_supported:
          type: array
          items:
            type: string
        acr_values_supported:
          type: array
          items:
            type: string
        authorization_details_types_supported:
          type: array
          items:
            type: string
          description: |
            RFC 9396 §18: the union of `type` values registered across all tenants of this
            deployment. A type listed here is usable in the `authorization_details` parameter
            of `/authorize`, `/par` and `/token` only if it is also registered for the
            requesting client's own tenant; otherwise the request fails with
            `invalid_authorization_details`.
        authorization_response_iss_parameter_supported:
          type: boolean
          description: |
            RFC 9207 — the iss parameter is included in every authorization response
            (both successful and error redirects).
        request_object_signing_alg_values_supported:
          type: array
          items:
            type: string
          description: |
            RFC 9101 §4: the algorithms a `request` object may be signed with. Checked
            against, not merely advertised — an incoming object's `alg` must be named here,
            and an entry no verifier exists for is dropped rather than advertised. Never
            `none`: a request object is source authentication, so it is verified against the
            keys the client registered for `private_key_jwt`.
        request_parameter_supported:
          type: boolean
          description: |
            RFC 9101 §5.1: whether an authorization request may be passed by value in a
            signed `request` parameter. Always true.
        request_uri_parameter_supported:
          type: boolean
          description: |
            RFC 9101 §5.2: whether a request object may be passed by reference for this
            server to fetch. Always false — a `request_uri` here always names a pushed
            authorization request (RFC 9126), which carries the same object over an
            authenticated back channel instead of one this server would have to fetch.

  responses:
    Metadata:
      description: The server's discovery document.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerMetadata'
          example:
            authorization_response_iss_parameter_supported: true
            issuer: https://auth.example.com
            authorization_endpoint: https://auth.example.com/authorize
            token_endpoint: https://auth.example.com/token
            userinfo_endpoint: https://auth.example.com/userinfo
            jwks_uri: https://auth.example.com/.well-known/jwks.json
            introspection_endpoint: https://auth.example.com/introspect
            revocation_endpoint: https://auth.example.com/revoke
            pushed_authorization_request_endpoint: https://auth.example.com/par
            end_session_endpoint: https://auth.example.com/logout
            response_types_supported: [code, code id_token]
            response_modes_supported: [query, fragment, jwt, query.jwt, fragment.jwt]
            authorization_signing_alg_values_supported: [ES256, PS256]
            grant_types_supported: [authorization_code, refresh_token, client_credentials]
            scopes_supported: [openid, profile, email, phone]
            code_challenge_methods_supported: [S256]
            token_endpoint_auth_methods_supported: [client_secret_basic, client_secret_post, none]
            id_token_signing_alg_values_supported: [PS256]
            subject_types_supported: [public]
            request_object_signing_alg_values_supported: [ES256, PS256]
            request_parameter_supported: true
            request_uri_parameter_supported: false
