openapi: 3.1.0
info:
  title: Versola Auth — Token Introspection Endpoint
  version: 1.0.0
  description: |
    OAuth 2.0 Token Introspection (RFC 7662). Lets an authenticated client or resource server
    ask whether a token is currently active and retrieve its metadata.

    Both access tokens (JWTs) and refresh tokens (opaque) are accepted; the token format is
    detected automatically, so `token_type_hint` is unnecessary.

    A token that cannot be verified, has expired, was revoked, or does not belong to the
    calling client is reported as `{"active": false}` rather than as an error — the caller is
    never told why a token is not active.
  license:
    name: Versola Community License v1.0
    url: https://github.com/versolauth/versola/blob/main/LICENCE.md

servers:
  - url: https://auth.example.com
    description: Auth service issuer origin

paths:
  /introspect:
    post:
      operationId: introspect
      summary: Introspect a token
      description: |
        Client authentication is `client_secret_basic` (the `Authorization` header),
        `client_secret_post` (`client_id` and `client_secret` as form fields of the request
        body), or, for a public client, `client_id` alone with no secret at all. At most one
        of the two credentialed methods may be used per request. The empty security
        requirement below stands for the form-field cases, which OpenAPI cannot express as a
        security scheme.

        A client authenticates with the one method it registered (`authMethod`), and only with
        that one: a credential of another kind sent alongside is not consulted, and a secret
        sent for a client that registered `private_key_jwt` or a mutual-TLS method is refused.
        Two further methods are therefore available, each failing with `invalid_client`:

        - **`private_key_jwt`** (RFC 7523 §2.2) -- `client_assertion_type`
          `urn:ietf:params:oauth:client-assertion-type:jwt-bearer` and `client_assertion`, a JWT
          signed with a key from the client's registered JWK Set, as form fields. `client_id`
          is optional; when sent it must be the assertion's `sub`. An assertion beside a
          `client_secret` or an `Authorization` header is two methods and is refused, as is
          half the pair or another assertion type. The assertion's `aud` is the issuer
          identifier on a `fapi2` tenant; a `standard` tenant also accepts the issuer with
          `/introspect` appended. Its `jti` is single-use. The signing algorithms are those
          the metadata document advertises as `token_endpoint_auth_signing_alg_values_supported`.
        - **`tls_client_auth` and `self_signed_tls_client_auth`** (RFC 8705 §2) -- the client
          sends `client_id` with no secret and authenticates with its TLS client certificate:
          for `tls_client_auth` the registered subject value must appear in the certificate, for
          `self_signed_tls_client_auth` the certificate's public key must be one of the client's
          registered JWKs. The certificate reaches the server either on the TLS handshake of the
          mutual-TLS listener (`MPORT`), which serves this endpoint a second time at the origin
          the metadata document publishes under `mtls_endpoint_aliases`, or, behind a reverse
          proxy, in the header the client's tenant configured for forwarding it. The listener
          exists only when the deployment is configured with a `mutual-tls` block. A header that
          is present but cannot be read fails the request rather than being treated as absent.
      tags: [Token]
      security:
        - clientSecretBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IntrospectionRequest'
            example:
              token: eyJhbGciOiJSUzI1NiIsInR5cCI6ImF0K2p3dCJ9...
      responses:
        '200':
          $ref: '#/components/responses/Introspection'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidClient'

components:
  securitySchemes:
    clientSecretBasic:
      type: http
      scheme: basic
      description: '`client_secret_basic` — `client_id` as the username, `client_secret` as the password.'

  schemas:
    IntrospectionRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: |
            The token to introspect. A value in JWT form is treated as an access token,
            anything else as an opaque refresh token.
        client_id:
          type: string
          description: Required for `client_secret_post` and for public clients.
        client_secret:
          type: string
          description: Confidential clients using `client_secret_post`.
        client_assertion_type:
          type: string
          const: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
          description: Sent with `client_assertion` by clients using `private_key_jwt`.
        client_assertion:
          type: string
          description: |
            RFC 7523 client assertion JWT, for clients using `private_key_jwt`. Sent together
            with `client_assertion_type` and without any other credential.

    IntrospectionResponse:
      type: object
      required: [active]
      description: |
        Only `active` is guaranteed. When `active` is `false` every other member is absent.
      properties:
        active:
          type: boolean
        client_id:
          type: string
          description: Client the token was issued to.
        scope:
          type: string
          description: Space-delimited granted scopes.
        username:
          type: string
        token_type:
          type: string
          description: |
            `DPoP` for a token bound to a DPoP key (see `cnf.jkt`), `Bearer` otherwise -- including
            a token bound only to a client certificate (`cnf.x5t#S256`), which is presented as a
            bearer token.
        exp:
          type: integer
          format: int64
          description: Expiry, seconds since the epoch.
        iat:
          type: integer
          format: int64
          description: Issued at, seconds since the epoch.
        nbf:
          type: integer
          format: int64
          description: Not valid before, seconds since the epoch.
        sub:
          type: string
          description: User id, or the `client_id` for a `client_credentials` token.
        aud:
          type: array
          items:
            type: string
        iss:
          type: string
        jti:
          type: string
        cnf:
          type: object
          description: |
            RFC 7800 confirmation claim, present when the access or refresh token is
            sender-constrained and absent for a plain bearer token. The members are independent
            and a token may carry either or both.
          properties:
            jkt:
              type: string
              description: |
                RFC 9449 §6.2: base64url SHA-256 JWK thumbprint of the DPoP key the token is
                bound to. Such a token has `token_type` `DPoP`.
            x5t#S256:
              type: string
              description: |
                RFC 8705 §3.1: base64url SHA-256 hash of the DER-encoded client certificate
                the token is bound to. Present for a client that authenticates with a mutual-TLS
                certificate (other than an edge-fronted native client) or registered
                `tls_client_certificate_bound_access_tokens`; the resource server compares it
                with the certificate of the connection that presents the token.
        authorization_details:
          type: array
          items:
            type: object
          description: |
            RFC 9396 §9: the authorization details associated with the token, unchanged from
            how they were granted. Absent when the token carries none.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client]
        error_description:
          type: string

  responses:
    Introspection:
      description: |
        Introspection result. Returned with `200` whether or not the token is active.
      headers:
        Cache-Control:
          description: |
            `no-store`. Absent when an access token fails signature or format verification, as
            that outcome short-circuits to the inactive response.
          schema:
            type: string
            const: no-store
        Pragma:
          description: '`no-cache`. Absent under the same condition as `Cache-Control`.'
          schema:
            type: string
            const: no-cache
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntrospectionResponse'
          examples:
            active:
              summary: Active access token
              value:
                active: true
                client_id: web-app
                scope: openid profile email
                token_type: Bearer
                exp: 1735689600
                iat: 1735686000
                sub: 018f3c6e-5a2b-7c11-9d0e-4f8a2b6c1d33
                aud: [https://api.example.com]
                iss: https://auth.example.com
                jti: 9x8VJ0mQ0iKQxRZ8m6bTsw
            inactive:
              summary: Unknown, expired, revoked, or another client's token
              value:
                active: false

    InvalidRequest:
      description: The body is not a readable form, or the `token` field is missing.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid_request
            error_description: Request is missing a required parameter or is otherwise malformed

    InvalidClient:
      description: Client authentication failed.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid_client
            error_description: Client authentication failed
