openapi: 3.1.0
info:
  title: Versola Auth — Token Introspection Endpoint
  version: 1.0.0
  description: |
    OAuth 2.0 Token Introspection (RFC 7662). Lets an authenticated client or resource server
    ask whether a token is currently active and retrieve its metadata.

    Both access tokens (JWTs) and refresh tokens (opaque) are accepted; the token format is
    detected automatically, so `token_type_hint` is unnecessary.

    A token that cannot be verified, has expired, is unknown, or is an access token the
    calling client may not introspect is reported as `{"active": false}` rather than as an
    error — the caller is never told why a token is not active. A refresh token that was
    issued to a different client is the exception: it is answered with `401 invalid_client`.
    Access tokens are verified by signature, type and expiry; the endpoint does not consult the
    access-token revocation list, while a revoked refresh token is unknown and so inactive.

    The calling client must be a resource server or client with its own credentials: unlike
    `/token`, `/par` and `/revoke`, a bare `client_id` is not accepted.

    An access token is only active for a caller that can use one of the token's audiences:
    the response `aud` is narrowed to the resources registered for the calling client (the
    `resource://edge` indicator expands to the issuing client's internal resources the caller
    has access to), and a token with an empty narrowed audience is reported as inactive.
  license:
    name: Business Source License 1.1
    url: https://github.com/versolauth/versola/blob/main/LICENCE.md

servers:
  - url: https://auth.example.com
    description: Auth service issuer origin

paths:
  /introspect:
    post:
      operationId: introspect
      summary: Introspect a token
      description: |
        The caller authenticates with `client_secret_basic` (the `Authorization` header),
        `client_secret_post` (`client_id` and `client_secret` as form fields),
        `private_key_jwt` (`client_assertion_type` and `client_assertion` form fields), or a
        client certificate (`tls_client_auth` / `self_signed_tls_client_auth`, RFC 8705).
        A secret is mandatory unless the client authenticates with an assertion or a
        certificate; a `client_id` alone is refused with `invalid_client`. At most one method
        may be used per request. The empty security requirement below stands for the
        form-field and certificate cases, which OpenAPI cannot express as a security scheme.

        The endpoint is also served at the `mtls_endpoint_aliases` address advertised in the
        discovery document.
      tags: [Token]
      security:
        - clientSecretBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IntrospectionRequest'
            example:
              token: eyJhbGciOiJSUzI1NiIsInR5cCI6ImF0K2p3dCJ9...
      responses:
        '200':
          $ref: '#/components/responses/Introspection'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidClient'

components:
  securitySchemes:
    clientSecretBasic:
      type: http
      scheme: basic
      description: '`client_secret_basic` — `client_id` as the username, `client_secret` as the password.'

  schemas:
    IntrospectionRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: |
            The token to introspect. A value in JWT form is treated as an access token,
            anything else as an opaque refresh token. A value that is neither is `invalid_request`.
        client_id:
          type: string
          description: Required for `client_secret_post`.
        client_secret:
          type: string
          description: Clients using `client_secret_post`.
        client_assertion_type:
          type: string
          const: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
          description: Clients using `private_key_jwt`; sent together with `client_assertion`.
        client_assertion:
          type: string
          description: Signed client assertion JWT (RFC 7523) for `private_key_jwt`.
        token_type_hint:
          type: string
          description: Accepted but ignored; the token format is detected from its shape.

    IntrospectionResponse:
      type: object
      required: [active]
      description: |
        Only `active` is guaranteed. When `active` is `false` every other member is absent.
        For a refresh token `nbf` and `jti` are absent and `exp` is the refresh token's expiry.
      properties:
        active:
          type: boolean
        client_id:
          type: string
          description: Client the token was issued to.
        scope:
          type: string
          description: Space-delimited granted scopes.
        username:
          type: string
        token_type:
          type: string
          enum: [Bearer, DPoP]
          description: |
            `DPoP` when the token is bound to a DPoP key (RFC 9449 §6.2), `Bearer` otherwise
            (including certificate-bound tokens). Also present for refresh tokens.
        cnf:
          type: object
          additionalProperties: true
          description: |
            Confirmation claim of a sender-constrained token: `jkt` for a DPoP-bound token
            (RFC 9449 §6.2), `x5t#S256` for a certificate-bound one (RFC 8705 §3.1).
        exp:
          type: integer
          format: int64
          description: Expiry, seconds since the epoch.
        iat:
          type: integer
          format: int64
          description: Issued at, seconds since the epoch.
        nbf:
          type: integer
          format: int64
          description: Not valid before, seconds since the epoch.
        sub:
          type: string
          description: User id, or the `client_id` for a `client_credentials` token.
        aud:
          type: array
          items:
            type: string
          description: Audiences of the token that are visible to the calling client.
        iss:
          type: string
        jti:
          type: string
          description: Present for access tokens only.
        authorization_details:
          type: array
          items:
            type: object
          description: |
            RFC 9396 §9: the authorization details associated with the token, unchanged from
            how they were granted. Absent when the token carries none.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client]
        error_description:
          type: string
          description: |
            No `error_uri` is returned.

  responses:
    Introspection:
      description: |
        Introspection result. Returned with `200` whether or not the token is active.
      headers:
        Cache-Control:
          description: |
            `no-store`. Absent when an access token fails signature or format verification, as
            that outcome short-circuits to the inactive response.
          schema:
            type: string
            const: no-store
        Pragma:
          description: '`no-cache`. Absent under the same condition as `Cache-Control`.'
          schema:
            type: string
            const: no-cache
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntrospectionResponse'
          examples:
            active:
              summary: Active access token
              value:
                active: true
                client_id: web-app
                scope: openid profile email
                token_type: Bearer
                exp: 1735689600
                iat: 1735686000
                sub: 018f3c6e-5a2b-7c11-9d0e-4f8a2b6c1d33
                aud: [https://api.example.com]
                iss: https://auth.example.com
                jti: 9x8VJ0mQ0iKQxRZ8m6bTsw
            inactive:
              summary: Unknown, expired, revoked, or another client's token
              value:
                active: false

    InvalidRequest:
      description: The body is not a readable form, or the `token` field is missing or is neither a JWT nor a well-formed refresh token.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid_request
            error_description: Request is missing a required parameter or is otherwise malformed

    InvalidClient:
      description: |
        Client authentication failed (unknown client, bad or missing credentials, a
        `client_id` without a secret, more than one method, or an unreadable client
        certificate), or a refresh token that belongs to another client was presented. The
        description reads `Client is not authorized to introspect this token` in the latter
        case.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid_client
            error_description: Client authentication failed
