# What `auth` runs with for every key its config file leaves out. The case classes the keys are read into have no
# defaults of their own (so there is one place to look); the deployment's env.conf, and the overlay file
# (CONFIG_OVERLAY_PATH, which the chart fills from `services.auth.antifraud`), are laid over this file key by key.
#
# Antifraud is off: every switch below is false, so a deployment that does not set a key sees no change. Each key is described in deploy.md ("Antifraud"), with a recommended profile for SMS pumping.

antifraud {
  # The event log. `retention` also bounds how long a decision can be explained, and must not exceed the period
  # personal data may be kept.
  queue-capacity      = 20000
  batch-size          = 1000
  flush-interval      = "1 second"
  retention           = "14 days"
  partitions-ahead    = 3
  stats-interval      = "1 minute"
  stats-lookback      = "2 minutes"
  stats-retention     = "30 days"
  stats-prefix-length = 4

  # What a deployment sets: the sizes and the switches. The thresholds, weights, limits on codes sent and delays are not
  # configuration: they are tuned during an attack, so they live in the database (`af_settings`, deploy.md) and are
  # changed through central's admin API without a restart.

  # Codes sent to one range of numbers are limited per range, a tenant and the first `prefix-length` digits; `max-ranges`
  # bounds what is tracked.
  sms-budget {
    prefix-length = 4
    max-ranges    = 10000
  }

  # The rule engine. `failure-action` (one of allow, challenge, delay, fake, review, block) is what a request gets when
  # the evaluation fails, takes longer than `timeout`, or the stored tuning has not been read yet.
  decision {
    enabled        = false
    timeout        = "20 milliseconds"
    failure-action = "delay"
  }

  # A `Challenge` decision put to the client as a proof of work: the switch and what a challenge lives for. How much
  # work is asked (the difficulty) is a tuned setting.
  challenge {
    enabled      = true
    ttl          = "2 minutes"
    max-attempts = 5
  }

  # Counts per phone, address, device, ASN and range of numbers: the switch and the sizes. The limits are tuned settings.
  velocity {
    enabled        = false
    max-keys       = 20000
    stripes        = 8
    flush-interval = "10 seconds"
    load-interval  = "20 seconds"
    share-from     = 3
    max-flush-rows = 20000
    max-load-keys  = 20000
  }

  # How often an instance looks for a change of the tuning stored in the database (thresholds, weights, shadow rules,
  # limits on codes sent, timings; changed through the admin API, see deploy.md).
  tuning {
    refresh-interval = "5 seconds"
  }

  # Allow, watch and deny lists, changed through central's admin API.
  lists {
    enabled            = false
    refresh-interval   = "5 seconds"
    hit-flush-interval = "30 seconds"
    watch-weight       = 20
    allow-weight       = 1000
    max-traffic-share  = 0.05
    share-min-events   = 100
    audit-retention    = "365 days"
    startup-timeout    = "30 seconds"
  }

  # Detectors that propose list entries from the statistics. They only propose; nothing is enforced without a decision.
  detectors {
    enabled           = false
    interval          = "1 minute"
    settle            = "2 minutes"
    statement-timeout = "10 seconds"
    max-proposals     = 20
    candidates        = 200
    open-for          = "12 hours"
    cooldown          = "24 hours"
    ttl               = "24 hours"
    retention         = "90 days"
    batch-size        = 1000
    prefix-anomaly {
      enabled          = true
      window           = "15 minutes"
      baseline         = "24 hours"
      min-requests     = 50
      spike-factor     = 5.0
      baseline-floor   = 5.0
      min-sent         = 20
      max-conversion   = 0.2
      conversion-drop  = 0.5
      min-baseline-sent = 50
    }
    fake-verify {
      enabled           = true
      window            = "30 minutes"
      min-fake-verifies = 5
      max-verified      = 0
    }
  }
}
