# What `auth` runs with for every key its config file leaves out. The case classes the keys are read into have no
# defaults of their own (so there is one place to look); the deployment's env.conf, and the overlay file
# (CONFIG_OVERLAY_PATH, which the chart fills from `services.auth.antifraud`), are laid over this file key by key.
#
# Antifraud is off: every switch below is false and every threshold 0 (no limit), so a deployment that does not set a
# key sees no change. Each key is described in deploy.md ("Antifraud"), with a recommended profile for SMS pumping.

antifraud {
  # The event log. `retention` also bounds how long a decision can be explained, and must not exceed the period
  # personal data may be kept.
  queue-capacity      = 20000
  batch-size          = 1000
  flush-interval      = "1 second"
  retention           = "14 days"
  partitions-ahead    = 3
  stats-interval      = "1 minute"
  stats-lookback      = "2 minutes"
  stats-retention     = "30 days"
  stats-prefix-length = 4

  # Codes sent to one range of numbers (a tenant and the first `prefix-length` digits) per hour. Off while
  # `sent-per-hour` and `min-volume` are both 0.
  sms-budget {
    sent-per-hour  = 0
    min-volume     = 0
    min-conversion = 0.1
    prefix-length  = 4
    max-ranges     = 10000
  }

  # The rule engine: a score from the rules turns into a decision at the first threshold it reaches. 0 disables a
  # threshold. `failure-action` is one of allow, challenge, delay, fake, review, block.
  decision {
    enabled        = false
    delay-at       = 0
    challenge-at   = 0
    review-at      = 0
    block-at       = 0
    delay          = "2 seconds"
    timeout        = "20 milliseconds"
    failure-action = "challenge"
  }

  # Counts per phone, address, device, ASN and range of numbers. A limit is the most requests in a window, 0 for none;
  # a rule fires above it and adds `weight` to the score.
  velocity {
    enabled        = false
    max-keys       = 20000
    stripes        = 8
    flush-interval = "10 seconds"
    load-interval  = "20 seconds"
    share-from     = 3
    max-flush-rows = 20000
    max-load-keys  = 20000
    thresholds {
      phone  { per-minute = 0, per-ten-minutes = 0, per-hour = 0, per-day = 0, weight = 50 }
      ip     { per-minute = 0, per-ten-minutes = 0, per-hour = 0, per-day = 0, weight = 20 }
      device { per-minute = 0, per-ten-minutes = 0, per-hour = 0, per-day = 0, weight = 60 }
      asn    { per-minute = 0, per-ten-minutes = 0, per-hour = 0, per-day = 0, weight = 20 }
      prefix { per-minute = 0, per-ten-minutes = 0, per-hour = 0, per-day = 0, weight = 30 }
      trusted-discount = 40
    }
  }

  # Allow, watch and deny lists, changed through central's admin API.
  lists {
    enabled            = false
    refresh-interval   = "5 seconds"
    hit-flush-interval = "30 seconds"
    watch-weight       = 20
    allow-weight       = 1000
    max-traffic-share  = 0.05
    share-min-events   = 100
    audit-retention    = "365 days"
    startup-timeout    = "30 seconds"
  }

  # Detectors that propose list entries from the statistics. They only propose; nothing is enforced without a decision.
  detectors {
    enabled           = false
    interval          = "1 minute"
    settle            = "2 minutes"
    statement-timeout = "10 seconds"
    max-proposals     = 20
    candidates        = 200
    open-for          = "12 hours"
    cooldown          = "24 hours"
    ttl               = "24 hours"
    retention         = "90 days"
    batch-size        = 1000
    prefix-anomaly {
      enabled          = true
      window           = "15 minutes"
      baseline         = "24 hours"
      min-requests     = 50
      spike-factor     = 5.0
      baseline-floor   = 5.0
      min-sent         = 20
      max-conversion   = 0.2
      conversion-drop  = 0.5
      min-baseline-sent = 50
    }
    fake-verify {
      enabled           = true
      window            = "30 minutes"
      min-fake-verifies = 5
      max-verified      = 0
    }
  }
}
