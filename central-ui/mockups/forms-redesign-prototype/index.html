<!doctype html><meta charset="utf-8"><title>Versola forms · redesign directions</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#0e0f12;color:#e8e8ea;font:14px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
.bar{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;padding:12px 20px;border-bottom:1px solid #23252b}
.grp{display:flex;gap:4px;background:#17181d;padding:3px;border-radius:9px}
button{font:inherit;color:#9a9ca5;background:none;border:0;padding:6px 12px;border-radius:7px;cursor:pointer}button.on{background:#2a2c34;color:#fff}
.stage{flex:1;display:flex;justify-content:center;padding:16px;min-height:0;background:#17181d}
iframe{border:0;background:#fff;border-radius:10px;height:100%;transition:width .2s;max-width:100%}
.note{padding:12px 20px;border-top:1px solid #23252b;color:#a6a8b0;max-width:1100px}.note b{color:#fff}
</style>
<div class="bar">
 <div class="grp" id="v"></div><div class="grp" id="s"></div><div class="grp" id="d"></div><div class="grp" id="b"></div><div class="grp" id="m"></div>
</div>
<div class="stage"><iframe id="f"></iframe></div><div class="note" id="n"></div>
<script>
const V={a:['A · Editorial','<b>Без карточки.</b> Страница — это и есть форма: крупный заголовок, лейблы над полями, чёрная кнопка, тонкие линии. Брендинг тенанта минимален (логотип + имя клиента). Самый «взрослый» и безопасный вид; лучше всего масштабируется на любые логотипы и языки.'],
 b:['B · Split','<b>Контекст слева, действие справа.</b> Левая панель отдана бренду клиента (цвет, слоган) — пользователь сразу понимает, <i>куда</i> входит. На мобильном панель схлопывается в шапку. Хорош для white-label тенантов и для consent.'],
 c:['C · Utility','<b>Плотный «продуктовый» стиль</b> (Stripe/Linear): маленькая карточка без тени, 14px, поля 38px, цвет только на кнопке. Меньше всего визуального шума; ближе всего к нашему central-ui, формы и админка выглядят одной системой.'],
 d:['D · Brand-forward','<b>Тёплый и крупный.</b> Фон — цвет бренда клиента, форма — белый «лист» (на мобильном — bottom sheet), пилюли 56px, крупные тап-зоны. Самый дружелюбный для B2C (танцы, фитнес), но требует аккуратной темизации под произвольный цвет.']};
const S={signin:'Вход',['signin-error']:'Вход · ошибка',otp:'OTP',consent:'Согласие','set-password':'Пароль','passkey-enroll':'Passkey','access-denied':'Отказ','service-unavailable':'Сервис недоступен','signed-out':'Выход'};
const B={coral:['Coral','ff6b4a'],indigo:['Indigo','5b5bd6'],yellow:['Yellow','f5c518'],plum:['Plum','b4348a'],teal:['Teal','0e9f8e']};
const M={light:'Light',dark:'Dark'};
const D={desktop:['Desktop','100%'],tablet:['Tablet','768px'],mobile:['Mobile','390px']};
let st={v:'d',s:'signin',d:'desktop',b:'coral',m:'light',...Object.fromEntries(new URLSearchParams(location.search))};
const mk=(id,o,k)=>{const el=document.getElementById(id);el.innerHTML='';for(const key in o){const b=document.createElement('button');b.textContent=Array.isArray(o[key])?o[key][0]:o[key];b.className=st[k]==key?'on':'';b.onclick=()=>{st[k]=key;render()};el.append(b)}};
function render(){mk('v',V,'v');mk('s',S,'s');mk('d',D,'d');mk('b',B,'b');mk('m',M,'m');
 const f=document.getElementById('f');f.style.width=D[st.d][1];f.src=`${st.v}.html?t=${Date.now()}&brand=${B[st.b][1]}${st.m=='dark'?'&dark=1':''}#${st.s}`;
 document.getElementById('n').innerHTML=V[st.v][1];history.replaceState(0,'',`?v=${st.v}&s=${st.s}&d=${st.d}&b=${st.b}&m=${st.m}`)}
render();
</script>
