{{- if and .Values.central.enrollment.token (not .Values.central.enrollment.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "versola-edge.tokenSecret" . }}
  labels:
    {{- include "versola-edge.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.central.enrollment.key }}: {{ .Values.central.enrollment.token | quote }}
{{- end }}
