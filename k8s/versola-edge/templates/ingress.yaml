{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.className }}
{{- fail "ingress.className is required when ingress.enabled is true: an empty value falls back to the cluster's default IngressClass, and a cluster without one leaves the Ingress adopted by no controller" }}
{{- end }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.host is required when ingress.enabled is true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "versola-edge.fullname" . }}
  labels:
    {{- include "versola-edge.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "versola-edge.fullname" $ }}
                port:
                  number: {{ $.Values.port }}
          {{- end }}
{{- end }}
