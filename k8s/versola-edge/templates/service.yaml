apiVersion: v1
kind: Service
metadata:
  name: {{ include "versola-edge.fullname" . }}
  labels:
    {{- include "versola-edge.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "versola-edge.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
    - name: diagnostics
      port: {{ .Values.diagnosticsPort }}
      targetPort: diagnostics
