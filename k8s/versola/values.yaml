# Default values for the versola chart.
#
# Ground rules this chart follows (see #206 and deploy.md):
#   - No bundled Postgres. Point `config.existingSecret` (per service, below)
#     at an env.conf that already has an external connection URL.
#   - No bundled secret backend. This chart consumes secret values/refs
#     (native Secret, External Secrets Operator, Vault, ...), it never
#     generates or mandates one.
#   - HPA/PDB/topology spread are a separate issue (#211) -- out of scope
#     here.

nameOverride: ""
fullnameOverride: ""

global:
  # Images are pulled as <imageRegistry>/<imageRepository>/<repository>:<tag>,
  # e.g. ghcr.io/versolauth/versola-auth:0.4.0.
  imageRegistry: ghcr.io
  imageRepository: versolauth
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  # Pod placement, applied to every pod this chart renders. A component's own
  # `nodeSelector` / `tolerations` / `affinity`, when non-empty, REPLACES the
  # value here -- it is not merged with it, key by key or entry by entry. An
  # empty one inherits this. The one consequence worth knowing: a component
  # cannot opt out of a global value by setting its own to empty; give it a
  # different value instead.
  #
  # What this is for: sharing a cluster with other workloads on separate node
  # groups -- above all, keeping the load emulator (k8s/loadgen) and the
  # system under test off each other's nodes. A pod that ignores its placement
  # still schedules, just somewhere else, and nothing reports it.
  #
  # These three keys are read here and on a component, nowhere else. Setting
  # one at the TOP level of values instead fails the template, rather than
  # installing a release that reports success and places nothing.
  nodeSelector: {}
  tolerations: []
  affinity: {}

# terminationGracePeriodSeconds / preStopSleepSeconds for the JVM services
# (auth, central, edge) below.
#
# VersolaApp.gracefulShutdownTimeout (see util/src/main/scala/versola/util/http/VersolaApp.scala)
# is 15s: on SIGTERM the app itself waits up to that long for the HTTP
# server to drain and finalizers (Hikari pool close, span flush) to run
# before the JVM exits on its own.
#
# preStopSleepSeconds delays *sending* that SIGTERM by a few seconds --
# kubelet only sends it once the preStop hook returns -- giving
# kube-proxy/endpoint controllers time to stop routing new traffic to a
# pod that's already Terminating. Without it, a pod can receive a new
# request in the same instant it starts shutting down.
#
# terminationGracePeriodSeconds must cover both phases plus a margin for
# the JVM to actually exit, or kubelet SIGKILLs before graceful shutdown
# finishes: preStopSleepSeconds (5s) + gracefulShutdownTimeout (15s) + 10s
# margin = 30s.
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 30

# Size of the emptyDir each pod gets at /diagnostics, where the JVM writes its
# heap dump and GC log (docker/Dockerfile.*'s JAVA_OPTS). One dump is at most
# about -Xmx (512m today) and the GC log is capped at 5 x 20M, so 1Gi holds a
# dump and its logs. Per-service override: services.<name>.diagnosticsSizeLimit.
diagnosticsSizeLimit: 1Gi

# Secret values auth/central/edge's env.conf files reference as `${VAR}`
# placeholders (see scripts/gen-env.scala's secretField/useOpenBao) -- e.g.
# ACCESS_TOKENS_SECRET, EDGE_PRIVATE_KEY, POSTGRES_PASSWORD. Delivered as
# real process env vars via secretKeyRef, not baked into the mounted
# env.conf itself (that's `services.<name>.config.existingSecret`, a
# separate Secret -- see the ground rules above).
#
# One Secret for every service, not one per service: the required values
# were already generated as a single coherent set by gen-env.scala (its
# own comment on CENTRAL_SECRET_KEY/CLIENT_SECRETS_SECRET: "a first-time
# value gets stored [in OpenBao]... writing it into both [auth.conf and
# central.conf] is harmless") -- splitting it into per-service Secrets
# here would invent a boundary the source of truth doesn't have. Each
# Deployment only pulls the specific keys it needs via secretKeyRef, so
# nothing gains broader access than the per-service split would've given
# it; see templates/_helpers.tpl's versola.secretKeyFor for the exact
# per-service required-key lists and key-naming (kebab-case of the VAR
# name, service-prefixed except for the two values genuinely shared
# between auth and central).
secrets:
  existingSecret: ""
  # How replicas notice a rotated value in existingSecret:
  #   none     (default) -- nothing automatic; roll the Deployments
  #            yourself (`kubectl rollout restart`) after rotating.
  #   checksum -- chart computes a per-service checksum/secret annotation
  #            (via `lookup`, same pattern as console's existingConfigMap
  #            checksum) over only the keys that service actually
  #            references, so rotating one service's value doesn't bounce
  #            the others. Requires the Helm service account to `get`
  #            Secrets at render time, and is a no-op under `helm
  #            template`/client-side dry-run since `lookup` needs a live
  #            cluster.
  #   reloader -- adds reloader.stakater.com/auto: "true" instead, for
  #            clusters already running Stakater Reloader.
  restartStrategy: none

# auth, central, edge: the three JVM services described by VersolaApp.scala.
# Keyed by name so templates/deployment.yaml and templates/service.yaml can
# render one Deployment + Service per entry instead of repeating themselves.
services:
  auth:
    enabled: true
    image:
      repository: versola-auth
      tag: "" # defaults to .Chart.AppVersion
    replicaCount: 1
    port: 8080 # PORT -- application traffic
    diagnosticsPort: 8081 # DPORT -- /metrics, /liveness, /readiness
    # APORT -- VersolaApp.additionalRoutes, auth's only user. Backs
    # AccountSettingsController (/settings/*), listed "internal" in
    # deploy.md's port table because the VPS's nginx never proxies to it.
    # A distinct value (not empty/0) so templates/{deployment,service}.yaml
    # expose it as its own port -- see ingress.hosts' `settings` route
    # group for whether/how it's actually reachable.
    additionalPort: 8082
    # MPORT -- RFC 8705 §5's mutual-TLS listener (VersolaApp.mutualTlsPort). On by default, with
    # the `pki` block below; 0/unset leaves it unexposed: no container port, no Service port, no MPORT env. Auth only serves it when its
    # env.conf has a `mutual-tls` block; see the `pki` block below for the certificate files this
    # chart mounts for that block, and k8s/README.md for the block itself. Edge's `native
    # { auth-mutual-tls-url }` reaches it through this Service port.
    mutualTlsPort: 8083
    # Memory is request == limit and is derived from the image's JAVA_OPTS
    # rather than guessed: heap 512m + direct 64m + metaspace 128m + code
    # cache 64m + thread stacks and JVM internals ~80m is ~848m, so 1Gi leaves
    # ~176Mi of headroom. All five are capped in docker/Dockerfile.auth --
    # changing a cap without changing this (or the reverse) is how a container
    # gets cgroup-OOM-killed instead of producing the heap dump that would
    # explain it. Provisional until the 5M sizing campaign measures the real
    # working set.
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 1Gi
    config:
      # Name of a Secret that already contains an env.conf key (HOCON --
      # see deploy.md 3.2/3.3), mounted at CONFIG_PATH. Left empty by
      # default -- this chart doesn't generate one.
      existingSecret: ""
      secretKey: env.conf
    # Extra plain env vars: [{name: FOO, value: bar}, ...].
    extraEnv: []
    # Extra volumes / mounts, in Kubernetes' own shape, for every service (e.g. a certificate
    # Secret your env.conf points at when `pki` is not used).
    extraVolumes: []
    extraVolumeMounts: []
    # Extra envFrom entries, for anything beyond the required ${VAR}
    # secret placeholders `secrets.existingSecret` above already covers
    # (JWT_PRIVATE_KEY, ACCESS_TOKENS_SECRET, POSTGRES_PASSWORD, ...; see
    # versola.requiredSecretVars in templates/_helpers.tpl).
    #   extraEnvFrom:
    #     - secretRef:
    #         name: auth-secrets
    extraEnvFrom: []
    # Placement for auth alone; overrides, never merges with, `global`'s.
    nodeSelector: {}
    tolerations: []
    affinity: {}
  central:
    enabled: true
    image:
      repository: versola-central
      tag: ""
    replicaCount: 1
    port: 8090
    diagnosticsPort: 8091
    # Same budget and same reasoning as auth's, from docker/Dockerfile.central.
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 1Gi
    config:
      existingSecret: ""
      secretKey: env.conf
    extraEnv: []
    extraEnvFrom: []
    # Placement for central alone; overrides, never merges with, `global`'s.
    nodeSelector: {}
    tolerations: []
    affinity: {}
  edge:
    enabled: true
    image:
      repository: versola-edge
      tag: ""
    replicaCount: 1
    port: 8095
    diagnosticsPort: 8096
    # heap 512m + direct 96m + metaspace 128m + code cache 64m + stacks and JVM
    # internals ~80m is ~880m (docker/Dockerfile.edge; the direct-buffer ceiling
    # is higher than auth's because edge proxies response bodies through
    # Netty's pooled arenas on every request), so 1Gi leaves ~144Mi.
    #
    # This was 384Mi, which no JVM with those ceilings fits in -- the heap alone
    # would have to be about 16m. It was never exercised: production runs on
    # docker compose, which sets no memory limit at all, so nothing ever
    # contradicted the figure.
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 1Gi
    config:
      existingSecret: ""
      secretKey: env.conf
    extraEnv: []
    extraEnvFrom: []
    # Placement for edge alone; overrides, never merges with, `global`'s.
    nodeSelector: {}
    tolerations: []
    affinity: {}

# Certificates for mutual TLS (#440), issued by cert-manager (https://cert-manager.io). On by
# default, so cert-manager and trust-manager must be installed (their CRDs) before this chart; set `pki.enabled: false`
# to opt out. This chart never installs cert-manager or trust-manager, it consumes them.
#
# Three relationships, three different rotation properties:
#   (1) auth's trust anchor for incoming client certificates -- a CA *bundle*; several CAs may be
#       in it at once, which is the rotation story (below).
#   (2) edge's pin on auth's own listener certificate -- a leaf, never a CA.
#   (3) client certificates for edge-fronted clients (central-admin, native/web clients) --
#       issued and renewed by central itself through the issuer below (a client registers with
#       `issueEdgeClientCertificate: true`); central holds no CA key, only the right to create
#       CertificateRequests in this namespace.
#
# With `enabled` (the default), this chart mounts (for the env.conf you provide -- it generates none):
#   auth: /app/mtls/server/{tls.crt,tls.key}   -> mutual-tls.certificate / .private-key
#         /app/mtls/trust/ca.crt               -> mutual-tls.trusted-certificates
#   edge: /app/mtls/auth-pin/tls.crt           -> native.trusted-certificates = ["..."]
#                                                  (and versola-internal-trusted-certificates)
# Rotating the client CA with `trustBundle`: add the incoming CA's Secret to `sources` alongside
# the outgoing one, reissue every client (cert-manager does, or delete the Secrets), then drop the
# outgoing source. See k8s/README.md.
pki:
  enabled: true
  # An issuer you already run, instead of the Versola Client CA this chart bootstraps:
  #   issuerRef: {name: org-ca, kind: ClusterIssuer, group: cert-manager.io}
  issuerRef: {}
  # Where the bootstrapped CA's Secret lives: cert-manager's own namespace (its cluster resource
  # namespace, for a ClusterIssuer), which is also trust-manager's default trust namespace.
  trustNamespace: cert-manager
  ca:
    commonName: Versola Client CA
    duration: 87600h
    renewBefore: 8760h
  # (2) auth's listener certificate.
  authServer:
    secretName: "" # defaults to <fullname>-auth-mtls
    dnsNames: [] # in addition to the Service's own names
    duration: 2160h
    renewBefore: 720h
    privateKey: {algorithm: ECDSA, size: 256}
  # (3) one entry per edge-fronted client, `clientId` being the id registered in central:
  #   clients:
  #     - clientId: central-admin
  #       commonName: central-admin   # what its `mtlsAuth` subject matches; defaults to clientId
  clients: []
  clientDefaults:
    duration: 2160h
    renewBefore: 720h
    privateKey: {algorithm: ECDSA, size: 256}
  # (1) trust-manager Bundle unioning the Versola Client CA with `sources` into
  # <fullname>-client-ca, which auth mounts as its trust anchors. On by default, so trust-manager
  # must be installed too. `sources` is for *additional* CAs -- the incoming one during a
  # rotation (trust-manager's source syntax, Secrets in its trust namespace). With
  # `pki.issuerRef` set the chart bootstraps no CA, so `sources` must name that issuer's.
  trustBundle:
    enabled: true
    sources: []
    #  - secret: {name: versola-client-ca-next, key: tls.crt}
  # Annotate auth and edge for Stakater Reloader: both read certificates once at startup, so a
  # renewal needs a restart. Without it, roll them yourself after a renewal.
  reloader: true
  # Carries client certificates issued *outside* central (by cert-manager through `pki.clients`
  # above, or by hand) into central's `edgeClientCertificate`. Off by default: central issues
  # and renews the certificates of the clients it is asked to (`issueEdgeClientCertificate`),
  # through the same issuer, so nothing needs carrying.
  certSync:
    enabled: false
    image:
      repository: versola-tools
      tag: ""
    centralUrl: "" # defaults to the in-cluster central Service
    intervalSeconds: 300
    # Secret holding central's resource secret (the `central:<secret>` Basic credential of its
    # admin API, base64url as central issued it). Empty name uses `secrets.existingSecret`, whose
    # `central-resource-secret` key is exactly CENTRAL_RESOURCE_SECRET (see versola.secretKeyFor).
    resourceSecret:
      name: ""
      key: central-resource-secret
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 128Mi

# Pod annotations for annotation-based Prometheus/VictoriaMetrics discovery,
# pointing scrapes at each pod's diagnostics port directly.
#
# Why this chart carries this at all, unlike its ClusterIP-only Service
# (templates/service.yaml): a scrape target set to
# <fullname>-<component>.<namespace>.svc.cluster.local resolves to that
# Service's single, stable ClusterIP -- DNS is not where the randomness
# happens. It happens one layer down: kube-proxy's iptables/IPVS rules DNAT
# each new connection to that ClusterIP to one of the Service's backing
# pods, chosen essentially at random, per connection. So with
# replicaCount > 1 the instance label a scrape produces (the ClusterIP:port
# itself) stays fixed while the pod actually answering it varies randomly
# underneath, and rate()/increase() over the resulting counters
# (http_server_requests_total, auth_authorize_total, ...) undercounts and
# jitters, because the samples under that one instance label are drawn from
# different replicas' independent counters rather than accumulated from
# one -- see the 1M-run loadgen campaign that first surfaced this.
#
# prometheus.io/scrape+port+path (the same annotations k8s/loadgen's
# `metrics.prometheusAnnotations` sets) let a kubernetes_sd_configs-based
# scraper (vmagent, Prometheus) discover pods individually via the pod/
# Endpoints role instead of a static or Service-DNS target, so each replica
# gets its own stable target and instance label. Set to false only if your
# scrape config already selects these pods some other way (an explicit
# PodMonitor/VMPodScrape, for instance) and the annotations would just be
# redundant.
metrics:
  prometheusAnnotations: true

# console: nginx with central-ui's static build baked in (see
# docker/Dockerfile.gateway) -- not a VersolaApp service, so it has no
# PORT/DPORT and no /liveness or /readiness to probe (see
# templates/console-deployment.yaml for how it's probed instead).
#
# Under docker-compose this same image also proxies /resources, /login,
# /authorize etc. to edge/auth (docker/versola-tools/nginx.conf.template).
# Here it only serves files: routing is the Ingress's job (see `ingress`
# below), so the pod needs no upstreams and no knowledge of auth/edge.
# The image is still published as `versola-gateway` -- only its role in
# this chart is narrower.
console:
  enabled: true
  image:
    repository: versola-gateway
    tag: ""
  replicaCount: 1
  # Placement for the console alone; overrides, never merges with, `global`'s.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  port: 2821
  # Where the console answers on its host. "/" suits a dedicated hostname
  # (console.example.com); the image bakes dist/ at /central/admin/, but
  # vite.config.ts's BASE_PATH is relative, so the same files resolve
  # correctly wherever they're mounted (see #222).
  basePath: /
  # How central-ui addresses the API -- the `console-mode` attribute added
  # in #222/#223.
  #
  # "direct": call edge's real routes (/resources/central/..., plain
  # /permissions/me) on the console's own origin. This is the only mode
  # this chart's Ingress can serve, because "prefix" needs /central/{x}
  # rewritten to /resources/central/{x}, and path rewriting is not in the
  # Ingress core spec -- every controller spells it differently, which is
  # exactly the per-controller coupling #210 set out to avoid.
  #
  # "prefix": the docker-compose/VPS behaviour. Only works here if you
  # also supply your own proxying config via `nginxConfig` below and route
  # the whole host to this pod, rather than using `ingress`.
  mode: direct
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 128Mi
  # nginx has no equivalent of gracefulShutdownTimeout -- these just need
  # to give it enough room to stop receiving new connections and drain
  # existing ones.
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 20
  nginxConfig:
    # Name of a ConfigMap that already has an `nginx.conf` key, if you'd
    # rather manage this pod's config outside the chart. Takes precedence
    # over `content` below. Both escape hatches replace the config
    # wholesale, so anything they need (proxy_pass upstreams,
    # proxy_set_header, ...) has to be self-contained.
    existingConfigMap: ""
    # Inline override for the rendered nginx.conf. Leave empty to use the
    # chart's own static-file default (templates/_helpers.tpl's
    # "versola.consoleNginxConf").
    content: ""

# Ingress. Disabled by default: hostnames are deployment-specific and
# there's no sensible guess to make.
#
# Routing is expressed as named groups of paths (see `routes` below)
# rather than one host-wide rule, because which hostname answers what is
# a deployment decision. Two shapes this is built for:
#
#   Split hosts (recommended). The console gets its own hostname, so
#   EDGE_SESSION is isolated by domain and scoped Path=/:
#     hosts:
#       - host: id.example.com
#         routes: [oidc, login]
#       - host: console.example.com
#         routes: [console, api, login]
#
#   Single host, path-isolated (today's VPS shape). Not expressible
#   through this Ingress -- it depends on the /central/* -> /resources/*
#   rewrite described under `console.mode` above. Point the whole host at
#   the console pod with a proxying `console.nginxConfig` instead.
#
# Both hosts need `login` because edge's interactive login/logout runs on
# whichever origin the session belongs to, and `/complete` must match the
# redirect_uri in that preset's config -- the chart routes it, but the
# preset still has to name the same hostname.
ingress:
  enabled: false
  # Required when `enabled` is true and `gatewayAPI` isn't: the template fails
  # rather than fall back to the cluster's default IngressClass. A cluster
  # whose only controller is a stock ingress-nginx install has no default --
  # that chart doesn't mark its own class as default -- so an empty value
  # would render an Ingress that looks correct and is adopted by nobody,
  # answering every request with a bare 404 that reads as a routing bug
  # rather than an unclaimed resource. Name the actual class, e.g. "nginx".
  className: ""
  # Free-form passthrough, e.g. cert-manager.io/cluster-issuer. The chart
  # itself needs no annotations -- everything above is core-spec, so it
  # works on ingress-nginx, Traefik, HAProxy, ALB, GKE, ... unchanged.
  annotations: {}
  # Each entry is one hostname plus the route groups it serves. Every
  # group below is a real, named endpoint set (see auth's *Controller.scala
  # and edge's EdgeService.scala) -- there is no catch-all `/` group, so a
  # host only ever exposes what you actually list:
  #   oidc     -> auth:    /authorize /token /par /introspect /revoke
  #                        /userinfo /logout /.well-known/ /challenge
  #   login    -> edge:    /login/ /complete /logout/
  #   api      -> edge:    /resources/ /permissions/
  #   native   -> edge:    /native/ -- the endpoints a mobile app calls under FAPI 2.0
  #                        (start, complete, token, revoke); list it on any host
  #                        whose native clients reach edge through the Ingress
  #   console  -> console: console.basePath
  #
  # `users`, `service` and `settings` are not for public/browser traffic --
  # none of the example `routes` combinations below include them, and every
  # endpoint in all three is guarded server-side even if you do add one, so
  # an accidental host+group typo isn't an open door:
  #   users    -> auth:    /users, /users/* (UserController). Called by
  #                        central over in-cluster Service DNS
  #                        (config.auth.url), not through the Ingress in
  #                        the normal case -- add this group only if your
  #                        central genuinely reaches auth through a public
  #                        URL instead. Every endpoint requires
  #                        `authorizeInternal`: a Bearer JWT signed with
  #                        central's own secret key, not a user session.
  #   service  -> auth:    /service/* (ServiceController). Same
  #                        cluster-internal caller and `authorizeInternal`
  #                        guard as `users`, plus its own belt-and-braces:
  #                        both endpoints 404 outright whenever `env` is
  #                        "prod" (see ServiceController.scala's
  #                        `env.isProd` check) -- they're config-sync/test
  #                        tooling for non-prod environments only, so this
  #                        group is a no-op in production even if listed.
  #   settings -> auth:    /settings, /settings/* (AccountSettingsController),
  #                        on auth's *additional* port
  #                        (services.auth.additionalPort/APORT), not its
  #                        main one -- deploy.md lists this "internal"
  #                        because the VPS's nginx never proxies to it
  #                        either. Guarded by `authorizeResource`: HTTP
  #                        Basic auth against a resource secret central
  #                        issues for auth, the same mechanism edge/central
  #                        use for each other, not an end-user credential.
  #                        Add it only if something outside the cluster
  #                        needs to call it directly instead of through
  #                        whatever already holds that secret.
  hosts: []
  #  - host: id.example.com
  #    routes: [oidc, login]
  #  - host: console.example.com
  #    routes: [console, api, login]
  # Standard Ingress TLS block, passed through as-is.
  tls: []
  #  - hosts: [id.example.com]
  #    secretName: versola-id-tls
  # Gateway API instead of Ingress, for clusters that have moved off it.
  # Renders the same route groups as HTTPRoutes.
  gatewayAPI:
    enabled: false
    # Required when enabled: which Gateway(s) these routes attach to.
    #   parentRefs:
    #     - name: public-gateway
    #       namespace: gateway-system
    #       sectionName: https
    parentRefs: []
