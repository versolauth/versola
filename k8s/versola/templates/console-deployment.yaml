{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "versola.fullname" . }}-console
  labels:
    {{- include "versola.componentLabels" (dict "component" "console" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.console.replicaCount }}
  selector:
    matchLabels:
      {{- include "versola.componentSelectorLabels" (dict "component" "console" "context" .) | nindent 6 }}
  {{- /*
  Roll the pods when the config changes: nginx reads it once at startup,
  and the volume mount below is a subPath, which kubelet never
  live-updates even when the source ConfigMap does change -- a pod
  restart is the only way stale config gets replaced either way, hence
  forcing one via a template diff rather than relying on the mount to
  refresh itself.

  When this chart renders its own ConfigMap (console-configmap.yaml),
  hashing that render is exact: any content change changes the hash. When
  nginxConfig.existingConfigMap points at a ConfigMap this chart doesn't
  own, console-configmap.yaml renders empty (see its own guard), so
  hashing it would produce the same constant value regardless of that
  ConfigMap's real content -- silently defeating this whole mechanism.
  `lookup` reads the live object's data instead, so an edit to it is
  still picked up on the next `helm upgrade`. `lookup` always returns an
  empty map under `helm template`/`helm lint` (no live cluster to
  query), which only affects offline rendering, not real installs.
  */}}
  {{- $nginxConfigChecksum := "" }}
  {{- if .Values.console.nginxConfig.existingConfigMap }}
  {{- $cm := lookup "v1" "ConfigMap" .Release.Namespace .Values.console.nginxConfig.existingConfigMap }}
  {{- $nginxConfigChecksum = dict "data" ($cm.data | default dict) | toYaml | sha256sum }}
  {{- else }}
  {{- $nginxConfigChecksum = include (print $.Template.BasePath "/console-configmap.yaml") . | sha256sum }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "versola.componentSelectorLabels" (dict "component" "console" "context" .) | nindent 8 }}
      annotations:
        checksum/nginx-config: {{ $nginxConfigChecksum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.console.terminationGracePeriodSeconds }}
      containers:
        - name: console
          image: {{ include "versola.image" (dict "global" .Values.global "svc" .Values.console "chart" .Chart) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.console.port }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
          # console is nginx (see docker/Dockerfile.gateway), not a
          # VersolaApp service -- it has no DPORT, no /liveness or
          # /readiness. Serving only static files, it has no upstream to
          # be unhealthy about either, so a TCP check against its own
          # listener is the whole story.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.console.preStopSleepSeconds }}"]
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ .Values.console.nginxConfig.existingConfigMap | default (printf "%s-console-nginx" (include "versola.fullname" .)) }}
{{- end }}
