{{- if .Values.console.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "versola.fullname" . }}-console
  labels:
    {{- include "versola.componentLabels" (dict "component" "console" "context" .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "versola.componentSelectorLabels" (dict "component" "console" "context" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.console.port }}
      targetPort: http
{{- end }}
