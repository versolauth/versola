{{- /*
Publishes central's mutual-TLS port (services.central.mutualTlsPort, #554) outside the cluster, for
edges that run elsewhere. Off by default: the port is then reachable in-cluster only, through the
central Service.

Whatever carries it must pass the TLS handshake through untouched -- never terminate it. Central
demands the edge's client certificate in that handshake and checks it against the edge the signed
token names, so a terminating proxy would see the certificate and central would not.
*/ -}}
{{- $central := .Values.services.central }}
{{- $x := $central.mutualTlsExposure | default dict }}
{{- $type := default "none" $x.type }}
{{- if not (has $type (list "none" "loadBalancer" "ingressPassthrough" "gatewayTLSRoute")) }}
{{- fail (printf "services.central.mutualTlsExposure.type %q is not one of none, loadBalancer, ingressPassthrough, gatewayTLSRoute" $type) }}
{{- end }}
{{- if and (ne $type "none") (not (and $central.enabled $central.mutualTlsPort)) }}
{{- fail "services.central.mutualTlsExposure needs services.central.enabled and services.central.mutualTlsPort: there is no mutual-TLS port to publish" }}
{{- end }}
{{- $full := include "versola.fullname" . }}
{{- $service := printf "%s-central" $full }}
{{- if eq $type "loadBalancer" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-central-mtls
  labels:
    {{- include "versola.componentLabels" (dict "component" "central" "context" $) | nindent 4 }}
  {{- with $x.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  {{- with $x.sourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "versola.componentSelectorLabels" (dict "component" "central" "context" $) | nindent 4 }}
  ports:
    - name: mtls
      port: {{ default 443 $x.port }}
      targetPort: mtls
{{- else if eq $type "ingressPassthrough" }}
{{- if not $x.host }}
{{- fail "services.central.mutualTlsExposure.host is required for ingressPassthrough: it is the name the controller matches the TLS SNI against" }}
{{- end }}
{{- if not $x.className }}
{{- fail "services.central.mutualTlsExposure.className is required for ingressPassthrough (the controller must support TLS passthrough, e.g. ingress-nginx started with --enable-ssl-passthrough)" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}-central-mtls
  labels:
    {{- include "versola.componentLabels" (dict "component" "central" "context" $) | nindent 4 }}
  annotations:
    # ingress-nginx: route by SNI and hand the connection on without terminating TLS.
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    {{- with $x.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ $x.className }}
  rules:
    - host: {{ $x.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $service }}
                port:
                  number: {{ $central.mutualTlsPort }}
{{- else if eq $type "gatewayTLSRoute" }}
{{- if not $x.host }}
{{- fail "services.central.mutualTlsExposure.host is required for gatewayTLSRoute: it is the SNI name the route matches" }}
{{- end }}
{{- if not $x.parentRefs }}
{{- fail "services.central.mutualTlsExposure.parentRefs is required for gatewayTLSRoute: name a Gateway listener with protocol TLS and tls.mode Passthrough" }}
{{- end }}
---
apiVersion: {{ default "gateway.networking.k8s.io/v1alpha2" $x.apiVersion }}
kind: TLSRoute
metadata:
  name: {{ $full }}-central-mtls
  labels:
    {{- include "versola.componentLabels" (dict "component" "central" "context" $) | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml $x.parentRefs | nindent 4 }}
  hostnames:
    - {{ $x.host | quote }}
  rules:
    - backendRefs:
        - name: {{ $service }}
          port: {{ $central.mutualTlsPort }}
{{- end }}
