{{- /*
  `services.auth.antifraud` rendered as a HOCON file (JSON is HOCON), which auth reads through CONFIG_OVERLAY_PATH:
  below the env.conf Secret and above the defaults the image ships (auth/src/main/resources/versola-defaults.conf),
  so a key set here is used unless the env.conf sets it too. Rendered only when the map is not empty.
*/ -}}
{{- $auth := .Values.services.auth }}
{{- if and $auth.enabled $auth.antifraud }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "versola.fullname" . }}-auth-overlay
  labels:
    {{- include "versola.componentLabels" (dict "component" "auth" "context" .) | nindent 4 }}
data:
  antifraud.conf: |
    {{- dict "antifraud" $auth.antifraud | toPrettyJson | nindent 4 }}
{{- end }}
