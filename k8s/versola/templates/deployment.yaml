{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "versola.fullname" $ }}-{{ $name }}
  labels:
    {{- include "versola.componentLabels" (dict "component" $name "context" $) | nindent 4 }}
spec:
  {{- /* Under an HPA the Deployment states no replica count: it would reset the autoscaler's on every upgrade. */}}
  {{- if not $svc.autoscaling.enabled }}
  replicas: {{ $svc.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "versola.componentSelectorLabels" (dict "component" $name "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "versola.componentSelectorLabels" (dict "component" $name "context" $) | nindent 8 }}
      {{- $secretAnn := include "versola.secretRestartAnnotations" (dict "root" $ "service" $name) | trim }}
      {{- $scrapeAnn := include "versola.scrapeAnnotations" (dict "root" $ "port" $svc.diagnosticsPort) | trim }}
      {{- $pkiAnn := include "versola.pki.annotations" (dict "root" $ "service" $name) | trim }}
      {{- if or $secretAnn $scrapeAnn $pkiAnn }}
      annotations:
        {{- if $secretAnn }}{{ $secretAnn | nindent 8 }}{{- end }}
        {{- if $pkiAnn }}{{ $pkiAnn | nindent 8 }}{{- end }}
        {{- if $scrapeAnn }}{{ $scrapeAnn | nindent 8 }}{{- end }}
      {{- end }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Placement: the service's own value if set, otherwise global's -- a
      # replacement, not a merge. See values.yaml's `global.nodeSelector`.
      {{- with ($svc.nodeSelector | default $.Values.global.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with ($svc.tolerations | default $.Values.global.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with ($svc.affinity | default $.Values.global.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "versola.priorityClassName" (dict "root" $ "name" $name "svc" $svc) }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with include "versola.topologySpreadConstraints" (dict "root" $ "name" $name "svc" $svc) }}
      topologySpreadConstraints:
        {{- . | nindent 8 }}
      {{- end }}
      # See values.yaml's top-level comment on preStopSleepSeconds /
      # terminationGracePeriodSeconds for why this has to cover both the
      # preStop sleep below and VersolaApp's own gracefulShutdownTimeout.
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      {{- if and $.Values.pki.enabled (eq $name "central") }}
      # Central creates cert-manager CertificateRequests with its own service account, which
      # templates/pki.yaml gives exactly that and nothing else.
      serviceAccountName: {{ include "versola.fullname" $ }}-central
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "versola.image" (dict "global" $.Values.global "svc" $svc "chart" $.Chart) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
            - name: diagnostics
              containerPort: {{ $svc.diagnosticsPort }}
            {{- if $svc.additionalPort }}
            - name: additional
              containerPort: {{ $svc.additionalPort }}
            {{- end }}
            {{- if $svc.mutualTlsPort }}
            - name: mtls
              containerPort: {{ $svc.mutualTlsPort }}
            {{- end }}
          env:
            - name: PORT
              value: {{ $svc.port | quote }}
            - name: DPORT
              value: {{ $svc.diagnosticsPort | quote }}
            {{- if $svc.additionalPort }}
            # VersolaApp.additionalRoutes -- today only auth sets this, for
            # AccountSettingsController's /settings/* (see deploy.md's port
            # table: "Account Settings, internal"). Exposed here as a
            # distinct container port because the app itself binds it
            # separately from PORT; whether it's reachable from outside
            # the cluster is a routing decision (ingress.hosts' `settings`
            # route group), not something this Deployment forces.
            - name: APORT
              value: {{ $svc.additionalPort | quote }}
            {{- end }}
            {{- if $svc.mutualTlsPort }}
            # RFC 8705 §5's listener (VersolaApp.mutualTlsPort): auth terminates TLS
            # itself here and demands a client certificate in the handshake. Served
            # only when auth's env.conf carries a `mutual-tls` block -- see
            # values.yaml's `pki` block for the files this chart mounts for it.
            - name: MPORT
              value: {{ $svc.mutualTlsPort | quote }}
            {{- end }}
            # See VersolaApp.scala's bindHost comment and #207: prod's VPS
            # sets this to 127.0.0.1 because of network_mode: host, which
            # would make every pod unreachable here. Deliberately not a
            # values.yaml knob -- this chart must never inherit that value.
            - name: BIND_HOST
              value: "0.0.0.0"
            - name: CONFIG_PATH
              value: /app/config/env.conf
            # The migration Job + RUN_MIGRATIONS wiring is #209 -- every
            # replica stays a plain server until that lands.
            - name: RUN_MIGRATIONS
              value: "false"
            {{- if and $.Values.pki.enabled (eq $name "central") }}
            # Which issuer signs the certificates central issues to edge-fronted clients
            # (central.conf's `client-certificates.cert-manager`).
            {{- include "versola.pki.issuerEnv" $ | nindent 12 }}
            {{- end }}
            {{- include "versola.secretEnv" (dict "root" $ "service" $name) | nindent 12 }}
            {{- with $svc.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $svc.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if $svc.config.existingSecret }}
            - name: config
              mountPath: /app/config
              readOnly: true
            {{- end }}
            {{- include "versola.pki.volumeMounts" (dict "root" $ "service" $name) | nindent 12 }}
            {{- with $svc.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            # Where the heap dump and GC log go (docker/Dockerfile.*'s
            # JAVA_OPTS). A volume rather than the container's own filesystem
            # because ExitOnOutOfMemoryError has the kubelet replace the
            # container, discarding its writable layer along with the dump
            # that documents why it died -- and because a multi-hundred-MB
            # dump written into that layer counts against the node's
            # ephemeral storage on the way out. An emptyDir is scoped to the
            # pod, so it survives the container restart and the dump is still
            # there to `kubectl cp`.
            - name: diagnostics
              mountPath: /diagnostics
          # /liveness and /readiness are served by the diagnostics server,
          # separate from application traffic on `http` -- see
          # VersolaApp.scala's serviceRoutes.
          livenessProbe:
            httpGet:
              path: /liveness
              port: diagnostics
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: diagnostics
            initialDelaySeconds: 5
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ $.Values.preStopSleepSeconds }}"]
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
      volumes:
        {{- if $svc.config.existingSecret }}
        - name: config
          secret:
            secretName: {{ $svc.config.existingSecret }}
            items:
              - key: {{ $svc.config.secretKey }}
                path: env.conf
        {{- end }}
        {{- include "versola.pki.volumes" (dict "root" $ "service" $name) | nindent 8 }}
        {{- with $svc.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: diagnostics
          emptyDir:
            # One heap dump is at most about -Xmx, and the GC log is capped at
            # filecount x filesize (5 x 20M). Bounded so a pod that OOMs in a
            # loop cannot evict its neighbours by filling the node.
            sizeLimit: {{ $svc.diagnosticsSizeLimit | default $.Values.diagnosticsSizeLimit }}
{{- end }}
{{- end }}
