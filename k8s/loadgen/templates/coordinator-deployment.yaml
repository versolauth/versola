{{- if .Values.coordinator.enabled }}
{{- $coordinator := .Values.coordinator }}
{{- if not $coordinator.config.existingSecret }}
{{- fail "coordinator.config.existingSecret is required when coordinator.enabled is true -- see values.yaml's `coordinator.config` block and driver-statefulset.yaml's identical guard" }}
{{- end }}
{{- if not $.Values.envName }}
{{- fail "envName must not be empty -- see values.yaml's `envName` and driver-statefulset.yaml's identical guard" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loadgen.fullname" . }}-coordinator
  labels:
    {{- include "loadgen.componentLabels" (dict "component" "coordinator" "context" $) | nindent 4 }}
spec:
  # A Deployment and not a StatefulSet, and the one component in this chart
  # whose replicas are interchangeable: the coordinator holds no per-user
  # state (dev spec §12), so the second replica is a standby in the only
  # sense that matters -- drivers poll `GET /plan` every 10s and whichever
  # replica answers gives the same plan. See values.yaml's
  # coordinator.replicaCount.
  replicas: {{ $coordinator.replicaCount }}
  selector:
    matchLabels:
      {{- include "loadgen.componentSelectorLabels" (dict "component" "coordinator" "context" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "loadgen.componentSelectorLabels" (dict "component" "coordinator" "context" $) | nindent 8 }}
      {{- with (include "loadgen.scrapeAnnotations" (dict "root" $ "port" $coordinator.diagnosticsPort) | trim) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Placement: the coordinator's own value if set, otherwise global's -- a
      # replacement, not a merge. See values.yaml's `global.nodeSelector`.
      {{- with ($coordinator.nodeSelector | default $.Values.global.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with ($coordinator.tolerations | default $.Values.global.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # affinity is the one field with a default of its own, the standby
      # spread: merged with the affinity given per top-level key, the given
      # key winning. So nodeAffinity keeps the spread; podAntiAffinity replaces it.
      {{- /*
      deepCopy because `set` mutates: without it the spread would be written
      into global.affinity itself, and every template Helm evaluates after this
      one would render it with the coordinator's labels. Latent today only
      because Helm evaluates same-directory templates in reverse alphabetical
      order, so mockapi and driver read global.affinity first --
      .github/scripts/check-chart-placement.sh probes for it directly.
      */}}
      {{- $affinity := deepCopy ($coordinator.affinity | default $.Values.global.affinity | default (dict)) }}
      {{- if and (gt (int $coordinator.replicaCount) 1) (not (hasKey $affinity "podAntiAffinity")) }}
      {{- $_ := set $affinity "podAntiAffinity" (include "loadgen.coordinatorStandbySpread" $ | fromYaml) }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # See values.yaml's top-level comment on preStopSleepSeconds /
      # terminationGracePeriodSeconds.
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      containers:
        - name: coordinator
          image: {{ include "loadgen.image" (dict "global" $.Values.global "svc" $coordinator "chart" $.Chart) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            # Named `http` and not `api`: it is VersolaApp's PORT, the same
            # application listener the driver binds, and the plan API is what
            # this role happens to serve on it.
            - name: http
              containerPort: {{ $coordinator.port }}
            - name: diagnostics
              containerPort: {{ $coordinator.diagnosticsPort }}
          env:
            - name: PORT
              value: {{ $coordinator.port | quote }}
            - name: DPORT
              value: {{ $coordinator.diagnosticsPort | quote }}
            # See the driver StatefulSet's comment on BIND_HOST.
            - name: BIND_HOST
              value: "0.0.0.0"
            - name: CONFIG_PATH
              value: /app/config/env.conf
            # See the driver StatefulSet's comment on ENV_NAME. The
            # coordinator needs it for the same reason and by the same route:
            # `env` is VersolaApp's, not LoadgenConfig's, so the role that owns
            # no `shard` block still owns this one.
            - name: ENV_NAME
              value: {{ $.Values.envName | quote }}
            {{- with $coordinator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with (include "loadgen.envFrom" (dict "root" $ "svc" $coordinator) | trim) }}
          envFrom:
            {{- . | nindent 12 }}
          {{- end }}
          {{- if $coordinator.config.existingSecret }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          {{- end }}
          # As the driver's: the diagnostics server serves these, separately
          # from the plan API on `http`.
          livenessProbe:
            httpGet:
              path: /liveness
              port: diagnostics
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: diagnostics
            initialDelaySeconds: 5
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ $.Values.preStopSleepSeconds }}"]
          resources:
            {{- toYaml $coordinator.resources | nindent 12 }}
      {{- if $coordinator.config.existingSecret }}
      volumes:
        - name: config
          secret:
            secretName: {{ $coordinator.config.existingSecret }}
            items:
              - key: {{ $coordinator.config.secretKey }}
                path: env.conf
      {{- end }}
{{- end }}
