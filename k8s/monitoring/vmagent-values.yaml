# Values for the `vmagent` Helm release (chart `vm/victoria-metrics-agent`,
# repo https://victoriametrics.github.io/helm-charts/, pinned to 0.48.0 --
# match that version on upgrade, since `extraScrapeConfigs` below assumes
# the chart's own built-in `kubernetes-pods` job, which this file does not
# otherwise touch, stays exactly as it is in that version).
#
# Not installed by either chart in k8s/ -- see k8s/README.md's "Observability
# is external by design". This is the actual live config for the target
# cluster's `monitoring` namespace, checked in here because it previously
# existed only as `helm get values vmagent -n monitoring`, nowhere in
# version control. Apply with:
#
#   helm repo add vm https://victoriametrics.github.io/helm-charts/
#   helm upgrade vmagent vm/victoria-metrics-agent -n monitoring \
#     --version 0.48.0 -f k8s/monitoring/vmagent-values.yaml

# `versola-sut`: auth/central/edge's own diagnostics ports.
#
# Not the chart's built-in `kubernetes-pods` job (which already discovers
# any annotated pod cluster-wide) because that job's relabel_configs are
# baked into the chart's ~300-line default `config` value verbatim -- there
# is no per-job override point, so adding one namespace-scoped exception to
# it would mean forking that whole block and hand-syncing the fork on every
# chart upgrade. A dedicated job under `extraScrapeConfigs`, which the chart
# *does* expose as a values key, is far cheaper to keep in sync.
#
# This used to be a `static_configs` entry pointing straight at each
# component's ClusterIP Service
# (versola-auth/-central/-edge.versola.svc.cluster.local) -- one DNS name
# shared by every replica of that component. That name resolves to the
# Service's single, stable ClusterIP, not to a random pod; the randomness
# is one layer below DNS, in kube-proxy's iptables/IPVS rules, which DNAT
# each new connection to that ClusterIP to one of the backing pods, chosen
# essentially at random. So at replicaCount > 1 (3 for auth, 2 for edge at
# the time this was found) the instance label such a target produces (the
# ClusterIP:port itself) stayed fixed while the pod actually behind it
# varied per connection, and rate()/increase() over the resulting counters
# (http_server_requests_total, auth_authorize_total, ...) undercounted and
# jittered -- first surfaced as a several-times distortion during the
# 1M-run loadgen campaign. It also never carried a `pod` label at all,
# which the dashboards (k8s/loadgen/dashboards/) select on alongside `job`
# and `namespace`.
#
# Fixed by switching to `kubernetes_sd_configs: role: pod`, scoped to the
# `versola` namespace, with the same annotation-based relabeling the
# chart's own `kubernetes-pods` job uses -- one target per pod, keyed off
# the `prometheus.io/scrape`/`port`/`path` annotations k8s/versola's
# `metrics.prometheusAnnotations` (default true) now sets. `job_name`
# stays `versola-sut` so existing dashboards/alerts keyed on that label
# don't need to change.
extraScrapeConfigs:
- job_name: versola-sut
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - versola
  relabel_configs:
  - action: drop
    regex: true
    source_labels:
    - __meta_kubernetes_pod_container_init
  - action: keep_if_equal
    source_labels:
    - __meta_kubernetes_pod_annotation_prometheus_io_port
    - __meta_kubernetes_pod_container_port_number
  - action: keep
    regex: true
    source_labels:
    - __meta_kubernetes_pod_annotation_prometheus_io_scrape
  - action: replace
    regex: (.+)
    source_labels:
    - __meta_kubernetes_pod_annotation_prometheus_io_path
    target_label: __metrics_path__
  - action: replace
    regex: ([^:]+)(?::\d+)?;(\d+)
    replacement: $1:$2
    source_labels:
    - __address__
    - __meta_kubernetes_pod_annotation_prometheus_io_port
    target_label: __address__
  - action: labelmap
    regex: __meta_kubernetes_pod_label_(.+)
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - source_labels:
    - __meta_kubernetes_pod_container_name
    target_label: container
  - source_labels:
    - __meta_kubernetes_namespace
    target_label: namespace
  - action: replace
    source_labels:
    - __meta_kubernetes_pod_node_name
    target_label: node

nodeSelector:
  workload: monitoring

remoteWrite:
- url: http://vmsingle-victoria-metrics-single-server.monitoring.svc.cluster.local.:8428/api/v1/write
  # A side effect of the fix above: the chart's built-in `kubernetes-pods`
  # job discovers *any* annotated pod cluster-wide, so as soon as
  # `metrics.prometheusAnnotations` started setting `prometheus.io/scrape`
  # on auth/central/edge, that generic job started scraping them too --
  # same pods, same values, under `job="kubernetes-pods"` instead of
  # `job="versola-sut"`. Two job labels for the same series, visible as two
  # converging lines on any panel grouped by `job`.
  #
  # Dropped here rather than by editing `kubernetes-pods` itself, for the
  # same reason `versola-sut` above is its own job: that job's body isn't a
  # values key this chart lets you patch in place. This drops the redundant
  # copy at remote-write time instead, leaving `kubernetes-pods` untouched
  # for every other namespace's generic annotation-based discovery.
  urlRelabelConfig:
  - action: drop
    regex: kubernetes-pods;versola
    source_labels:
    - job
    - namespace

resources:
  requests:
    cpu: 100m
    memory: 256Mi

tolerations:
- effect: NoSchedule
  key: dedicated
  operator: Equal
  value: monitoring
