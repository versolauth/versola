services:
  # Serves TLS (and still accepts plaintext), so `sbt test` needs nothing else: the unit tests and
  # PostgresTlsConnectionSpec both run against it. The CA it generates lands in
  # target/postgres-tls/ca.crt, where the spec reads it. POSTGRES_PORT moves the published port.
  postgres:
    build: util/implementations/postgres/tls-fixture
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${PG_USER:-dev}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-1234}
      POSTGRES_DB: auth
    volumes:
      - ./target/postgres-tls:/tls-out
    #  - ./postgres/init-sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-dev} -d auth"]
      interval: 3s
      timeout: 5s
      retries: 20

  # The pooler the coordinator reads section 4 of the campaign report off
  # (`PoolerStatsReaderSpec`). Not on the path of any service here -- auth,
  # central and edge still connect straight to postgres above -- so running
  # the stack without it changes nothing except that the one spec fails.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: always
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: auth
      DB_USER: ${PG_USER:-dev}
      DB_PASSWORD: ${PG_PASSWORD:-1234}
      AUTH_TYPE: plain
      # `SHOW CONFIG` is refused to a stats-only login, and the spec reads
      # `max_client_conn` and `default_pool_size` from it.
      ADMIN_USERS: ${PG_USER:-dev}
      POOL_MODE: transaction
      LISTEN_PORT: 6432
    ports:
      - "6432:6432"

  jaeger:
    image: jaegertracing/jaeger
    container_name: jaeger
    restart: always
    ports:
      - "16686:16686"
      - "4317:4317"
