name: sbt dependency submission

# Dependabot has no sbt ecosystem (#465), so the Scala dependencies in project/Dependencies.scala
# never reached GitHub's dependency graph. This submits them on every push to main, which makes
# Dependabot alerts and the dependency-review job (security.yml) see the JVM side as well.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Submitting a snapshot to the dependency graph needs contents: write; nothing else does.
permissions:
  contents: write

concurrency:
  group: sbt-dependency-submission
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25.0.5'
          check-latest: true
          distribution: 'temurin'
          cache: 'sbt'
      - name: Verify Java trust store
        shell: bash
        run: |
          # Temurin reissued some builds under the same version; reject stale cached stores.
          certs="$("$JAVA_HOME/bin/keytool" -J-Duser.language=en -list -v -cacerts -storepass changeit)"
          if printf '%s\n' "$certs" | grep -Ei '^Owner:.*(emSign (ECC Root CA - G3|Root CA - G2)|AAA Certificate Services)' > /dev/null; then
            echo "Compromised eMudhra trust path remains in the JDK" >&2
            exit 1
          fi
      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1
      - uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3
        with:
          configs-ignore: scala-doc-tool
