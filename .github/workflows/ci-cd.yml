name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: auth
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: 1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dev -d auth"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=10s

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - name: Set up Scala CLI
        if: github.event_name != 'release'
        uses: VirtusLab/scala-cli-setup@v1
      - name: Enforce measured DB access in production code
        shell: bash
        run: |
          set -eo pipefail
          # Fail the build if any src/main Scala file calls the raw .connect / .transact
          # transactor methods instead of the measured wrappers .connectMeasured /
          # .transactMeasured, so every query is recorded in the
          # db_client_operation_duration_seconds metric.
          #
          # Uses git grep boolean AND NOT so the check catches any call regardless of
          # what precedes the method — xa.connect, xa.repeatableRead.transact,
          # xa.serializable.connect, etc. — without relying on the receiver being named `xa`.
          #
          # The [^a-zA-Z_] guard prevents false positives from longer names that share
          # the prefix: .transactor, .connectionTimeout, .connectors, etc.
          #
          # Exit codes: 0 = violations found, 1 = clean, >1 = git error.
          # BasicCodecs.scala (which contains `xa.connect(f)` inside the wrapper bodies)
          # is excluded via pathspec so its own implementation lines are never flagged.
          status=0
          matches="$(git grep -nE \
            -e '\.(connect|transact)[^a-zA-Z_]' \
            --and --not -e '(connect|transact)Measured' \
            -- '**/src/main/**/*.scala' \
            ':(exclude)util/implementations/postgres/src/main/scala/versola/util/postgres/BasicCodecs.scala')" \
            || status=$?

          # git grep exit codes: 0 = matches found, 1 = no matches, >1 = error.
          if [ "$status" -gt 1 ]; then
            echo "::error::'git grep' failed with exit code $status while checking DB access; failing the build instead of passing silently."
            exit 1
          fi

          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "::error::Use .connectMeasured(...) / .transactMeasured(...) instead of raw .connect / .transact in production code (src/main)."
            exit 1
          fi

          echo "OK: no unmeasured .connect/.transact found in src/main."

      - name: Compile
        run: sbt compile

      - name: Run tests
        if: github.event_name != 'push'
        env:
          POSTGRES_HOST: localhost:5432
        run: sbt test

      - name: Run tests with coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          POSTGRES_HOST: localhost:5432
        run: sbt coverage test coverageReport coverageAggregate

      - name: Publish coverage badge to gist
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: bd1fd5151f5190b2f8325a56610909ef
          GIST_FILENAME: versola-coverage.json
        run: scala-cli run .github/scripts/coverage-badge.scala

      - name: Generate dev configs
        if: github.event_name != 'release'
        run: echo "local" | scala-cli run scripts/gen-env.scala

      - name: Set up Node.js
        if: github.event_name != 'release'
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Build forms
        if: github.event_name != 'release'
        working-directory: central-ui
        run: |
          npm ci
          npm run build:forms

      - name: Stage services for e2e tests
        if: github.event_name != 'release'
        run: sbt "central-postgres-impl/stage" "auth-postgres-impl/stage"

      - name: Start central service
        if: github.event_name != 'release'
        run: |
          PORT=9001 DPORT=9002 \
            central/implementations/postgres/target/universal/stage/bin/central-postgres-impl \
            -Denv.path=central/dev/env.conf > /tmp/central.log 2>&1 &
          echo $! > /tmp/central.pid

      - name: Wait for central to be ready
        if: github.event_name != 'release'
        run: |
          echo "Waiting for central on port 9002..."
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:9002/readiness" > /dev/null 2>&1; then
              echo "central is ready after $(( (i - 1) * 2 ))s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "central did not become ready in 120s"
              cat /tmp/central.log
              exit 1
            fi
            sleep 2
          done

      - name: Start auth service
        if: github.event_name != 'release'
        run: |
          PORT=9003 DPORT=9004 \
            auth/implementations/postgres/target/universal/stage/bin/auth-postgres-impl \
            -Denv.path=auth/dev/env.conf > /tmp/auth.log 2>&1 &
          echo $! > /tmp/auth.pid

      - name: Wait for auth to be ready
        if: github.event_name != 'release'
        run: |
          echo "Waiting for auth on port 9004..."
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:9004/readiness" > /dev/null 2>&1; then
              echo "auth is ready after $(( (i - 1) * 2 ))s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "auth did not become ready in 120s"
              cat /tmp/auth.log
              exit 1
            fi
            sleep 2
          done

      - name: Run e2e tests
        if: github.event_name != 'release'
        run: sbt e2e/test

      - name: Stop services
        if: always()
        run: |
          [ -f /tmp/auth.pid ]    && kill "$(cat /tmp/auth.pid)"    2>/dev/null || true
          [ -f /tmp/central.pid ] && kill "$(cat /tmp/central.pid)" 2>/dev/null || true

  docker-auth:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT

      - name: Build and push auth image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.auth
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/versola-auth:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/versola-auth:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-central:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Build central admin forms
        working-directory: central-ui
        run: |
          npm ci
          npm run build:forms

      - name: Build and push central image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.central
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/versola-central:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/versola-central:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-edge:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT

      - name: Build and push edge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.edge
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/versola-edge:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/versola-edge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # versola-gateway is nginx with central-ui's static build baked in (see
  # docker/Dockerfile.gateway) -- not a JVM service like auth/central/edge,
  # but published by version tag the same way so "versola bootstrap local
  # <version>" (see versola-cli) can pull it consistently with the other
  # three, through the same GHCR auth it already needs for those instead
  # of a separate download step or new hosting for central-ui's files
  # (this repo is private, so a GitHub Release asset would need its own
  # auth story on top).
  docker-gateway:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Build central-ui
        working-directory: central-ui
        run: |
          npm ci
          npm run build

      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gateway
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/versola-gateway:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/versola-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # versola-tools generates auth.conf/central.conf/edge.conf (via
  # scripts/gen-env.scala) plus compose.fragment.yml and nginx.conf for
  # "versola bootstrap local <version>" (see versola-cli). Lives in this
  # repo (not a separate one) specifically so it's built from whatever
  # gen-env.scala actually shipped with this release -- no manually synced
  # copy to drift out of sync (confirmed by hand that this drift is a real
  # risk, not a hypothetical one).
  docker-tools:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT

      - name: Build and push tools image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.tools
          # Must be passed explicitly -- ARG VERSION defaults to "dev"
          # otherwise, and the image bakes that default straight into the
          # compose.fragment.yml it generates at bootstrap time (confirmed
          # by hand: pulls versola-central:dev instead of the real tag,
          # which doesn't exist, and bootstrap fails on "manifest unknown").
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/versola-tools:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/versola-tools:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


