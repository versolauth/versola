rsola-tools generates auth.conf/central.conf/edge.conf (via
  # scripts/gen-env.scala) plus compose.fragment.yml and nginx.conf for
  # "versola bootstrap local <version>" (see versola-cli). Lives in this
  # repo (not a separate one) specifically so it's built from whatever
  # gen-env.scala actually shipped with this release -- no manually synced
  # copy to drift out of sync (confirmed by hand that this drift is a real
  # risk, not a hypothetical one).
  docker-tools:
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Downloads the sbt-native-packager output that "Stage services for
      # release images" (in the build job) already produced and uploaded --
      # Dockerfile.tools compiles gen-env.scala ahead of time via this
      # instead of shipping scala-cli and compiling it inside the image.
      - name: Download tools stage artifact
        uses: actions/download-artifact@v4
        with:
          name: tools-stage
          path: scripts/target/universal/stage

      # See the identical comment in docker-auth's "Set up QEMU" step.
      # This image leans on emulation much harder than the others: its
      # jlink stage runs jdeps/jlink and two gen-env smoke runs (see
      # docker/Dockerfile.tools), all under QEMU for the arm64 half, so
      # this job is the slowest of the five by a wide margin. Native arm64
      # runners would fix that, but they aren't free for private repos --
      # revisit if the wall time becomes a problem.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        env:
          # Same reasoning as the "Validate test_tag" step above: values
          # go through env: instead of being spliced into the script text
          # via ${{ }}, so a crafted test_tag (or, defensively, a release
          # tag name) can't inject shell commands that run with this job's
          # packages:write / GITHUB_TOKEN access.
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          TEST_TAG: ${{ inputs.test_tag }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=$RELEASE_TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=$TEST_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image tags
        id: tags
        env:
          # See the identical comment in docker-auth's "Compute image
          # tags" step -- same reasoning, same fix.
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "tags<<EOF"
            echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/versola-tools:$VERSION"
            if [ "${{ github.event_name }}" = "release" ]; then
              echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/versola-tools:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push tools image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.tools
          # Must be passed explicitly -- ARG VERSION defaults to "dev"
          # otherwise, and the image bakes that default straight into the
          # compose.fragment.yml it generates at bootstrap time (confirmed
          # by hand: pulls versola-central:dev instead of the real tag,
          # which doesn't exist, and bootstrap fails on "manifest unknown").
          # For a workflow_dispatch test run this is the test_tag input,
          # not a real version -- fine, since versola-tools built off a
          # test run is only ever pulled manually for validation, never by
          # a real "versola bootstrap local".
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          # "versola bootstrap local" pulls this image onto whatever
          # machine is running the CLI -- an Apple Silicon Mac as often as
          # not -- so it needs arm64 for the same reason the services do.
          # Unlike theirs, its jlink stage produces an architecture-
          # specific runtime, so the emulated arm64 build is doing real
          # work here, not just repacking the same bytes (see this job's
          # "Set up QEMU" step).
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


