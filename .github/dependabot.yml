# Dependency and base-image updates (#465). sbt has no Dependabot ecosystem: the Scala
# dependencies in project/Dependencies.scala are submitted to the dependency graph by
# sbt-dependency-submission.yml, so they get alerts and dependency review but not update PRs.
#
# Minor and patch updates are grouped into one PR per ecosystem per week. Majors are not
# grouped: each one is its own PR, so a major that breaks the build (TypeScript 5 -> 7,
# vitest 4 -> 5) blocks only itself instead of the whole group.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      base-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /central-ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
