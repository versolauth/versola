            RFC 8705 §2 mutual-TLS client authentication. `null` registers none, which is what
            a client authenticating by secret or by client assertion sends. Held to agree with
            `authMethod`: a credential the method does not read is one nothing would check.
            Refused for a tenant whose proxy terminates no mutual TLS (§6.5) - there would be
            no certificate to match it against.
        certificateBoundAccessTokens:
          type: boolean
          description: |
            RFC 8705 §3.4: bind this client's access tokens to the certificate it presents, so
            a resource request carrying one over another certificate is refused. Opt-in and
            independent of `mtlsAuth`, which implies binding on its own - a client that
            authenticates by secret can still ask for it.
        jwks:
          oneOf:
            - $ref: '#/components/schemas/JsonWebKeySet'
            - type: 'null'
          description: |
            RFC 7523 §2.2 `private_key_jwt`: the public keys this client signs its client
            assertions with. `null` means the client does not use the method, or that
            `generateJwks` asks this server for the keys instead.
        generateJwks:
          type: string
          nullable: true
          enum: [ES256, PS256, RS256]
          description: |
            Generate the `private_key_jwt` key pair here instead of registering one, signing
            with this algorithm. The public half is stored as `jwks`; the private half is
            returned as `CreateClientResponse.privateKey` and is kept nowhere.
            For the caller that holds no key and no way to make one. A FAPI 2.0 tenant admits
            no `client_secret`, so without this there is no method left whose credential this
            server issues, and registering a service client there needs a key produced
            outside the product.
            Mutually exclusive with `jwks`, and refused for any method other than
            `private_key_jwt` -- RFC 8705 §2.2 reads a key set too, but matches it against a
            certificate a generated pair would not come with.
        estEnrollment:
          type: boolean
          description: |
            The client obtains and renews its mTLS client certificate through EST (RFC 7030), served by auth
            under `/.well-known/est/` and issued by central from the CA behind `client-certificates` with the key
            the client generated: it holds no certificate at registration. Needs `authMethod`
            `tls_client_auth`; the client is registered by `mtlsAuth`, or by `CN=<client>,OU=<tenant>,O=Versola`
            where it names none, and its tenant has to set `mtlsCertificateHeader`. Create a token with
            `POST /configuration/clients/est/enrollment-tokens`, then the client enrols with it. Defaults to
            `false`. Mutually exclusive with `issueEdgeClientCertificate`, `enrollEdgeClientCertificate` and
            supplying a certificate.
      required: [tenantId, id, clientName, allowedScopes, accessTokenTtl, authMethod]
    UpdateWebClientRequest:
      type: object
      additionalProperties: false
      description: |
        `redirectUris`, `scope` and `permissions` are add/remove patches (see their schemas).
        `authFlow`, `frontChannelLogoutUri`, `backChannelLogoutUri`,
        `logoUri`, `policyUri`, `tosUri` and `consentFlow` follow merge-patch semantics: absent
        leaves the value unchanged, `null` clears it, a value sets it. Every other member is a
        plain optional overwrite: absent or `null` leaves the value, a value sets it.
        A client that has a `consentFlow` is a partner client: `null` is refused for it (400) -- the
        flow can be changed, not removed.

        A client's method and kind are fixed when it is registered. `requireSignedRequestObject` cannot
        be turned on for a client fronted by edge, which holds no key to sign one with. No patch may
        leave the client without a redirect URI.
        Members that are not listed here are refused, not ignored.
      properties:
        clientId:
          $ref: '#/components/schemas/ClientId'
        clientName:
          oneOf:
            - $ref: '#/components/schemas/LocalizedText'
            - type: 'null'
        redirectUris:
          $ref: '#/components/schemas/PatchClientRedirectUris'
        scope:
          $ref: '#/components/schemas/PatchClientScope'
        accessTokenTtl:
          type: [integer, 'null']
          format: int64
          description: Seconds.
        refreshTokenTtl:
          type: [integer, 'null']
          format: int64
          description: Seconds.
        theme:
          type: [string, 'null']
        authFlow:
          oneOf:
            - $ref: '#/components/schemas/AuthFlow'
            - type: 'null'
        otpTemplateId:
          type: [string, 'null']
        frontChannelLogoutUri:
          type: [string, 'null']
        frontChannelLogoutSessionRequired:
          type: [boolean, 'null']
        backChannelLogoutUri:
          type: [string, 'null']
        logoUri:
          type: [string, 'null']
        policyUri:
          type: [string, 'null']
        tosUri:
          type: [string, 'null']
        consentFlow:
          oneOf:
            - $ref: '#/components/schemas/ConsentFlowDto'
            - type: 'null'
        dpopBoundAccessTokens:
          type: boolean
          description: |
            RFC 9449 §5.2: the client always uses DPoP. A token request from it that carries no
            proof is refused with `invalid_dpop_proof` rather than answered with a bearer token.
        dpopSigningAlgs:
          type: array
          items:
            type: string
            enum: [ES256, PS256, RS256]
          description: |
            RFC 9449 §5.1: the signing algorithms a DPoP proof from this client may use,
            narrowing `dpop_signing_alg_values_supported`. An empty array registers no
            narrowing. Narrowing only ever subtracts - naming an algorithm the metadata
            document does not advertise does not make it acceptable.
        dpopMinRsaKeySize:
          type: [integer, 'null']
          description: |
            The modulus length, in bits, an RSA DPoP proof key from this client must reach.
            `null` leaves the RFC 7518 §3.3 floor of 2048 bits, which applies to every client
            regardless; a value below it is refused at registration.
        mtlsAuth:
          oneOf:
            - $ref: '#/components/schemas/MutualTlsAuth'
            - type: 'null'
          description: |
            Merge-patch: absent leaves the registered mutual-TLS configuration unchanged,
            `null` clears it, a value replaces it. Validated against the resulting
            `authMethod` exactly as a registration is.
        certificateBoundAccessTokens:
          type: [boolean, 'null']
          description: |
            RFC 8705 §3.4. Absent or `null` leaves the stored value unchanged.
        jwks:
          oneOf:
            - $ref: '#/components/schemas/JsonWebKeySet'
            - type: 'null'
          description: |
            RFC 7523 §2.2 `private_key_jwt`: the public keys this client signs its client
            assertions with. `null` means the client does not use the method.
        requireSignedRequestObject:
          type: boolean
          description: |
            RFC 9101 §10.5: the client states its authorization request in a request object it
            signed, so a plain parameter set from it is refused with `invalid_request`.
            Needs `jwks` - a request object is verified against no other keys.
        requirePushedAuthorizationRequests:
          type: boolean
          description: |
            RFC 9126 §6.2: the client pushes its authorization request to `/par` first, so one
            arriving at `/authorize` without a `request_uri` is refused with `invalid_request`.
        edgeSigningKey:
          oneOf:
            - $ref: '#/components/schemas/PrivateJsonWebKey'
            - type: 'null'
          description: |
            Merge-patch: absent leaves the stored key unchanged, `null` clears it, a value
            replaces it. Checked against the resulting `jwks` exactly as a registration is.
        themeOverrides:
          $ref: '#/components/schemas/ThemeOverrides'
          description: |
            Replaces the client's theme overrides: absent leaves them unchanged, an empty object
            `{}` clears them, any other value replaces them as a whole (a value left out of it is
            the theme's own again). A non-empty value is refused with 400 unless the client asks
            for consent after the update (it has a `consentFlow`, or this request gives it one);
            an empty object is always accepted.
      required: [clientId]
