openapi: 3.1.0

info:
  title: Versola Central API
  version: '1.0'
  description: |
    Central is the Versola control plane: the source of truth for tenants, clients,
    resources, scopes, permissions, roles, users and the branding/challenge configuration
    that auth and edge consume.

    Central is an internal service. It is never exposed to end users or to browser
    traffic — only to the admin console (`central-ui`).

    This reference covers the admin console surface. Central also exposes internal
    endpoints that auth and edge call, authenticated with a bearer token those services sign
    rather than with the HTTP Basic credentials below; they are not part of this document:
    the replication endpoints (`/sync`, `/registry`, including `/configuration/jwks/sync` and
    `/configuration/jwks/signing-keys/sync`), `POST /users/registrations` (auth reports a user
    who registered themselves so that central can index them), `PUT /users/email` and
    `PUT /users/phone` (auth sets a user's email or phone once the user has proven they own the new
    one) and `POST /configuration/clients/edge-certificate/sign` (an edge asks for a certificate
    for a client whose key it generated).

    ## Authentication

    Every operation below is called with HTTP Basic: the fixed username `central` and the
    base64url-encoded central resource secret as the password.

    ## Conventions

    * Identifiers are passed as query parameters, not path segments — `DELETE
      /configuration/tenants?tenantId=acme`, not `DELETE /configuration/tenants/acme`.
    * Localized text is a map of BCP 47 language tag to string: `{"en": "Name", "ru": "Имя"}`.
    * `PUT` bodies that contain `add`/`remove`/`delete` members are patches: only the listed
      members change. Some nullable fields follow JSON merge-patch semantics — key absent
      means "leave unchanged", `null` means "clear", a value means "set" — but others are
      plain optional overwrites where `null` and absent both mean "leave unchanged"; each
      operation states which applies to which field.
    * Secrets and private keys are returned exactly once, at creation or rotation time.
      Central stores only encrypted copies and cannot show them again.
  license:
    name: Versola Community License v1.0
    url: https://github.com/versolauth/versola/blob/main/LICENCE.md

externalDocs:
  description: Versola documentation
  url: https://docs.versola.kz

servers:
  - url: '{centralBaseUrl}'
    description: |
      Central is self-hosted and has no public address. Point this at your own deployment —
      the default is the address it listens on in the docker-compose setup.
    variables:
      centralBaseUrl:
        default: http://localhost:8090

security:
  - centralBasic: []

tags:
  - name: Tenants
    description: Isolation boundaries that own clients, resources, scopes, permissions and roles.
  - name: Clients
    description: OAuth clients, their secrets and their sign-in flows.
  - name: Authorization presets
    description: Named, server-side authorization request templates for a client.
  - name: Resources
    description: Protected APIs behind edge, their endpoints and their access policies.
  - name: Scopes
    description: OAuth scopes and the claims each scope releases.
  - name: Permissions
    description: Fine-grained rights that map to resource endpoints.
  - name: Roles
    description: Named bundles of permissions granted to users within a tenant.
  - name: Authorization detail types
    description: RFC 9396 `authorization_details` types and their JSON Schemas.
  - name: Users
    description: The user index — identifiers, claims, roles, sessions, passkeys and passwords.
  - name: Challenges
    description: OTP templates and per-tenant challenge, session and passkey settings.
  - name: Forms
    description: Versioned login form bundles (style, script, localizations, properties).
  - name: Locales
    description: Locales offered on the login UI, and the default among them.
  - name: Themes
    description: CSS themes applied to the login UI, globally or per tenant.
  - name: JWKS
    description: The central-owned JSON Web Key Set used to sign and verify admin tokens.
  - name: Server metadata
    description: Overrides merged into the RFC 8414 authorization server metadata document.
  - name: System settings
    description: Global, non-tenant-scoped settings such as the password policy.
  - name: Edges
    description: Registered edge deployments and their signing keys.
  - name: Service
    description: Operational endpoints that return `404 Not Found` in production.

paths:
  # ─────────────────────────────── Tenants ───────────────────────────────
  /configuration/tenants:
    get:
      tags: [Tenants]
      summary: List tenants
      operationId: getAllTenants
      responses:
        '200':
          description: Every tenant known to central.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllTenantsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Tenants]
      summary: Create a tenant
      operationId: createTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Tenant created.
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Tenants]
      summary: Update a tenant
      description: Replaces the description and edge binding of an existing tenant.
      operationId: updateTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '204':
          description: Tenant updated.
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Tenants]
      summary: Delete a tenant
      operationId: deleteTenant
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
      responses:
        '204':
          description: Tenant deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────────────────── Clients ───────────────────────────────
  /configuration/clients:
    get:
      tags: [Clients]
      summary: List a tenant's clients
      operationId: getAllClients
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/OffsetQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Clients belonging to the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllClientsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Clients]
      summary: Delete a client
      operationId: deleteClient
      parameters:
        - $ref: '#/components/parameters/ClientIdQuery'
      responses:
        '204':
          description: Client deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/clients/web:
    post:
      tags: [Clients]
      summary: Register a web client
      description: |
        A site with a backend, where users sign in. See `CreateWebClientRequest`.
        The secret is returned only here, and only for `authMethod: client_secret`.
      operationId: createWebClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebClientRequest'
      responses:
        '201':
          description: Client registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClientResponse'
        '400':
          description: |
            The request carries a member this kind does not have, or the registration was
            rejected: a method or setting the kind does not allow (named in the body), or any
            consent URI that is not an absolute HTTPS URL.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A client with this id already exists.
    put:
      tags: [Clients]
      summary: Update a web client
      description: |
        Only for a client registered as a web client: a client's kind is fixed, and an
        update sent to another kind's endpoint is refused with `409` naming the right one.
      operationId: updateWebClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebClientRequest'
      responses:
        '204':
          description: Client updated.
        '400':
          description: The patch was rejected, or carries a member this kind does not have.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such client.
        '409':
          description: The client is of another kind.
          content:
            text/plain:
              schema:
                type: string
  /configuration/clients/native:
    post:
      tags: [Clients]
      summary: Register a native client
      description: |
        An app installed on a device, holding a DPoP key. See `CreateNativeClientRequest`.
        The secret is returned only here, and only for `authMethod: client_secret`.
      operationId: createNativeClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNativeClientRequest'
      responses:
        '201':
          description: Client registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClientResponse'
        '400':
          description: |
            The request carries a member this kind does not have, or the registration was
            rejected: a method or setting the kind does not allow (named in the body), or any
            consent URI that is not an absolute HTTPS URL.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A client with this id already exists.
    put:
      tags: [Clients]
      summary: Update a native client
      description: |
        Only for a client registered as a native client: a client's kind is fixed, and an
        update sent to another kind's endpoint is refused with `409` naming the right one.
      operationId: updateNativeClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNativeClientRequest'
      responses:
        '204':
          description: Client updated.
        '400':
          description: The patch was rejected, or carries a member this kind does not have.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such client.
        '409':
          description: The client is of another kind.
          content:
            text/plain:
              schema:
                type: string
  /configuration/clients/service:
    post:
      tags: [Clients]
      summary: Register a service client
      description: |
        Code calling an API with no user present. See `CreateServiceClientRequest`.
        The secret is returned only here, and only for `authMethod: client_secret`.
      operationId: createServiceClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceClientRequest'
      responses:
        '201':
          description: Client registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClientResponse'
        '400':
          description: |
            The request carries a member this kind does not have, or the registration was
            rejected: a method or setting the kind does not allow (named in the body), or any
            consent URI that is not an absolute HTTPS URL.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A client with this id already exists.
    put:
      tags: [Clients]
      summary: Update a service client
      description: |
        Only for a client registered as a service client: a client's kind is fixed, and an
        update sent to another kind's endpoint is refused with `409` naming the right one.
      operationId: updateServiceClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceClientRequest'
      responses:
        '204':
          description: Client updated.
        '400':
          description: The patch was rejected, or carries a member this kind does not have.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such client.
        '409':
          description: The client is of another kind.
          content:
            text/plain:
              schema:
                type: string

  /configuration/clients/rotate-secret:
    post:
      tags: [Clients]
      summary: Rotate a client secret
      description: |
        Issues a new secret and keeps the previous one valid until
        `DELETE /configuration/clients/previous-secret` retires it, so deployments can roll
        over without downtime.
      operationId: rotateClientSecret
      parameters:
        - $ref: '#/components/parameters/ClientIdQuery'
      responses:
        '200':
          description: The new secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateSecretResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/clients/previous-secret:
    delete:
      tags: [Clients]
      summary: Retire the previous client secret
      operationId: deletePreviousClientSecret
      parameters:
        - $ref: '#/components/parameters/ClientIdQuery'
      responses:
        '204':
          description: Previous secret removed.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/clients/edge-certificate/renew:
    post:
      tags: [Clients]
      summary: Renew a managed edge client certificate
      description: |
        Issues a new certificate now for a client whose certificate central manages (one
        registered with `issueEdgeClientCertificate`), instead of waiting for the scheduled
        renewal -- after a change of certificate authority, say.

        Answers `404 Not Found` for a client whose certificate central does not manage: one
        registered with a certificate the operator supplied, one enrolled with
        `enrollEdgeClientCertificate`, or one that does not exist.
      operationId: renewEdgeClientCertificate
      parameters:
        - $ref: '#/components/parameters/ClientIdQuery'
      responses:
        '204':
          description: Certificate renewed.
        '400':
          description: The client's registration cannot be issued a certificate (for example no certificate authority is configured).
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Central does not manage the certificate of this client.
          content:
            text/plain:
              schema:
                type: string

  /configuration/auth-request-presets:
    get:
      tags: [Authorization presets]
      summary: List a client's presets
      operationId: getClientPresets
      parameters:
        - $ref: '#/components/parameters/ClientIdQuery'
      responses:
        '200':
          description: The client's presets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorizationPresetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Authorization presets]
      summary: Replace a client's presets
      description: The submitted list becomes the client's complete set of presets.
      operationId: saveClientPresets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAuthorizationPresetsRequest'
      responses:
        '204':
          description: Presets saved.
        '400':
          description: |
            The presets were rejected, e.g. two presets share an id, or a preset id is
            reserved (`current`: edge serves `GET /login/current` itself, so the id cannot
            name a preset).
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/resources:
    get:
      tags: [Resources]
      summary: List a tenant's resources
      operationId: getAllResources
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/OffsetQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Resources belonging to the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllResourcesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Resources]
      summary: Register a resource
      description: |
        An internal resource is issued a secret that edge presents when calling it. The
        plaintext is returned only here. Non-internal resources receive no secret.
      operationId: createResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceRequest'
      responses:
        '201':
          description: Resource registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResourceResponse'
        '400':
          description: The resource or one of its endpoints is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Resources]
      summary: Update a resource
      description: Endpoints listed in `deleteEndpoints` are removed before `createEndpoints` are added.
      operationId: updateResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourceRequest'
      responses:
        '204':
          description: Resource updated.
        '400':
          description: The resource or one of its endpoints is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Resources]
      summary: Delete a resource
      operationId: deleteResource
      parameters:
        - $ref: '#/components/parameters/ResourceIdQuery'
      responses:
        '204':
          description: Resource deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/resources/rotate-secret:
    post:
      tags: [Resources]
      summary: Rotate a resource secret
      operationId: rotateResourceSecret
      parameters:
        - $ref: '#/components/parameters/ResourceIdQuery'
      responses:
        '200':
          description: The new secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateResourceSecretResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A rotation is already in progress — retire the previous secret first.

  /configuration/resources/previous-secret:
    delete:
      tags: [Resources]
      summary: Retire the previous resource secret
      description: |
        Edge keeps using the previous secret until it is retired here, so this call is what
        completes a rotation.
      operationId: deletePreviousResourceSecret
      parameters:
        - $ref: '#/components/parameters/ResourceIdQuery'
      responses:
        '204':
          description: Previous secret removed.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/scopes:
    get:
      tags: [Scopes]
      summary: List a tenant's scopes
      operationId: getAllScopes
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/OffsetQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Scopes with their claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllScopesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Scopes]
      summary: Create a scope
      operationId: createScope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScopeRequest'
      responses:
        '201':
          description: Scope created.
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Scopes]
      summary: Update a scope
      description: Adds, updates and deletes claims and description translations in one patch.
      operationId: updateScope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScopeRequest'
      responses:
        '204':
          description: Scope updated.
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Scopes]
      summary: Delete a scope
      operationId: deleteScope
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - name: scopeId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ScopeToken'
      responses:
        '204':
          description: Scope deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/permissions:
    get:
      tags: [Permissions]
      summary: List a tenant's permissions
      operationId: getAllPermissions
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/OffsetQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Permissions belonging to the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllPermissionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Permissions]
      summary: Create a permission
      operationId: createPermission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePermissionRequest'
      responses:
        '201':
          description: Permission created.
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Permissions]
      summary: Update a permission
      operationId: updatePermission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePermissionRequest'
      responses:
        '204':
          description: Permission updated.
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Permissions]
      summary: Delete a permission
      operationId: deletePermission
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - name: permission
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Permission'
      responses:
        '204':
          description: Permission deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/roles:
    get:
      tags: [Roles]
      summary: List a tenant's roles
      operationId: getAllRoles
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/OffsetQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Roles belonging to the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllRolesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Roles]
      summary: Create a role
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Role created.
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Roles]
      summary: Update a role
      operationId: updateRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '204':
          description: Role updated.
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Roles]
      summary: Delete a role
      operationId: deleteRole
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - name: roleId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/RoleId'
      responses:
        '204':
          description: Role deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/authorization-detail-types:
    get:
      tags: [Authorization detail types]
      summary: List a tenant's authorization detail types
      operationId: getAllAuthorizationDetailTypes
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/OffsetQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Types belonging to the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllAuthorizationDetailTypesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Authorization detail types]
      summary: Create an authorization detail type
      operationId: createAuthorizationDetailType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthorizationDetailTypeRequest'
      responses:
        '201':
          description: Type created.
        '400':
          description: The supplied JSON Schema is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationDetailTypeValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Authorization detail types]
      summary: Update an authorization detail type
      operationId: updateAuthorizationDetailType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuthorizationDetailTypeRequest'
      responses:
        '204':
          description: Type updated.
        '400':
          description: The supplied JSON Schema is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationDetailTypeValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Authorization detail types]
      summary: Delete an authorization detail type
      operationId: deleteAuthorizationDetailType
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/AuthorizationDetailType'
      responses:
        '204':
          description: Type deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      summary: Find users
      description: |
        Looks up a user by exactly one identifier. When several are supplied the first of
        `id`, `email`, `phone`, `login` wins; when none are supplied the request is rejected.
      operationId: findUsers
      parameters:
        - name: id
          in: query
          schema:
            $ref: '#/components/schemas/UserId'
        - name: email
          in: query
          schema:
            $ref: '#/components/schemas/Email'
        - name: phone
          in: query
          schema:
            $ref: '#/components/schemas/Phone'
        - name: login
          in: query
          schema:
            $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Matching users — empty when the identifier is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSearchResponse'
        '400':
          description: No identifier was supplied.
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Users]
      summary: Create a user
      description: |
        At least one of `email`, `phone` or `login` should be present. This is not currently
        enforced server-side: a request with none of them succeeds and creates a user with no
        identifier, which `GET /users` can never find.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: One of the identifiers is already taken.
    patch:
      tags: [Users]
      summary: Patch a user's identifiers
      description: |
        The central index is updated in the request transaction, so an unknown `id` or an
        identifier held by another user is rejected synchronously. Propagation to auth runs
        asynchronously through the user outbox.
      operationId: patchUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserRequest'
      responses:
        '202':
          description: Patch accepted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No user with this `id`.
        '409':
          description: One of the identifiers is already taken by another user.
    delete:
      tags: [Users]
      summary: Delete a user
      description: |
        Hard-deletes the user with everything that references them, synchronously: auth is told
        first and purges the account's sessions, refresh tokens, authorization codes, in-flight
        conversations, passkeys, passwords, roles, consents and throttling records (the relying
        parties of its sessions receive a back-channel logout), and only then does the index row
        go. A failure in auth leaves the user in place, so the call can be repeated. Access tokens
        already issued stay valid until they expire; the refresh tokens that would renew them do
        not. The request log carries the user id and nothing else about the user.
      operationId: deleteUser
      parameters:
        - name: id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '204':
          description: User deleted.
        '400':
          description: No `id`, or one that is not a UUID.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No user with this `id`.

  /users/claims:
    patch:
      tags: [Users]
      summary: Patch a user's claims
      description: Members present in `claims` are merged over the stored claims; `null` clears a member.
      operationId: patchUserClaims
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserClaimsRequest'
      responses:
        '202':
          description: Patch accepted.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/roles:
    get:
      tags: [Users]
      summary: List a user's roles in a tenant
      operationId: getUserRoles
      parameters:
        - name: id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
        - $ref: '#/components/parameters/TenantIdQuery'
      responses:
        '200':
          description: The roles granted to the user in that tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRolesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Users]
      summary: Grant and revoke a user's roles
      operationId: patchUserRoles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRolesRequest'
      responses:
        '202':
          description: Patch accepted.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/sessions:
    get:
      tags: [Users]
      summary: List a user's sessions
      operationId: getUserSessions
      parameters:
        - name: id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: Active sessions, each with the clients entered during it.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Users]
      summary: Invalidate a user's sessions, or one of them
      description: |
        With `userId` alone: logs the user out everywhere; subsequent authorization requires
        re-authentication. With `id` and `sessionId` (the `publicId` from `GET /users/sessions`):
        signs that one user agent out, the way the user's own logout would, relying parties
        included; the other sessions stay. A `sessionId` that is not this user's is refused
        with `404` rather than ended, since session ids travel in front-channel logout URLs.
      operationId: invalidateUserSessions
      parameters:
        - name: userId
          in: query
          description: Required without `sessionId`.
          schema:
            $ref: '#/components/schemas/UserId'
        - name: id
          in: query
          description: Required with `sessionId`.
          schema:
            $ref: '#/components/schemas/UserId'
        - name: sessionId
          in: query
          schema:
            type: string
      responses:
        '204':
          description: Sessions invalidated, or the one session ended.
        '400':
          description: Neither `userId` nor `id` with `sessionId` was supplied.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The `sessionId` is not a live session of this user.

  /users/refresh-tokens:
    get:
      tags: [Users]
      summary: List a user's refresh tokens
      description: |
        The offline access clients hold for the user, one entry per live grant. Independent of
        `GET /users/sessions`: a refresh token's expiry is fixed at issuance and independent of
        a session's, so a token routinely outlives the session it was issued under and would be
        invisible to an admin working from the session list alone.
      operationId: getUserRefreshTokens
      parameters:
        - name: id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: This user's live refresh tokens, one per grant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Users]
      summary: Revoke a client's offline access for a user
      description: |
        Expires every live refresh token `clientId` holds for the user, so the client cannot renew
        its access without sending the user through `/authorize` again. Not a logout: the user's
        sessions stay, and access tokens already issued run out on their own. Idempotent.
      operationId: revokeUserRefreshTokens
      parameters:
        - name: id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
        - name: clientId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ClientId'
      responses:
        '204':
          description: Offline access revoked (or there was none).
        '400':
          description: "`id` or `clientId` missing."
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/limits/reset:
    post:
      tags: [Users]
      summary: Reset a user's submission limits
      description: Clears OTP, password and passkey rate-limit counters and any active ban.
      operationId: resetUserLimits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetUserLimitsRequest'
      responses:
        '202':
          description: Reset accepted.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/passkeys:
    get:
      tags: [Users]
      summary: List a user's passkeys
      operationId: listUserPasskeys
      parameters:
        - name: id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: The user's enrolled passkeys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPasskeysResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Users]
      summary: Rename a passkey
      operationId: renameUserPasskey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenamePasskeyRequest'
      responses:
        '202':
          description: Rename accepted.
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Users]
      summary: Delete a passkey
      operationId: deleteUserPasskey
      parameters:
        - name: id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
        - name: credentialId
          in: query
          required: true
          description: The WebAuthn credential id, as returned by `GET /users/passkeys`.
          schema:
            type: string
      responses:
        '202':
          description: Deletion accepted.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/password/reset:
    post:
      tags: [Users]
      summary: Issue a temporary password
      description: |
        Delivers a temporary password over the requested channel. The `show` channel returns
        the plaintext to the caller instead of delivering it and is rejected in production.
        Omitting `channel` still creates the temporary password but delivers it nowhere and
        returns nothing — always pass a channel, or the request silently locks the user out.
      operationId: resetUserPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: The temporary password, returned only for the `show` channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
        '204':
          description: The password was delivered over `email` or `sms`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The `show` channel was requested in production.

  /users/password/set:
    post:
      tags: [Users]
      summary: Set a user's password
      description: A test affordance — returns `404 Not Found` in production.
      operationId: setUserPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '204':
          description: Password set.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The deployment runs in production.

  # ───────────────────────────── Challenges ─────────────────────────────
  /configuration/challenges/otp-templates:
    get:
      tags: [Challenges]
      summary: List a tenant's OTP templates
      operationId: getOtpTemplates
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
      responses:
        '200':
          description: Templates belonging to the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOtpTemplatesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Challenges]
      summary: Create or replace an OTP template
      description: Keyed by `id`, `tenantId`, `purpose` and `channel` together.
      operationId: upsertOtpTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertOtpTemplateRequest'
      responses:
        '204':
          description: Template stored.
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Challenges]
      summary: Delete an OTP template
      description: |
        The template is identified by a request body rather than query parameters, because its
        key is composite.
      operationId: deleteOtpTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteOtpTemplateRequest'
      responses:
        '204':
          description: Template deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/challenges/challenge-settings:
    get:
      tags: [Challenges]
      summary: Get a tenant's challenge settings
      operationId: getChallengeSettings
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
      responses:
        '200':
          description: The settings, or `null` when the tenant has none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetChallengeSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Challenges]
      summary: Create or replace a tenant's challenge settings
      description: |
        Omitted TTL members keep their stored value, or fall back to the built-in default when
        the tenant has no settings yet.
      operationId: upsertChallengeSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertChallengeSettingsRequest'
      responses:
        '204':
          description: Settings stored.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: |
            Refused, with nothing stored -- among other reasons, because `securityProfile` names
            a profile other than the one the tenant was created with, which cannot be changed,
            or because `signingKeyId` names an RS256 key for a tenant on the `fapi2` profile
            (FAPI 2.0 disallows RS256's PKCS#1 v1.5 padding; a `standard` tenant may select one).

  /configuration/forms:
    get:
      tags: [Forms]
      summary: List form versions
      operationId: getAllForms
      responses:
        '200':
          description: Every stored version of every form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllFormsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Forms]
      summary: Store a new form version
      description: |
        Creates a new version without activating it. Activate it separately with
        `PUT /configuration/forms/active`.
      operationId: updateForm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFormRequest'
      responses:
        '204':
          description: Version stored.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/forms/previews:
    get:
      tags: [Forms]
      summary: List the states of the built-in forms the console previews
      description: |
        For each built-in form, the states it can be in -- the `step` object `auth` would inject into the page,
        and the error key shown above it -- with realistic data. The console renders them in the form preview.
        A form that is not listed (a custom one) is previewed from its backend properties instead. The list is
        fixed by the `central` build; it is not stored and cannot be changed through the API.
      operationId: getFormPreviews
      responses:
        '200':
          description: The preview scenarios, grouped by form id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFormPreviewsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/forms/active:
    put:
      tags: [Forms]
      summary: Activate a form version
      description: The activated version is the one auth serves; activating another rolls back or forward.
      operationId: setActiveFormVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetActiveVersionRequest'
      responses:
        '204':
          description: Version activated.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/locales:
    get:
      tags: [Locales]
      summary: List locales
      operationId: getLocales
      responses:
        '200':
          description: Every locale, active or not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLocalesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Locales]
      summary: Add and remove locales
      description: |
        A locale can only be activated once every form, scope and OTP template has content for
        it; otherwise the missing keys are reported.
      operationId: updateLocales
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocalesRequest'
      responses:
        '204':
          description: Locales updated.
        '400':
          description: A locale being activated has incomplete localized content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocaleActivationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/locales/default:
    put:
      tags: [Locales]
      summary: Set the default locale
      description: The default is used when the authorization request asks for no `ui_locales`.
      operationId: setDefaultLocale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDefaultLocaleRequest'
      responses:
        '204':
          description: Default set.
        '400':
          description: The locale is unknown or not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocaleActivationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/themes:
    get:
      tags: [Themes]
      summary: List themes available to a tenant
      operationId: getAllThemes
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
      responses:
        '200':
          description: Themes owned by the tenant plus the global ones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllThemesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Themes]
      summary: Create a theme
      description: A theme without `tenantId` is global and available to every tenant.
      operationId: createTheme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThemeRequest'
      responses:
        '201':
          description: Theme created.
        '400':
          description: |
            Refused, with nothing stored: `tokens` name a base that is not built in, a brand colour is not `#rrggbb`,
            a shape, surface or mode is unknown, or the theme is `default`, which is a stylesheet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Themes]
      summary: Update a theme's CSS or tokens
      operationId: updateTheme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateThemeRequest'
      responses:
        '204':
          description: Theme updated. Sending no `tokens` makes it a plain stylesheet again.
        '400':
          description: Refused, with nothing stored, for the reasons given for creating a theme.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Themes]
      summary: Delete a theme
      operationId: deleteTheme
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Theme deleted.
        '400':
          description: The theme id is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: One or more clients still use this theme.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /configuration/themes/presets:
    get:
      tags: [Themes]
      summary: List the built-in themes a theme can be based on
      description: The list is fixed by the `central` build; it is not stored and cannot be changed through the API.
      operationId: getThemePresets
      responses:
        '200':
          description: The built-in themes, each with the value of every token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetThemePresetsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/themes/css:
    post:
      tags: [Themes]
      summary: Render the stylesheet of a theme built from tokens
      description: |
        Returns the stylesheet `auth` would serve for a theme with these tokens and this CSS, so the console's
        preview shows exactly what users get. Nothing is stored.
      operationId: renderTheme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderThemeRequest'
      responses:
        '200':
          description: The stylesheet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderThemeResponse'
        '400':
          description: The tokens name a base that is not built in, or a value (in the tokens or the overrides) is not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/jwks:
    get:
      tags: [JWKS]
      summary: Get the central JWKS
      operationId: getJwks
      responses:
        '200':
          description: The key set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [JWKS]
      summary: Add a JWK
      description: The body is a raw JWK object; its `kid` becomes the key id.
      operationId: createJwk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Jwk'
      responses:
        '201':
          description: Key added.
        '400':
          description: The body is not valid JSON, or has no `kid` member.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [JWKS]
      summary: Replace a JWK
      description: Replaces the stored key whose `kid` matches the one in the body.
      operationId: updateJwk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Jwk'
      responses:
        '204':
          description: Key replaced.
        '400':
          description: The body is not valid JSON, or has no `kid` member.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [JWKS]
      summary: Delete a JWK
      operationId: deleteJwk
      parameters:
        - name: kid
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Key deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/jwks/keys:
    get:
      tags: [JWKS]
      summary: List the keys with their algorithms
      description: |
        Each stored key with the algorithm it is published under and whether central can sign
        with it, for choosing a tenant's signing key. Carries no key material: `canSign` only
        says whether a private half exists.
      operationId: listJwksKeys
      responses:
        '200':
          description: The keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksKeys'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/jwks/generate:
    post:
      tags: [JWKS]
      summary: Generate a signing key
      description: |
        Generates a keypair for `alg`, publishes its public half to the key set and keeps the
        private half, encrypted. Publishing does not put the key into use: a tenant has to
        select it as its signing key, which is what makes a rotation safe -- every verifier
        learns the key before anything signs with it.
      operationId: generateJwk
      parameters:
        - name: alg
          in: query
          required: true
          description: |
            The algorithm the key is generated for and published under. `HS256` is refused: a
            shared secret is not a JWKS key.
          schema:
            type: string
            enum: [RS256, PS256, ES256]
      responses:
        '201':
          description: Key generated and published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedJwk'
        '400':
          description: The algorithm cannot be generated as a key (`HS256`).
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/server-metadata:
    get:
      tags: [Server metadata]
      summary: Get the metadata overrides
      operationId: getServerMetadata
      responses:
        '200':
          description: The stored overrides, or `null` when none are configured.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: true
                  - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Server metadata]
      summary: Replace the metadata overrides
      description: |
        The object is merged over the RFC 8414 metadata auth computes, so it can advertise
        deployment-specific members or override computed ones.
      operationId: upsertServerMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204':
          description: Overrides stored.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/system-settings:
    get:
      tags: [System settings]
      summary: Get the system settings
      operationId: getSystemSettings
      responses:
        '200':
          description: The stored settings, or the built-in defaults.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettingsRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [System settings]
      summary: Replace the system settings
      operationId: upsertSystemSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSettingsRecord'
      responses:
        '204':
          description: Settings stored.
        '400':
          description: The password policy is not usable, e.g. `passwordRegex` does not compile.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/edges:
    get:
      tags: [Edges]
      summary: List edges
      operationId: getAllEdges
      responses:
        '200':
          description: Registered edges and whether each still holds an old key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllEdgesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Edges]
      summary: Register an edge
      description: |
        Central generates the key pair, keeps the public half and returns the private half
        once. The edge signs its `/sync` requests with it.
      operationId: registerEdge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEdgeRequest'
      responses:
        '201':
          description: Edge registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceKeyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Edges]
      summary: Delete an edge
      operationId: deleteEdge
      parameters:
        - $ref: '#/components/parameters/EdgeIdQuery'
      responses:
        '204':
          description: Edge deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/edges/dpop:
    put:
      tags: [Edges]
      summary: Set an edge's DPoP nonce requirement
      description: |
        RFC 9449 §9 for the calls this edge proxies. On costs each client one round trip per
        nonce lifetime and breaks any client that does not retry on `use_dpop_nonce`; off is
        not "prefer a nonce" but "never ask for one", since a challenge over a nonce the edge
        does not insist on is one a nonce-less retry walks past (§11.3). The edge picks the
        change up on its next configuration sync.
      operationId: setEdgeDpop
      parameters:
        - $ref: '#/components/parameters/EdgeIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEdgeDpopRequest'
      responses:
        '204':
          description: Setting recorded.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No edge is registered under that id.

  /configuration/edges/rotate-key:
    post:
      tags: [Edges]
      summary: Rotate an edge key
      description: |
        The previous public key keeps verifying tokens until
        `DELETE /configuration/edges/old-key` retires it, so the edge can be redeployed
        without a gap.
      operationId: rotateEdgeKey
      parameters:
        - $ref: '#/components/parameters/EdgeIdQuery'
      responses:
        '200':
          description: The new key pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceKeyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/edges/old-key:
    delete:
      tags: [Edges]
      summary: Retire an edge's old key
      operationId: deleteOldEdgeKey
      parameters:
        - $ref: '#/components/parameters/EdgeIdQuery'
      responses:
        '204':
          description: Old key removed.
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────────────────── Service ───────────────────────────────
  /service/users/outbox/flush:
    post:
      tags: [Service]
      summary: Flush the user outbox
      description: |
        Drains pending user events to auth synchronously instead of waiting for the poll
        interval. Returns `404 Not Found` in production.
      operationId: flushUserOutbox
      responses:
        '200':
          description: Outbox flushed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The deployment runs in production.

  /service/configuration/sync:
    post:
      tags: [Service]
      summary: Force a configuration sync
      description: |
        Asks auth to reload its configuration caches immediately. Returns `404 Not Found` in
        production.
      operationId: forceConfigurationSync
      responses:
        '200':
          description: Sync triggered.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The deployment runs in production.

  /service/users:
    delete:
      tags: [Service]
      summary: Delete a user
      description: |
        Hard-deletes a user and their credentials. Exists for test cleanup and returns
        `404 Not Found` in production.
      operationId: deleteUser
      parameters:
        - name: id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '204':
          description: User deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The deployment runs in production.

components:
  securitySchemes:
    centralBasic:
      type: http
      scheme: basic
      description: |
        HTTP Basic with the username `central` and the base64url-encoded central resource
        secret as the password.

  responses:
    Unauthorized:
      description: The credentials are missing, malformed or not accepted.

  parameters:
    TenantIdQuery:
      name: tenantId
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/TenantId'
    ClientIdQuery:
      name: clientId
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/ClientId'
    ResourceIdQuery:
      name: resourceId
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    EdgeIdQuery:
      name: edgeId
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/EdgeId'
    OffsetQuery:
      name: offset
      in: query
      description: Number of records to skip. Defaults to `0`.
      schema:
        type: integer
        minimum: 0
        default: 0
    LimitQuery:
      name: limit
      in: query
      description: Maximum number of records to return. Unbounded when omitted.
      schema:
        type: integer
        minimum: 1

  schemas:
    # ───────────────────────── Identifier types ─────────────────────────
    TenantId:
      type: string
      pattern: '^[a-z][a-z0-9-]*$'
      description: Lowercase letters, digits and hyphens, starting with a letter.
      examples: [acme]
    ClientId:
      type: string
      pattern: '^[a-z][a-z0-9-]*$'
      examples: [web-portal]
    ResourceId:
      type: string
      pattern: '^[a-z][a-z0-9-]*$'
      examples: [billing-api]
    RoleId:
      type: string
      pattern: '^[a-z][a-z0-9-]*$'
      examples: [admin]
    EdgeId:
      type: string
      pattern: '^[a-z][a-z0-9-]*$'
      examples: [eu-central]
    ScopeToken:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      examples: [profile]
    Claim:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      examples: [given_name]
    Permission:
      type: string
      pattern: '^[a-z][a-z0-9_]*([.:][a-z][a-z0-9_]*)*$'
      description: Segments of lowercase letters, digits and underscores, separated by `.` or `:`.
      examples: ['billing:invoice.read']
    AuthorizationDetailType:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      description: The RFC 9396 `type` member of an authorization detail object.
      examples: [payment_initiation]
    ResourceEndpointId:
      type: string
      format: uuid
      description: A UUIDv7 chosen by the caller when the endpoint is created.
    FormId:
      type: string
      examples: [login]
    PresetId:
      type: string
      examples: [default]
      description: The id `current` is reserved and rejected when presets are saved.
    UserId:
      type: string
      format: uuid
      description: A UUIDv7 assigned by central.
    Email:
      type: string
      format: email
    Phone:
      type: string
      pattern: '^\+?\d{9,15}$'
      description: |
        A valid international phone number written in E.164 (`+` and digits, no national trunk
        prefix), which is also how it is stored and returned. It is validated, not normalised: a valid
        number spelled any other way, such as `+787011234567` for `+77011234567`, is refused with
        `400`, and so is a lookup by one. Clients (the admin console included) write the number in
        E.164 before sending it.
      examples: ['+77001234567']
    Login:
      type: string
      description: An opaque login handle, when the deployment authenticates by login.
    RedirectUri:
      type: string
      format: uri
      description: |
        An absolute URI with no fragment. A value being registered (a new client, or a
        patch's `add`) must be `https` with a host, or `http` to a loopback address
        (`localhost`, `127.0.0.1`, `[::1]`) for a native app's local listener (FAPI 2.0
        Security Profile §5.3.2.2, RFC 8252 §7.3). Private-use schemes
        (`com.example.app://...`) are refused under the tenant's default `fapi2`
        security profile -- native apps register a claimed `https` redirect (App Links /
        Universal Links) instead; a `standard`-profile tenant may register a
        reverse-domain private-use scheme (RFC 8252 §7.1). A patch's `remove` still accepts
        any value already stored, so a client registered before this rule can be cleaned up.
      examples: ['https://app.example.com/callback']
    ResourceUri:
      type: string
      format: uri
      description: |
        The absolute origin identifying a protected resource — no path, query or fragment.
        The `resource://` scheme is reserved.
      examples: ['https://billing.example.com']
    Secret:
      type: string
      description: A base64url-encoded secret. Returned only at creation or rotation time.
    JsonWebKeySet:
      type: object
      description: |
        RFC 7517 §5 JWK Set document -- the exact document registered, not a narrowed model
        of it, so members this schema does not name still round-trip.

        Every key must be a public key usable with a supported client assertion signing
        algorithm (ES256, PS256, RS256): an EC key on a curve other than P-256, or a key
        whose own `alg` its type cannot perform, is refused at registration rather than
        failing every authentication attempt later.
      properties:
        keys:
          type: array
          items:
            type: object
      required: [keys]
    LocalizedText:
      type: object
      additionalProperties:
        type: string
      description: BCP 47 language tag to text.
      examples:
        - en: Sign in
          ru: Вход
    Message:
      type: object
      properties:
        message:
          type: string
      required: [message]
    Jwk:
      type: object
      additionalProperties: true
      description: An RFC 7517 JSON Web Key. Must contain a `kid` member.
      required: [kid]
      properties:
        kid:
          type: string
    Jwks:
      type: object
      description: An RFC 7517 JSON Web Key Set.
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Jwk'
      required: [keys]

    JwksKeys:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JwkSummary'
      required: [keys]
    JwkSummary:
      type: object
      properties:
        kid:
          type: string
        algorithm:
          type: string
          description: The `alg` the key is published under. Absent when it has no recognised one.
        keyType:
          type: string
          description: The JWK `kty`, when present.
        curve:
          type: string
          description: The JWK `crv`, for an EC key. Absent otherwise.
        canSign:
          type: boolean
          description: Whether central holds the private half, so a tenant can sign with this key.
      required: [kid, canSign]
    GeneratedJwk:
      type: object
      properties:
        kid:
          type: string
        alg:
          type: string
      required: [kid, alg]

    # ───────────────────────────── Patches ─────────────────────────────
    PatchDescription:
      type: object
      description: Translations to add or overwrite, and language tags to drop.
      properties:
        add:
          $ref: '#/components/schemas/LocalizedText'
        delete:
          type: array
          uniqueItems: true
          items:
            type: string
      required: [add, delete]
    PatchPermissions:
      type: object
      properties:
        add:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
        remove:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
      required: [add, remove]
    PatchAudience:
      description: >-
        Change to a resource's audience. Applied to the stored list in order, and idempotent: a
        client already in the audience is not added twice, so concurrent writers adding themselves
        do not drop each other the way submitting a whole list would.
      type: object
      properties:
        add:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ClientId'
        remove:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ClientId'
      required: [add, remove]
    PatchClientRedirectUris:
      type: object
      properties:
        add:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RedirectUri'
        remove:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RedirectUri'
      required: [add, remove]
    PatchClientScope:
      type: object
      properties:
        add:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ScopeToken'
        remove:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ScopeToken'
      required: [add, remove]

    # ───────────────────────────── Tenants ─────────────────────────────
    TenantResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/TenantId'
        description:
          type: string
        edgeId:
          description: |
            The edge this tenant is bound to. Sync is edge-scoped: an edge only receives
            tenants whose `edgeId` matches its own, so `null` means the tenant is not
            assigned to any edge yet and no edge will serve it.
          oneOf:
            - $ref: '#/components/schemas/EdgeId'
            - type: 'null'
        securityProfile:
          allOf:
            - $ref: '#/components/schemas/SecurityProfile'
          description: |
            Read from the tenant's challenge settings, where it is stored (`ChallengeSettingsRecord`);
            a tenant whose settings row is missing reads as `fapi2`, the profile it would be
            created with.
        signingKeyId:
          description: |
            The `kid` of the published JWKS key this tenant's tokens are signed with, also from its
            challenge settings. `null` when the tenant falls back to auth's configured key, which
            is what lets a console answer "which tenants use this key" from the listing alone.
          oneOf:
            - type: string
            - type: 'null'
      required: [id, description, securityProfile]
    GetAllTenantsResponse:
      type: object
      properties:
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantResponse'
      required: [tenants]
    CreateTenantRequest:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/TenantId'
        description:
          type: string
        edgeId:
          oneOf:
            - $ref: '#/components/schemas/EdgeId'
            - type: 'null'
        securityProfile:
          oneOf:
            - $ref: '#/components/schemas/SecurityProfile'
            - type: 'null'
          description: >-
            The profile the tenant's clients are held to; `fapi2` when omitted. Settled here and
            never changed: the challenge-settings endpoint refuses any other value afterwards,
            and so does posting this tenant again with a different one.
      description: >-
        Takes no submission limits: every tenant is seeded with the recommended ones, so
        there is no caller-supplied rate-limit configuration to validate or fall back on.
        They are edited afterwards through the challenge-settings endpoint.
      required: [id, description]
    UpdateTenantRequest:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/TenantId'
        description:
          type: string
        edgeId:
          oneOf:
            - $ref: '#/components/schemas/EdgeId'
            - type: 'null'
      required: [id, description]

    # ───────────────────────── Auth flows ─────────────────────────
    PrimaryCredential:
      type: string
      enum: [email, phone, login]
    OtpType:
      type: string
      enum: [sms, email]
    AuthFactorType:
      type: string
      enum: [otp, password, passkeyEnroll]
    PassedAuthFactor:
      type: string
      enum: [otp, password, passkey]
    AuthFactor:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AuthFactorType'
        required:
          type: boolean
      required: [type, required]
    PrimaryAuthFlow:
      type: object
      properties:
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/PrimaryCredential'
        inlinePassword:
          type: boolean
          description: Whether the password field is shown next to the credential field.
        factors:
          type: array
          items:
            $ref: '#/components/schemas/AuthFactor'
      required: [credentials, inlinePassword, factors]
    PasskeyAuthFlow:
      type: object
      properties:
        factors:
          type: array
          items:
            $ref: '#/components/schemas/AuthFactor'
      required: [factors]
    AuthFlow:
      type: object
      description: How a client's users authenticate.
      properties:
        primary:
          $ref: '#/components/schemas/PrimaryAuthFlow'
        passkey:
          oneOf:
            - $ref: '#/components/schemas/PasskeyAuthFlow'
            - type: 'null'
        equivalents:
          type: object
          description: |
            Factors that satisfy another factor. Keyed by the required factor, valued by the
            set of factors accepted in its place.
          additionalProperties:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/PassedAuthFactor'
        otpType:
          $ref: '#/components/schemas/OtpType'
      required: [primary, equivalents, otpType]
    ConsentFlowDto:
      type: object
      description: Whether and how the consent screen is shown before a grant is issued.
      properties:
        allowPartial:
          type: boolean
          description: |
            Whether the user may deselect optional scopes. `openid` is never deselectable, and
            neither is `offline_access` unless `offlineAccessOptional` is set.
        requiredScopes:
          type: array
          uniqueItems: true
          items:
            type: string
          default: []
          description: |
            Scopes the user cannot deselect when the client requests them, on top of `openid`
            and `offline_access`, which are always required. The consent screen keeps them
            ticked and the authorization server refuses a grant that drops one; the user can
            still deny the whole request. A scope the client did not request is ignored.
            Meaningful only with `allowPartial`: without it the whole requested scope is
            granted or denied.
        offlineAccessOptional:
          type: boolean
          default: false
          description: |
            Lets the user deselect `offline_access` ("long-lived access"). When they do, the
            client receives no refresh token and must be able to sign the user in again. A
            client that lists `offline_access` in `requiredScopes` keeps it required.
            Meaningful only with `allowPartial`.
        rememberDuration:
          description: |
            Seconds a granted consent is reused without re-prompting. `null` remembers it
            until revoked.
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: 'null'
      required: [allowPartial]
    ClientKind:
      type: string
      enum: [web, device, service]
      description: |
        `web`: a site with a backend, where users sign in (`/configuration/clients/web`).
        `device`: an app installed on a device, holding a DPoP key (`/configuration/clients/native`).
        `service`: code calling an API with no user present (`/configuration/clients/service`).
    ClientTemplate:
      type: object
      description: |
        What the registration wizard was told is being built, stored as the client registered it
        rather than derived back out of the settings it applied: once a setting has been
        edited, several combinations fit the client equally well.
      properties:
        kind:
          type: string
          enum: [web, device, service]
          description: |
            `web` keeps a credential of its own, `device` cannot, `service` calls on its own
            behalf with no user to sign in.
      required: [kind]
    OAuthClientResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ClientId'
        clientName:
          $ref: '#/components/schemas/LocalizedText'
        redirectUris:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RedirectUri'
        scope:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ScopeToken'
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
        secretRotation:
          type: boolean
          description: Whether a previous secret is still accepted.
        authMethod:
          $ref: '#/components/schemas/AuthMethod'
        applicationType:
          $ref: '#/components/schemas/ApplicationType'
        accessTokenTtl:
          type: integer
          format: int64
          description: Seconds.
        refreshTokenTtl:
          type: integer
          format: int64
          description: Seconds.
        theme:
          type: string
        authFlow:
          oneOf:
            - $ref: '#/components/schemas/AuthFlow'
            - type: 'null'
        otpTemplateId:
          type: string
        frontChannelLogoutUri:
          type: [string, 'null']
        frontChannelLogoutSessionRequired:
          type: boolean
        backChannelLogoutUri:
          type: [string, 'null']
        logoUri:
          type: [string, 'null']
        policyUri:
          type: [string, 'null']
        tosUri:
          type: [string, 'null']
        consentFlow:
          oneOf:
            - $ref: '#/components/schemas/ConsentFlowDto'
            - type: 'null'
        dpopBoundAccessTokens:
          type: boolean
          description: |
            RFC 9449 §5.2: the client always uses DPoP. A token request from it that carries no
            proof is refused with `invalid_dpop_proof` rather than answered with a bearer token.
        dpopSigningAlgs:
          type: array
          items:
            type: string
            enum: [ES256, PS256, RS256]
          description: |
            RFC 9449 §5.1: the signing algorithms a DPoP proof from this client may use,
            narrowing `dpop_signing_alg_values_supported`. An empty array registers no
            narrowing. Narrowing only ever subtracts - naming an algorithm the metadata
            document does not advertise does not make it acceptable.
        dpopMinRsaKeySize:
          type: [integer, 'null']
          description: |
            The modulus length, in bits, an RSA DPoP proof key from this client must reach.
            `null` leaves the RFC 7518 §3.3 floor of 2048 bits, which applies to every client
            regardless; a value below it is refused at registration.
        jwks:
          oneOf:
            - $ref: '#/components/schemas/JsonWebKeySet'
            - type: 'null'
          description: |
            RFC 7523 §2.2 `private_key_jwt`: the public keys this client signs its client
            assertions with. `null` means the client does not use the method.
        requireSignedRequestObject:
          type: boolean
          description: |
            RFC 9101 §10.5: the client states its authorization request in a request object it
            signed, so a plain parameter set from it is refused with `invalid_request`.
            Needs `jwks` - a request object is verified against no other keys.
        mtlsAuth:
          oneOf:
