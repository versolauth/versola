          $ref: '#/components/schemas/TenantId'
        email:
          oneOf:
            - $ref: '#/components/schemas/Email'
            - type: 'null'
        phone:
          oneOf:
            - $ref: '#/components/schemas/Phone'
            - type: 'null'
      required: [userId, tenantId]
    UserSearchRecord:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        email:
          oneOf:
            - $ref: '#/components/schemas/Email'
            - type: 'null'
        phone:
          oneOf:
            - $ref: '#/components/schemas/Phone'
            - type: 'null'
        login:
          oneOf:
            - $ref: '#/components/schemas/Login'
            - type: 'null'
        claims:
          type: object
          additionalProperties: true
      required: [id, claims]
    UserSearchResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserSearchRecord'
      required: [users]
    UserRolesResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleId'
      required: [roles]
    PasskeyInfo:
      type: object
      properties:
        id:
          type: string
          description: The WebAuthn credential id.
        name:
          type: [string, 'null']
        deviceType:
          type: string
        transports:
          type: array
          items:
            type: string
        backedUp:
          type: boolean
        backupEligible:
          type: boolean
        lastUsedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, deviceType, transports, backedUp, backupEligible, createdAt]
    ListPasskeysResponse:
      type: object
      properties:
        passkeys:
          type: array
          items:
            $ref: '#/components/schemas/PasskeyInfo'
      required: [passkeys]
    RenamePasskeyRequest:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        credentialId:
          type: string
        name:
          type: [string, 'null']
      required: [userId, credentialId]
    DeliveryChannel:
      type: string
      enum: [email, sms, show]
      description: '`show` returns the plaintext to the caller and is rejected in production.'
    ResetPasswordRequest:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        expiresInSeconds:
          type: integer
          format: int64
        channel:
          oneOf:
            - $ref: '#/components/schemas/DeliveryChannel'
            - type: 'null'
      required: [userId, expiresInSeconds]
    ResetPasswordResponse:
      type: object
      properties:
        password:
          type: string
      required: [password]
    SetPasswordRequest:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        password:
          type: string
      required: [userId, password]
    ClientSessionEntry:
      type: object
      properties:
        clientId:
          $ref: '#/components/schemas/ClientId'
        enteredAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Derived from the client's access token TTL.
      required: [clientId, enteredAt, expiresAt]
    SessionResponse:
      type: object
      properties:
        publicId:
          type: string
        clients:
          type: array
          items:
            $ref: '#/components/schemas/ClientSessionEntry'
        platform:
          type: [string, 'null']
        os:
          type: [string, 'null']
        browser:
          type: [string, 'null']
        version:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
      required: [publicId, clients, createdAt]

    # ──────────────────────────── Challenges ────────────────────────────
    OtpTemplatePurpose:
      type: string
      enum: [otp, password]
    OtpTemplateChannel:
      type: string
      enum: [sms, email]
    OtpTemplateRecord:
      type: object
      properties:
        id:
          type: string
        tenantId:
          $ref: '#/components/schemas/TenantId'
        localizations:
          $ref: '#/components/schemas/LocalizedText'
        purpose:
          $ref: '#/components/schemas/OtpTemplatePurpose'
        channel:
          $ref: '#/components/schemas/OtpTemplateChannel'
      required: [id, tenantId, localizations, purpose, channel]
    GetOtpTemplatesResponse:
      type: object
      properties:
        templates:
          type: array
          items:
            $ref: '#/components/schemas/OtpTemplateRecord'
      required: [templates]
    UpsertOtpTemplateRequest:
      $ref: '#/components/schemas/OtpTemplateRecord'
    DeleteOtpTemplateRequest:
      type: object
      properties:
        id:
          type: string
        tenantId:
          $ref: '#/components/schemas/TenantId'
        purpose:
          $ref: '#/components/schemas/OtpTemplatePurpose'
        channel:
          $ref: '#/components/schemas/OtpTemplateChannel'
      required: [id, tenantId, purpose, channel]
    RateLimit:
      type: object
      properties:
        maxAttempts:
          type: integer
        windowSeconds:
          type: integer
      required: [maxAttempts, windowSeconds]
    SubmissionLimits:
      type: object
      description: Sliding-window limits per action, and how long a breach bans the credential.
      properties:
        otpRequest:
          type: array
          items:
            $ref: '#/components/schemas/RateLimit'
        otpSubmit:
          type: array
          items:
            $ref: '#/components/schemas/RateLimit'
        passwordSubmit:
          type: array
          items:
            $ref: '#/components/schemas/RateLimit'
        passkeyAssertion:
          type: array
          items:
            $ref: '#/components/schemas/RateLimit'
        banDurationSeconds:
          type: integer
    PasskeySettings:
      type: object
      properties:
        rpId:
          type: string
          description: The WebAuthn relying party id.
        rpName:
          type: string
        origins:
          type: array
          items:
            type: string
        userVerification:
          type: string
          description: 'The WebAuthn user verification requirement, e.g. `preferred`.'
      required: [rpId, rpName, origins, userVerification]
    ChallengeSettingsRecord:
      type: object
      properties:
        tenantId:
          $ref: '#/components/schemas/TenantId'
        allowedPrefixes:
          type: array
          description: Phone country prefixes accepted on the login form.
          items:
            type: string
        submissionLimits:
          $ref: '#/components/schemas/SubmissionLimits'
        otpLength:
          type: integer
        otpResendAfter:
          type: integer
          description: Seconds before a new code can be requested.
        passkeySettings:
          $ref: '#/components/schemas/PasskeySettings'
        authConversationTtlSeconds:
          type: integer
        sessionTtlSeconds:
          type: integer
        sessionIdleTtlSeconds:
          type: [integer, 'null']
        userAgentTtlSeconds:
          type: integer
        ipHeader:
          type: string
          description: Header edge reads the client IP from.
        acrVocabulary:
          type: [object, 'null']
          description: '`acr` value to the authentication methods that satisfy it.'
          additionalProperties:
            type: array
            items:
              type: string
        postLogoutRedirectUris:
          type: array
          items:
            type: string
      required:
        - tenantId
        - allowedPrefixes
        - submissionLimits
        - otpLength
        - otpResendAfter
        - passkeySettings
        - authConversationTtlSeconds
        - sessionTtlSeconds
        - userAgentTtlSeconds
        - ipHeader
        - postLogoutRedirectUris
    GetChallengeSettingsResponse:
      type: object
      properties:
        settings:
          oneOf:
            - $ref: '#/components/schemas/ChallengeSettingsRecord'
            - type: 'null'
    UpsertChallengeSettingsRequest:
      type: object
      properties:
        tenantId:
          $ref: '#/components/schemas/TenantId'
        allowedPrefixes:
          type: array
          items:
            type: string
        submissionLimits:
          $ref: '#/components/schemas/SubmissionLimits'
        otpLength:
          type: integer
        otpResendAfter:
          type: integer
        passkeySettings:
          $ref: '#/components/schemas/PasskeySettings'
        authConversationTtlSeconds:
          type: [integer, 'null']
          description: Keeps the stored value when omitted; defaults to 900 for a new tenant.
        sessionTtlSeconds:
          type: [integer, 'null']
          description: Keeps the stored value when omitted; defaults to 86400 for a new tenant.
        sessionIdleTtlSeconds:
          type: [integer, 'null']
        userAgentTtlSeconds:
          type: [integer, 'null']
          description: Keeps the stored value when omitted; defaults to 15552000 for a new tenant.
        ipHeader:
          type: string
        acrVocabulary:
          type: [object, 'null']
          additionalProperties:
            type: array
            items:
              type: string
        postLogoutRedirectUris:
          type: [array, 'null']
          items:
            type: string
      required:
        - tenantId
        - allowedPrefixes
        - submissionLimits
        - otpLength
        - otpResendAfter
        - passkeySettings
        - ipHeader

    # ────────────────────────────── Forms ──────────────────────────────
    BackendProperty:
      type: object
      description: A form setting the login UI exposes to the deployment.
      discriminator:
        propertyName: type
      oneOf:
        - $ref: '#/components/schemas/BooleanProperty'
        - $ref: '#/components/schemas/StringArrayProperty'
        - $ref: '#/components/schemas/NumberProperty'
    BooleanProperty:
      type: object
      title: BooleanProperty
      properties:
        type:
          type: string
          const: BooleanProperty
        name:
          type: string
      required: [type, name]
    StringArrayProperty:
      type: object
      title: StringArrayProperty
      properties:
        type:
          type: string
          const: StringArrayProperty
        name:
          type: string
        allowedValues:
          type: array
          items:
            type: string
      required: [type, name, allowedValues]
    NumberProperty:
      type: object
      title: NumberProperty
      properties:
        type:
          type: string
          const: NumberProperty
        name:
          type: string
        default:
          type: integer
        min:
          type: [integer, 'null']
        max:
          type: [integer, 'null']
      required: [type, name, default]
    FormRecord:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/FormId'
        version:
          type: integer
        active:
          type: boolean
        style:
          type: string
          description: The form's CSS.
        jsSource:
          type: [string, 'null']
          description: TypeScript source, kept so the console can edit the form.
        jsCompiled:
          type: [string, 'null']
          description: The JavaScript auth actually serves.
        localizations:
          type: object
          description: Language tag to message key to text.
          additionalProperties:
            $ref: '#/components/schemas/LocalizedText'
        properties:
          type: array
          items:
            $ref: '#/components/schemas/BackendProperty'
      required: [id, version, active, style, localizations, properties]
    GetAllFormsResponse:
      type: object
      properties:
        forms:
          type: array
          items:
            $ref: '#/components/schemas/FormRecord'
      required: [forms]
    UpdateFormRequest:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/FormId'
        style:
          type: string
        jsSource:
          type: [string, 'null']
        jsCompiled:
          type: [string, 'null']
        localizations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LocalizedText'
        properties:
          type: array
          items:
            $ref: '#/components/schemas/BackendProperty'
      required: [id, style, localizations, properties]
    SetActiveVersionRequest:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/FormId'
        version:
          type: integer
      required: [id, version]

    # ───────────────────────────── Locales ─────────────────────────────
    LocaleRecord:
      type: object
      properties:
        code:
          type: string
          description: A BCP 47 language tag.
        name:
          type: string
          description: The locale's name in its own language.
        isDefault:
          type: boolean
        active:
          type: boolean
      required: [code, name, isDefault, active]
    GetLocalesResponse:
      type: object
      properties:
        locales:
          type: array
          items:
            $ref: '#/components/schemas/LocaleRecord'
      required: [locales]
    UpdateLocalesRequest:
      type: object
      properties:
        add:
          type: array
          items:
            $ref: '#/components/schemas/LocaleRecord'
        delete:
          type: array
          items:
            type: string
      required: [add, delete]
    SetDefaultLocaleRequest:
      type: object
      properties:
        code:
          type: string
      required: [code]
    LocaleActivationError:
      type: object
      properties:
        locale:
          type: string
        missing:
          type: array
          description: Keys that have no content in this locale.
          items:
            type: string
      required: [locale, missing]
    ThemeRecord:
      type: object
      properties:
        id:
          type: string
        css:
          type: string
        tenantId:
          description: '`null` for a global theme.'
          oneOf:
            - $ref: '#/components/schemas/TenantId'
            - type: 'null'
      required: [id, css]
    GetAllThemesResponse:
      type: object
      properties:
        themes:
          type: array
          items:
            $ref: '#/components/schemas/ThemeRecord'
      required: [themes]
    CreateThemeRequest:
      $ref: '#/components/schemas/ThemeRecord'
    UpdateThemeRequest:
      type: object
      properties:
        id:
          type: string
        css:
          type: string
      required: [id, css]

    # ─────────────────────────── System settings ───────────────────────────
    SystemSettingsRecord:
      type: object
      description: |
        Global settings. The password policy lives here because password credentials are
        stored per user, not per tenant.
      properties:
        passwordRegex:
          type: string
          description: A password must match this regular expression.
        passwordHistorySize:
          type: integer
          description: How many previous passwords a new one is compared against.
        passwordNumDifferent:
          type: integer
          description: How many characters a new password must differ by.
        identityProviderLogo:
          type: [string, 'null']
      required: [passwordRegex, passwordHistorySize, passwordNumDifferent]

    # ─────────────────────────────── Edges ───────────────────────────────
    RegisterEdgeRequest:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/EdgeId'
      required: [id]
    EdgeResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/EdgeId'
        hasOldKey:
          type: boolean
          description: Whether a rotation is open and the previous key still verifies.
      required: [id, hasOldKey]
    GetAllEdgesResponse:
      type: object
      properties:
        edges:
          type: array
          items:
            $ref: '#/components/schemas/EdgeResponse'
      required: [edges]
    ServiceKeyResponse:
      type: object
      properties:
        keyId:
          type: string
        privateKey:
          type: string
          description: The base64url-encoded PKCS#8 private key. Returned only once.
      required: [keyId, privateKey]
