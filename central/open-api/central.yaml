    CreateWebClientRequest:
      type: object
      additionalProperties: false
      description: |
        A site with a backend: users sign in, and tokens stay on the server. Confidential, so
        `authMethod` is `client_secret`, `private_key_jwt`, `tls_client_auth` or
        `self_signed_tls_client_auth` -- never `none` -- and at least one redirect URI is required.

        Fronted by edge (`issueEdgeClientCertificate`, `enrollEdgeClientCertificate` or a supplied
        certificate) it cannot set `requireSignedRequestObject`: edge holds no key to sign one with.

        Recorded as a `web` client. `frontChannelLogoutUri` and `backChannelLogoutUri` are never both
        set, and `logoUri`, `policyUri` and `tosUri` must be absolute HTTPS URLs.
        Members that are not listed here are refused, not ignored.
      properties:
