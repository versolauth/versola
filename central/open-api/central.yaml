              schema:
                $ref: '#/components/schemas/GetOtpTemplatesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Challenges]
      summary: Create or replace an OTP template
      description: Keyed by `id`, `tenantId`, `purpose` and `channel` together.
      operationId: upsertOtpTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertOtpTemplateRequest'
      responses:
        '204':
          description: Template stored.
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Challenges]
      summary: Delete an OTP template
      description: |
        The template is identified by a request body rather than query parameters, because its
        key is composite.
      operationId: deleteOtpTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteOtpTemplateRequest'
      responses:
        '204':
          description: Template deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/challenges/challenge-settings:
    get:
      tags: [Challenges]
      summary: Get a tenant's challenge settings
      operationId: getChallengeSettings
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
      responses:
        '200':
          description: The settings, or `null` when the tenant has none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetChallengeSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Challenges]
      summary: Create or replace a tenant's challenge settings
      description: |
        Omitted TTL members keep their stored value, or fall back to the built-in default when
        the tenant has no settings yet.

        The whole record is written, so a client that edits one member overwrites a concurrent edit of
        another: change members of existing settings with `PATCH`, and use this call to create them.
      operationId: upsertChallengeSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertChallengeSettingsRequest'
      responses:
        '204':
          description: Settings stored.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: |
            Refused, with nothing stored -- among other reasons, because `securityProfile` names
            a profile other than the one the tenant was created with, which cannot be changed,
            or because `signingKeyId` names an RS256 key for a tenant on the `fapi2` profile
            (FAPI 2.0 disallows RS256's PKCS#1 v1.5 padding; a `standard` tenant may select one).

    patch:
      tags: [Challenges]
      summary: Patch a tenant's challenge settings
      description: |
        JSON merge patch (RFC 7396) of the record `PUT` writes, at the level of its members: a member
        the body names is replaced, one it leaves out keeps its stored value. Two admins patching
        different members at once both land -- the merge runs on the stored row under a lock, so
        neither overwrites the other, which a `PUT` of the whole record cannot promise.

        A named member is replaced whole, never merged into: `submissionLimits`, `passkeySettings`,
        `emailRegistration` and `acrVocabulary` are sent in full, and so are `phoneRegions` and the
        other lists. `null` clears a member, but only the optional ones --
        `sessionIdleTtlSeconds`, `acrVocabulary`, `mtlsCertificateHeader`, `mtlsCertificateEncoding`,
        `signingKeyId`, `logoLight` and `logoDark`. `null` for any other member is refused with
        `400` rather than read as absent, and so is a key the record does not have.

        The record that would result is validated exactly as a `PUT` validates its record (the
        header/encoding pair, the logo pair, the assertion lifetime range, phone regions, email
        domains, default roles, the signing key), and nothing is stored when it is refused.
        Unlike `PUT`, this does not create settings: a tenant that has none gets `404`.
      operationId: patchChallengeSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchChallengeSettingsRequest'
            examples:
              onlyTheSessionLifetime:
                summary: Change one member; every other keeps its value
                value:
                  tenantId: acme
                  sessionTtlSeconds: 43200
              clearTheSigningKey:
                summary: Clear an optional member and change a second one
                value:
                  tenantId: acme
                  signingKeyId: null
                  otpLength: 8
      responses:
        '204':
          description: Settings stored.
        '400':
          description: |
            Refused, with nothing stored: a key the record does not have, `null` for a member that
            is not optional, a body without `tenantId`, or a resulting record that breaks a rule
            of `PUT` (see above), among them a `securityProfile` other than the one the tenant
            was created with.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The tenant has no challenge settings yet; create them with `PUT`.


  /configuration/forms:
    get:
      tags: [Forms]
      summary: List form versions
      operationId: getAllForms
      responses:
        '200':
          description: Every stored version of every form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllFormsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Forms]
      summary: Store a new form version
      description: |
        Creates a new version without activating it. Activate it separately with
        `PUT /configuration/forms/active`.

        `localizations` is language first, `{ "en": { "<key>": "..." }, "ru": { ... } }`, the shape of a form's
        `<name>.i18n.json`. The languages must agree: each has exactly the same keys, and a key has the same
        `{placeholder}` names in every language (their order may differ). A version that breaks this is refused with
        a `400` and nothing is stored, because the form looks a text up by key and fills its placeholders from the
        page, so a language that differs breaks the page for its readers only. Central compares the others with
        `en` (the first language by code when there is no `en`). A language need not be a registered or active
        locale: central stores texts ahead of a language being switched on, and activating a locale checks it is
        complete.
      operationId: updateForm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFormRequest'
      responses:
        '204':
          description: Version stored.
        '400':
          description: >-
            Refused, with nothing stored: the languages of `localizations` do not share one set of keys and
            placeholders. The message names the first few faults (a language lacking a key, a key a language adds,
            a key whose placeholders differ), for example `Locale 'ru' has no text for 'title', which 'en' has`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/forms/previews:
    get:
      tags: [Forms]
      summary: List the states of the built-in forms the console previews
      description: |
        For each built-in form, the states it can be in -- the `step` object `auth` would inject into the page,
        and the error key shown above it -- with realistic data. The console renders them in the form preview.
        A form that is not listed (a custom one) is previewed from its backend properties instead. The list is
        fixed by the `central` build; it is not stored and cannot be changed through the API.
      operationId: getFormPreviews
      responses:
        '200':
          description: The preview scenarios, grouped by form id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFormPreviewsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/forms/active:
    put:
      tags: [Forms]
      summary: Activate a form version
      description: The activated version is the one auth serves; activating another rolls back or forward.
      operationId: setActiveFormVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetActiveVersionRequest'
      responses:
        '204':
          description: Version activated.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/locales:
    get:
      tags: [Locales]
      summary: List locales
      operationId: getLocales
      responses:
        '200':
          description: Every locale, active or not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLocalesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Locales]
      summary: Add and remove locales
      description: |
        A locale can only be activated once every form, scope and OTP template has content for
        it; otherwise the missing keys are reported.
      operationId: updateLocales
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocalesRequest'
      responses:
        '204':
          description: Locales updated.
        '400':
          description: A locale being activated has incomplete localized content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocaleActivationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/locales/default:
    put:
      tags: [Locales]
      summary: Set the default locale
      description: The default is used when the authorization request asks for no `ui_locales`.
      operationId: setDefaultLocale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDefaultLocaleRequest'
      responses:
        '204':
          description: Default set.
        '400':
          description: The locale is unknown or not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocaleActivationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/themes:
    get:
      tags: [Themes]
      summary: List themes available to a tenant
      operationId: getAllThemes
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
      responses:
        '200':
          description: Themes owned by the tenant plus the global ones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllThemesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Themes]
      summary: Create a theme
      description: A theme without `tenantId` is global and available to every tenant.
      operationId: createTheme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThemeRequest'
      responses:
        '201':
          description: Theme created.
        '400':
          description: |
            Refused, with nothing stored: `tokens` name a base that is not built in, a brand colour is not `#rrggbb`,
            a shape, surface or mode is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Themes]
      summary: Update a theme's CSS or tokens
      operationId: updateTheme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateThemeRequest'
      responses:
        '204':
          description: >-
            Theme updated. Sending no `tokens` stores the theme with CSS only, so its `css` is then the whole stylesheet.
        '400':
          description: Refused, with nothing stored, for the reasons given for creating a theme.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Themes]
      summary: Delete a theme
      operationId: deleteTheme
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Theme deleted.
        '400':
          description: The theme id is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: One or more clients still use this theme.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /configuration/themes/presets:
    get:
      tags: [Themes]
      summary: List the built-in themes a theme can be based on
      description: The list is fixed by the `central` build; it is not stored and cannot be changed through the API.
      operationId: getThemePresets
      responses:
        '200':
          description: The built-in themes, each with the value of every token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetThemePresetsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/themes/variables:
    get:
      tags: [Themes]
      summary: List the tokens a theme may set one by one
      description: |
        The forms' theming API: every token a theme may override in `tokens.variables`, grouped as the console lists them,
        with its kind, whether it takes a light and a dark value, a one-line description in each language and its default.
        The list is fixed by the `central` build; it is not stored and cannot be changed through the API.
      operationId: getThemeVariables
      responses:
        '200':
          description: The groups and the tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetThemeVariablesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/themes/css:
    post:
      tags: [Themes]
      summary: Render the stylesheet of a theme built from tokens
      description: |
        Returns the stylesheet `auth` would serve for a theme with these tokens and this CSS, so the console's
        preview shows exactly what users get. Nothing is stored.
      operationId: renderTheme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderThemeRequest'
      responses:
        '200':
          description: The stylesheet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderThemeResponse'
        '400':
          description: The tokens name a base that is not built in, or a value (in the tokens or the overrides) is not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/jwks:
    get:
      tags: [JWKS]
      summary: Get the central JWKS
      operationId: getJwks
      responses:
        '200':
          description: The key set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [JWKS]
      summary: Add a JWK
      description: The body is a raw JWK object; its `kid` becomes the key id.
      operationId: createJwk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Jwk'
      responses:
        '201':
          description: Key added.
        '400':
          description: The body is not valid JSON, or has no `kid` member.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [JWKS]
      summary: Replace a JWK
      description: Replaces the stored key whose `kid` matches the one in the body.
      operationId: updateJwk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Jwk'
      responses:
        '204':
          description: Key replaced.
        '400':
          description: The body is not valid JSON, or has no `kid` member.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [JWKS]
      summary: Delete a JWK
      operationId: deleteJwk
      parameters:
        - name: kid
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Key deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/jwks/keys:
    get:
      tags: [JWKS]
      summary: List the keys with their algorithms
      description: |
        Each stored key with the algorithm it is published under and whether central can sign
        with it, for choosing a tenant's signing key. Carries no key material: `canSign` only
        says whether a private half exists.
      operationId: listJwksKeys
      responses:
        '200':
          description: The keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksKeys'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/jwks/generate:
    post:
      tags: [JWKS]
      summary: Generate a signing key
      description: |
        Generates a keypair for `alg`, publishes its public half to the key set and keeps the
        private half, encrypted. Publishing does not put the key into use: a tenant has to
        select it as its signing key, which is what makes a rotation safe -- every verifier
        learns the key before anything signs with it.
      operationId: generateJwk
      parameters:
        - name: alg
          in: query
          required: true
          description: |
            The algorithm the key is generated for and published under. `HS256` is refused: a
            shared secret is not a JWKS key.
          schema:
            type: string
            enum: [RS256, PS256, ES256]
      responses:
        '201':
          description: Key generated and published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedJwk'
        '400':
          description: The algorithm cannot be generated as a key (`HS256`).
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/server-metadata:
    get:
      tags: [Server metadata]
      summary: Get the metadata overrides
      operationId: getServerMetadata
      responses:
        '200':
          description: The stored overrides, or `null` when none are configured.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: true
                  - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Server metadata]
      summary: Replace the metadata overrides
      description: |
        The object is merged over the RFC 8414 metadata auth computes, so it can advertise
        deployment-specific members or override computed ones.
      operationId: upsertServerMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204':
          description: Overrides stored.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/system-settings:
    get:
      tags: [System settings]
      summary: Get the system settings
      operationId: getSystemSettings
      responses:
        '200':
          description: The stored settings, or the built-in defaults.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettingsRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [System settings]
      summary: Replace the system settings
      operationId: upsertSystemSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSettingsRecord'
      responses:
        '204':
          description: Settings stored.
        '400':
          description: The password policy is not usable, e.g. `passwordRegex` does not compile.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/delivery-settings:
    get:
      tags: [Delivery settings]
      summary: Get the delivery settings
      description: |
        Each block without its password, and whether a password is on record. Both blocks are
        absent until the first save.
      operationId: getDeliverySettings
      responses:
        '200':
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliverySettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Delivery settings]
      summary: Replace the delivery settings
      description: |
        Stores both blocks as sent. A password that is left out (or sent as `null`) keeps the one
        on record, so a caller that never sees the stored password can still change the rest of
        the block; an empty password clears it. A block that is left out is removed together with
        its password. Passwords are encrypted at rest and never returned. A save with both blocks
        left out still counts as a stored record (auth then delivers nothing); to return to the
        `auth.conf` blocks, delete the record instead.
      operationId: upsertDeliverySettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverySettingsUpdate'
      responses:
        '204':
          description: Settings stored.
        '400':
          description: |
            A block is not usable, e.g. `smtp.from` is not an email address, `smtp.port` is out
            of range, a value carries a control character, `otpProvider.url` is not an absolute
            HTTP(S) URL or carries credentials (`https://user:secret@host`; use `username` and the
            password field instead), or `otpProvider.method` is not one of `GET`, `POST`, `PUT`,
            `PATCH`; or the body is not a delivery settings update at all. The text names the field
            and the rule, never the value. Nothing is stored then.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Delivery settings]
      summary: Remove the delivery settings
      description: |
        Back to nothing stored, as before the first save: auth reads the `smtp` and
        `otp-provider` blocks of its own `auth.conf` again. Removing nothing is not an error.
      operationId: deleteDeliverySettings
      responses:
        '204':
          description: Settings removed, or there were none.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/edges:
    get:
      tags: [Edges]
      summary: List edges
      operationId: getAllEdges
      responses:
        '200':
          description: Registered edges and whether each still holds an old key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllEdgesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Edges]
      summary: Register an edge
      description: |
        Central generates the key pair, keeps the public half and returns the private half
        once. The edge signs its `/sync` requests with it. The edge joins `groupId` (the
        `default` group when absent) and never leaves it.
      operationId: registerEdge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEdgeRequest'
      responses:
        '201':
          description: Edge registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceKeyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: The group named does not exist.
    delete:
      tags: [Edges]
      summary: Delete an edge
      operationId: deleteEdge
      parameters:
        - $ref: '#/components/parameters/EdgeIdQuery'
      responses:
        '204':
          description: Edge deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/edge-groups:
    get:
      tags: [Edges]
      summary: List edge groups
      operationId: getEdgeGroups
      responses:
        '200':
          description: The groups of edges and the kind of each.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEdgeGroupsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Edges]
      summary: Create a group of edges
      description: |
        A group holds the edges that serve a set of clients together (several edges can serve one
        client, for geo-routing). Its `kind` is the operator's decision and cannot be changed
        afterwards, by anyone: `first_party` groups hold the operator's own edges, which read
        their configuration from central; `partner` groups hold a partner's edges, which are
        issued a certificate that names their group (it is what authenticates the partner's
        clients to auth) and are given no configuration. A `default` first-party group exists
        from the start and holds every edge registered before groups.
      operationId: createEdgeGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdgeGroup'
      responses:
        '201':
          description: Group created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeGroup'
        '400':
          description: The kind is not `first_party` or `partner`, or the id is not a valid identifier.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A group with this id exists; it is left as it was.

  /configuration/edges/extend:
    post:
      tags: [Edges]
      summary: Extend the certificate chain of an edge
      description: |
        An edge whose certificate central issues renews it by itself, over the mutual-TLS listener. Those
        renewals are a chain that began at the edge's enrollment, and `edge-identity.max-age` (a year by default)
        is how old the chain may get. With `edge-identity.auto-extend` on, the default, central extends the chain
        itself at that age and the edge never stops. With it off, central stops renewing the edges of **partner** groups
        (the operator's own edges are always extended) at that age until this is
        called (or the edge is enrolled again with a new token): the edge keeps working on the certificate it has
        and is told the date in every answer, warns in its log from a month before, and the date is in
        `identityChainEndsAt` of `GET /configuration/edges`. Calling this starts the chain over; the partner does
        nothing, the edge's next renewal goes through.
      operationId: extendEdgeIdentity
      parameters:
        - $ref: '#/components/parameters/EdgeIdQuery'
      responses:
        '204':
          description: The chain starts over now.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No edge is registered under that id.

  /configuration/edges/enrollment-tokens:
    post:
      tags: [Edges]
      summary: Create a one-time token for an edge to enrol with
      description: |
        The edge trades the token, once and within an hour (`validityHours` asks for longer, up
        to 24: a bundle handed to someone far away may need it), together with a certificate
        request, for its first certificate (`POST /edge/enroll` on the enrollment listener). Only a
        hash of the token is kept: it is shown here and never again. The certificate is renewed by
        the edge itself over the mutual-TLS listener (see `POST /configuration/edges/extend` for
        how long, and what happens at the end).
      operationId: createEdgeEnrollmentToken
      parameters:
        - $ref: '#/components/parameters/EdgeIdQuery'
        - name: validityHours
          in: query
          required: false
          description: How long the token is good for, in hours; 1 when absent, at most 24.
          schema:
            type: integer
            minimum: 1
            maximum: 24
      responses:
        '201':
          description: Token created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No edge is registered under that id, or the validity asked for is out of range.

  /configuration/edges/dpop:
    put:
      tags: [Edges]
      summary: Set an edge's DPoP nonce requirement
      description: |
        RFC 9449 §9 for the calls this edge proxies. On costs each client one round trip per
        nonce lifetime and breaks any client that does not retry on `use_dpop_nonce`; off is
        not "prefer a nonce" but "never ask for one", since a challenge over a nonce the edge
        does not insist on is one a nonce-less retry walks past (§11.3). The edge picks the
        change up on its next configuration sync.
      operationId: setEdgeDpop
      parameters:
        - $ref: '#/components/parameters/EdgeIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEdgeDpopRequest'
      responses:
        '204':
          description: Setting recorded.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No edge is registered under that id.

  /configuration/edges/policies:
    get:
      tags: [Edges]
      summary: Read the policies of an edge
      description: |
        The three policy sections of one edge as they are stored now (not the console's cached copy): `overload`, `accessLog` and
        `rateLimits`, each absent when none is set, with the `revisions` and `updatedAt` of every section that has ever changed. A section
        that never changed has revision 0.
      operationId: getEdgePolicies
      parameters:
        - $ref: '#/components/parameters/EdgeIdQuery'
      responses:
        '200':
          description: The policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgePolicies'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No edge is registered under that id.
    patch:
      tags: [Edges]
      summary: Change the policies of an edge
      description: |
        Changes the sections the body names and leaves the others as they are. A section that is absent is kept; `null` removes it (the
        edge goes back to the values of its own deployment, or applies no rate limit); an object replaces it **as a whole**: a section is
        never merged field by field, so the body of a section is the section. An empty object (an empty `policies` list for `rateLimits`)
        is the same as `null`. A key that is not a section is refused, so a misspelled section is an error and not a silent no-op.

        - `overload`: what the edge does when it is asked for more than it can do: inbound admission limits, with priorities, held to a limit
          the edge learns inside operator-set bounds, and the limits, timeouts, circuit breaker and retry budget of its outbound calls.
          Every field is optional and means "what the edge starts with" when absent (the edge's `HTTP_ADMISSION_*` and
          `HTTP_CLIENT_GUARD_*` environment when set, the built-in defaults otherwise).
        - `accessLog`: which requests the edge writes a `receive-http` log line for. Every field is optional and means the edge's
          built-in default when absent (`off`, 500 ms, 0.05). `auth` and `central` have no such setting.
        - `rateLimits`: who may send how much through the edge. Start from `GET /configuration/edges/rate-limits/recommended`.

        **Conditional change.** `expectedRevisions` names, per section, the revision the client last read. The patch is applied only if every
        named section is still at that revision; otherwise nothing is written and the answer is `409` with the current state in `current`. A
        section that is not named has no precondition, so a client that only ever patches its own section needs none. A change that changes
        nothing does not move the revision.

        **Dry run.** With `dryRun=true` the body is checked by the rules the edge applies (and the revisions are checked) and the answer is
        the state the patch would make; nothing is written.

        The answer is the new state, with the new revisions. The edge picks a change up on its next configuration sync and, while central is
        unreachable, keeps the last policy it received (the sync runs every configuration refresh interval, 5 minutes by default). A value
        outside its documented range answers `400` with the section and the first problem found.
      operationId: patchEdgePolicies
      parameters:
        - $ref: '#/components/parameters/EdgeIdQuery'
        - name: dryRun
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Check the body and answer the resulting state without writing it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdgePoliciesPatch'
            examples:
              rateLimitsAndRemoveOverload:
                summary: Replace the rate limits, remove the overload policy, leave the access log alone
                value:
                  overload: null
                  rateLimits:
                    replicas: 3
                    policies:
                      - name: per-user
                        by: [subject]
                        limits: [{ limit: 300, windowSeconds: 60 }]
                        burst: 60
                        mode: enforce
                  expectedRevisions: { rateLimits: 4 }
      responses:
        '200':
          description: The new state (or, with `dryRun`, the state the patch would make).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgePolicies'
        '400':
          description: A key that is not a section, a section of the wrong shape, or a section that does not validate. `section` names it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgePoliciesError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No edge is registered under that id.
        '409':
          description: A section named in `expectedRevisions` has changed since it was read. Nothing was written; `current` is the state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgePoliciesError'

  /configuration/edges/rate-limits/recommended:
    get:
      tags: [Edges]
      summary: The recommended starting set of rate limit policies
      description: |
        A starting set that is safe to add to any edge: `per-client`, `per-user`, `per-user-endpoint`, `per-address` and `per-certificate`, all in mode
        `shadow`, so the edge only counts what it would refuse. Read `edge_rate_limit_decisions_total{result="would_limit"}`
        for a while, adjust the limits, then switch a policy to `enforce`. The numbers are generous on purpose and are per
        edge pod. Send the body as `rateLimits` of `PATCH /configuration/edges/policies` (the console's "Add recommended policies" does).
      operationId: getRecommendedRateLimitPolicies
      responses:
        '200':
          description: The recommended policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitPolicies'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/edges/rotate-key:
    post:
      tags: [Edges]
      summary: Rotate an edge key
      description: |
        The previous public key keeps verifying tokens until
        `DELETE /configuration/edges/old-key` retires it, so the edge can be redeployed
        without a gap.
      operationId: rotateEdgeKey
      parameters:
        - $ref: '#/components/parameters/EdgeIdQuery'
      responses:
        '200':
          description: The new key pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceKeyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/edges/old-key:
    delete:
      tags: [Edges]
      summary: Retire an edge's old key
      operationId: deleteOldEdgeKey
      parameters:
        - $ref: '#/components/parameters/EdgeIdQuery'
      responses:
        '204':
          description: Old key removed.
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────────────────── Antifraud lists ───────────────────────────────
  /antifraud/lists:
    get:
      tags: [Antifraud lists]
      summary: List entries
      description: |
        Entries of the lists, newest first. Narrow with `tenantId` (one tenant's) or `global` (the entries that apply to
        every tenant).
      operationId: listAntifraudListEntries
      parameters:
        - name: listType
          in: query
          schema: { $ref: '#/components/schemas/AntifraudListType' }
        - name: valueType
          in: query
          schema: { $ref: '#/components/schemas/AntifraudValueType' }
        - name: tenantId
          in: query
          description: Only this tenant's entries. Excludes `global`.
          schema: { $ref: '#/components/schemas/TenantId' }
        - name: global
          in: query
          description: "`true` for the global entries only. Excludes `tenantId`."
          schema: { type: boolean }
        - name: limit
          in: query
          description: 1 to 500. Defaults to 100.
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - $ref: '#/components/parameters/UserIdQuery'
      responses:
        '200':
          description: The entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AntifraudListEntriesResponse' }
        '400':
          description: A parameter is not valid (including a missing `userId`), or `tenantId` and `global` were both given.
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Antifraud lists]
      summary: Add an entry
      description: |
        Adds an entry, or refreshes the expiry, reason and source of the one for the same list, kind of value, value and
        tenant (the response is then that entry, with its own `id`). This instance of auth applies it at once, the others
        within `antifraud.lists.refresh-interval`. Every change is recorded in the audit.

        An entry with no `tenantId` applies to every tenant. Auth refuses (`400`, with the reason as text) a value that does not fit its kind; an `allow` for anything but an exact subject; an entry that
        names many clients, or whose `source` is not `manual`, without `expiresAt`; an `expiresAt` in the past; and
        an enforcing (not `shadow`) entry that would have matched more than `antifraud.lists.max-traffic-share` of the last
        24 hours of events: add it as `shadow` first.
      operationId: createAntifraudListEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AntifraudListEntryRequest' }
      responses:
        '201':
          description: The entry as stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AntifraudListEntry' }
        '400':
          description: The body is not valid, or auth refused the entry (text body with the reason).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No admin identity, or the admin may not change entries of that tenant.
    delete:
      tags: [Antifraud lists]
      summary: Remove an entry
      operationId: deleteAntifraudListEntry
      description: The entry is named in the body, where edge adds `userId` for a request that is not a `GET`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, format: uuid }
                userId: { $ref: '#/components/schemas/UserId' }
              required: [id, userId]
      responses:
        '204':
          description: Removed and recorded in the audit.
        '400':
          description: "`id` is missing from the body or not a UUID."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: There is no such entry.

  /antifraud/lists/preview:
    post:
      tags: [Antifraud lists]
      summary: Preview what an entry would match
      description: |
        How many of the last 24 hours of events the entry would have matched, with the same validation as adding it and
        nothing stored. `matched` is `null` for a kind of value the event log has no column for (an address, a network,
        an ASN, a device, a JA4 hash, a mail domain): the share guard cannot judge those, so give them an expiry and add
        them as `shadow` first. The count is over every tenant's events, so only an admin who may add the entry may preview it.
      operationId: previewAntifraudListEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AntifraudListEntryRequest' }
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  matched: { type: [integer, 'null'] }
                  total: { type: integer }
                required: [total]
        '400':
          description: The body is not valid, or auth refused the entry.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /antifraud/lists/audit:
    get:
      tags: [Antifraud lists]
      summary: Changes of the lists
      description: Who added, removed or let expire which entry, latest first.
      operationId: listAntifraudListAudit
      parameters:
        - name: entryId
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          description: 1 to 500. Defaults to 100.
          schema: { type: integer, minimum: 1, maximum: 500 }
        - $ref: '#/components/parameters/UserIdQuery'
      responses:
        '200':
          description: The records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AntifraudListAuditResponse' }
        '400':
          description: A parameter is not valid.
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────────────────── Service ───────────────────────────────
  /service/users/outbox/flush:
    post:
      tags: [Service]
      summary: Flush the user outbox
      description: |
        Drains pending user events to auth synchronously instead of waiting for the poll
        interval. Returns `404 Not Found` in production.
      operationId: flushUserOutbox
      responses:
        '200':
          description: Outbox flushed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The deployment runs in production.

  /service/configuration/sync:
    post:
      tags: [Service]
      summary: Force a configuration sync
      description: |
        Asks auth to reload its configuration caches immediately. Returns `404 Not Found` in
        production.
      operationId: forceConfigurationSync
      responses:
        '200':
          description: Sync triggered.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The deployment runs in production.

  /service/users:
    delete:
      tags: [Service]
      summary: Delete a user
      description: |
        Hard-deletes a user and their credentials. Exists for test cleanup and returns
        `404 Not Found` in production.
      operationId: deleteUser
      parameters:
        - name: id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '204':
          description: User deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The deployment runs in production.

components:
  securitySchemes:
    centralBasic:
      type: http
      scheme: basic
      description: |
        HTTP Basic with the username `central` and the base64url-encoded central resource
        secret as the password.

  responses:
    Unauthorized:
      description: The credentials are missing, malformed or not accepted.

  parameters:
    UserIdQuery:
      name: userId
      in: query
      required: true
      description: |
        The admin who asks, set by edge from the verified access token (the antifraud endpoints are registered with an
        inject rule that overwrites what the caller sent); auth records it as who made a change. Requests that are not a
        `GET` carry it as the body field of the same name. A request without it is `400`.
      schema: { $ref: '#/components/schemas/UserId' }
    TenantIdQuery:
      name: tenantId
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/TenantId'
    ClientIdQuery:
      name: clientId
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/ClientId'
    ResourceIdQuery:
      name: resourceId
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    EdgeIdQuery:
      name: edgeId
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/EdgeId'
    OffsetQuery:
      name: offset
      in: query
      description: Number of records to skip. Defaults to `0`.
      schema:
        type: integer
        minimum: 0
        default: 0
    LimitQuery:
      name: limit
      in: query
      description: Maximum number of records to return. Unbounded when omitted.
      schema:
        type: integer
        minimum: 1

  schemas:
    # ───────────────────────── Identifier types ─────────────────────────
    TenantId:
      type: string
      pattern: '^[a-z][a-z0-9-]*$'
      description: Lowercase letters, digits and hyphens, starting with a letter.
      examples: [acme]
    ClientId:
      type: string
      pattern: '^[a-z][a-z0-9-]*$'
      examples: [web-portal]
    ResourceId:
      type: string
      pattern: '^[a-z][a-z0-9-]*$'
      examples: [billing-api]
    RoleId:
      type: string
      pattern: '^[a-z][a-z0-9-]*$'
      examples: [admin]
    EdgeId:
      type: string
      pattern: '^[a-z][a-z0-9-]*$'
      examples: [eu-central]
    ScopeToken:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      examples: [profile]
    Claim:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      examples: [given_name]
    Permission:
      type: string
      pattern: '^[a-z][a-z0-9_-]*(:[a-z][a-z0-9_-]*)*$'
      description: |
        Segments of lowercase letters, digits, underscores and hyphens, each starting with a letter,
        joined by `:`. A `.` is never allowed: a body that carries a permission ID with one, whether
        creating or updating a permission or naming it in a role or a client, is refused with 400.
      examples: ['billing:invoice_read', 'auth-settings:manage']
    AuthorizationDetailType:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      description: The RFC 9396 `type` member of an authorization detail object.
      examples: [payment_initiation]
    ResourceEndpointId:
      type: string
      format: uuid
      description: A UUIDv7 chosen by the caller when the endpoint is created.
    FormId:
      type: string
      examples: [login]
    PresetId:
      type: string
      examples: [default]
    UserId:
      type: string
      format: uuid
      description: A UUIDv7 assigned by central.
    Email:
      type: string
      format: email
    Phone:
      type: string
      pattern: '^\+?\d{9,15}$'
      description: |
        A number that parses and validates as an international phone number. It is stored and
        returned in canonical E.164 (`+` and digits, national trunk prefix dropped), so
        `+787011234567` is accepted and stored as `+77011234567`; lookups canonicalise the input
        the same way.
      examples: ['+77001234567']
    Login:
      type: string
      description: An opaque login handle, when the deployment authenticates by login.
    RedirectUri:
      type: string
      format: uri
      description: |
        An absolute URI with no fragment. A value being registered (a new client, or a
        patch's `add`) must be `https` with a host, or `http` to a loopback address
        (`localhost`, `127.0.0.1`, `[::1]`) for a native app's local listener (FAPI 2.0
        Security Profile §5.3.2.2, RFC 8252 §7.3). Private-use schemes
        (`com.example.app://...`) are refused under the tenant's default `fapi2`
        security profile -- native apps register a claimed `https` redirect (App Links /
        Universal Links) instead; a `standard`-profile tenant may register a
        reverse-domain private-use scheme (RFC 8252 §7.1). A patch's `remove` still accepts
        any value already stored, so a client registered before this rule can be cleaned up.
      examples: ['https://app.example.com/callback']
    ResourceUri:
      type: string
      format: uri
      description: |
        The absolute origin identifying a protected resource — no path, query or fragment.
        The `resource://` scheme is reserved.
      examples: ['https://billing.example.com']
    Secret:
      type: string
      description: A base64url-encoded secret. Returned only at creation or rotation time.
    JsonWebKeySet:
      type: object
      description: |
        RFC 7517 §5 JWK Set document -- the exact document registered, not a narrowed model
        of it, so members this schema does not name still round-trip.

        Every key must be a public key usable with a supported client assertion signing
        algorithm (ES256, PS256, RS256): an EC key on a curve other than P-256, or a key
        whose own `alg` its type cannot perform, is refused at registration rather than
        failing every authentication attempt later.
      properties:
        keys:
          type: array
          items:
            type: object
      required: [keys]
    LocalizedText:
      type: object
      additionalProperties:
        type: string
      description: BCP 47 language tag to text.
      examples:
        - en: Sign in
          ru: Вход
    Message:
      type: object
      properties:
        message:
          type: string
      required: [message]
    Jwk:
      type: object
      additionalProperties: true
      description: An RFC 7517 JSON Web Key. Must contain a `kid` member.
      required: [kid]
      properties:
        kid:
          type: string
    Jwks:
      type: object
      description: An RFC 7517 JSON Web Key Set.
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Jwk'
      required: [keys]

    JwksKeys:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JwkSummary'
      required: [keys]
    JwkSummary:
      type: object
      properties:
        kid:
          type: string
        algorithm:
          type: string
          description: The `alg` the key is published under. Absent when it has no recognised one.
        keyType:
          type: string
          description: The JWK `kty`, when present.
        curve:
          type: string
          description: The JWK `crv`, for an EC key. Absent otherwise.
        canSign:
          type: boolean
          description: Whether central holds the private half, so a tenant can sign with this key.
      required: [kid, canSign]
    GeneratedJwk:
      type: object
      properties:
        kid:
          type: string
        alg:
          type: string
      required: [kid, alg]

    # ───────────────────────────── Patches ─────────────────────────────
    PatchDescription:
      type: object
      description: Translations to add or overwrite, and language tags to drop.
      properties:
        add:
          $ref: '#/components/schemas/LocalizedText'
        delete:
          type: array
          uniqueItems: true
          items:
            type: string
      required: [add, delete]
    PatchPermissions:
      type: object
      properties:
        add:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
        remove:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
      required: [add, remove]
    PatchAudience:
      description: >-
        Change to a resource's audience. Applied to the stored list in order, and idempotent: a
        client already in the audience is not added twice, so concurrent writers adding themselves
        do not drop each other the way submitting a whole list would.
      type: object
      properties:
        add:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ClientId'
        remove:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ClientId'
      required: [add, remove]
    PatchClientRedirectUris:
      type: object
      properties:
        add:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RedirectUri'
        remove:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RedirectUri'
      required: [add, remove]
    PatchClientScope:
      type: object
      properties:
        add:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ScopeToken'
        remove:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ScopeToken'
      required: [add, remove]

    # ───────────────────────────── Tenants ─────────────────────────────
    TenantResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/TenantId'
        description:
          type: string
        edgeId:
          description: |
            The edge this tenant is bound to. Sync is edge-scoped: an edge only receives
            tenants whose `edgeId` matches its own, so `null` means the tenant is not
            assigned to any edge yet and no edge will serve it.
          oneOf:
            - $ref: '#/components/schemas/EdgeId'
            - type: 'null'
        securityProfile:
          allOf:
            - $ref: '#/components/schemas/SecurityProfile'
          description: |
            Read from the tenant's challenge settings, where it is stored (`ChallengeSettingsRecord`);
            a tenant whose settings row is missing reads as `fapi2`, the profile it would be
            created with.
        signingKeyId:
          description: |
            The `kid` of the published JWKS key this tenant's tokens are signed with, also from its
            challenge settings. `null` when the tenant falls back to auth's configured key, which
            is what lets a console answer "which tenants use this key" from the listing alone.
          oneOf:
            - type: string
            - type: 'null'
      required: [id, description, securityProfile]
    GetAllTenantsResponse:
      type: object
      properties:
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantResponse'
      required: [tenants]
    CreateTenantRequest:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/TenantId'
        description:
          type: string
        edgeId:
          oneOf:
            - $ref: '#/components/schemas/EdgeId'
            - type: 'null'
        securityProfile:
          oneOf:
            - $ref: '#/components/schemas/SecurityProfile'
            - type: 'null'
          description: >-
            The profile the tenant's clients are held to; `fapi2` when omitted. Settled here and
            never changed: the challenge-settings endpoint refuses any other value afterwards,
            and so does posting this tenant again with a different one.
      description: >-
        Takes no submission limits: every tenant is seeded with the recommended ones, so
        there is no caller-supplied rate-limit configuration to validate or fall back on.
        They are edited afterwards through the challenge-settings endpoint.
      required: [id, description]
    UpdateTenantRequest:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/TenantId'
        description:
          type: string
        edgeId:
          oneOf:
            - $ref: '#/components/schemas/EdgeId'
            - type: 'null'
      required: [id, description]

    # ───────────────────────── Auth flows ─────────────────────────
    PrimaryCredential:
      type: string
      enum: [email, phone, login]
    OtpType:
      type: string
      enum: [sms, email]
    AuthFactorType:
      type: string
      enum: [otp, password, passkeyEnroll]
    PassedAuthFactor:
      type: string
      enum: [otp, password, passkey]
    AuthFactor:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AuthFactorType'
        required:
          type: boolean
      required: [type, required]
    PrimaryAuthFlow:
      type: object
      properties:
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/PrimaryCredential'
        inlinePassword:
          type: boolean
          description: Whether the password field is shown next to the credential field.
        factors:
          type: array
          items:
            $ref: '#/components/schemas/AuthFactor'
      required: [credentials, inlinePassword, factors]
    PasskeyAuthFlow:
      type: object
      properties:
        factors:
          type: array
          items:
            $ref: '#/components/schemas/AuthFactor'
      required: [factors]
    AuthFlow:
      type: object
      description: How a client's users authenticate.
      properties:
        primary:
          $ref: '#/components/schemas/PrimaryAuthFlow'
        passkey:
          oneOf:
            - $ref: '#/components/schemas/PasskeyAuthFlow'
            - type: 'null'
        equivalents:
          type: object
          description: |
            Factors that satisfy another factor. Keyed by the required factor, valued by the
            set of factors accepted in its place.
          additionalProperties:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/PassedAuthFactor'
        otpType:
          $ref: '#/components/schemas/OtpType'
      required: [primary, equivalents, otpType]
    ConsentFlowDto:
      type: object
      description: Whether and how the consent screen is shown before a grant is issued.
      properties:
        allowPartial:
          type: boolean
          description: |
            Whether the user may deselect optional scopes. `openid` is never deselectable, and
            neither is `offline_access` unless `offlineAccessOptional` is set.
        requiredScopes:
          type: array
          uniqueItems: true
          items:
            type: string
          default: []
          description: |
            Scopes the user cannot deselect when the client requests them, on top of `openid`
            and `offline_access`, which are always required. The consent screen keeps them
            ticked and the authorization server refuses a grant that drops one; the user can
            still deny the whole request. A scope the client did not request is ignored.
            Meaningful only with `allowPartial`: without it the whole requested scope is
            granted or denied.
        offlineAccessOptional:
          type: boolean
          default: false
          description: |
            Lets the user deselect `offline_access` ("long-lived access"). When they do, the
            client receives no refresh token and must be able to sign the user in again. A
            client that lists `offline_access` in `requiredScopes` keeps it required.
            Meaningful only with `allowPartial`.
        rememberDuration:
          description: |
            Seconds a granted consent is reused without re-prompting. `null` remembers it
            until revoked.
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: 'null'
      required: [allowPartial]
    ClientKind:
      type: string
      enum: [web, device, service]
      description: |
        `web`: a site with a backend, where users sign in (`/configuration/clients/web`).
        `device`: an app installed on a device, holding a DPoP key (`/configuration/clients/native`).
        `service`: code calling an API with no user present (`/configuration/clients/service`).
    ClientTemplate:
      type: object
      description: |
        What the registration wizard was told is being built, stored as the client registered it
        rather than derived back out of the settings it applied: once a setting has been
        edited, several combinations fit the client equally well.
      properties:
        kind:
          type: string
          enum: [web, device, service]
          description: |
            `web` keeps a credential of its own, `device` cannot, `service` calls on its own
            behalf with no user to sign in.
      required: [kind]
    OAuthClientResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ClientId'
        clientName:
          $ref: '#/components/schemas/LocalizedText'
        redirectUris:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RedirectUri'
        scope:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ScopeToken'
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
        secretRotation:
          type: boolean
          description: Whether a previous secret is still accepted.
        authMethod:
          $ref: '#/components/schemas/AuthMethod'
        applicationType:
          $ref: '#/components/schemas/ApplicationType'
        accessTokenTtl:
          type: integer
          format: int64
          description: Seconds.
        refreshTokenTtl:
          type: integer
          format: int64
          description: Seconds.
        theme:
          type: string
        authFlow:
          oneOf:
            - $ref: '#/components/schemas/AuthFlow'
            - type: 'null'
        otpTemplateId:
          type: string
        frontChannelLogoutUri:
          type: [string, 'null']
        frontChannelLogoutSessionRequired:
          type: boolean
        backChannelLogoutUri:
          type: [string, 'null']
        logoUri:
          type: [string, 'null']
        policyUri:
          type: [string, 'null']
        tosUri:
          type: [string, 'null']
        consentFlow:
          oneOf:
            - $ref: '#/components/schemas/ConsentFlowDto'
            - type: 'null'
        dpopBoundAccessTokens:
          type: boolean
          description: |
            RFC 9449 §5.2: the client always uses DPoP. A token request from it that carries no
            proof is refused with `invalid_dpop_proof` rather than answered with a bearer token.
        dpopSigningAlgs:
          type: array
          items:
            type: string
            enum: [ES256, PS256, RS256]
          description: |
            RFC 9449 §5.1: the signing algorithms a DPoP proof from this client may use,
            narrowing `dpop_signing_alg_values_supported`. An empty array registers no
            narrowing. Narrowing only ever subtracts - naming an algorithm the metadata
            document does not advertise does not make it acceptable.
        dpopMinRsaKeySize:
          type: [integer, 'null']
          description: |
            The modulus length, in bits, an RSA DPoP proof key from this client must reach.
            `null` leaves the RFC 7518 §3.3 floor of 2048 bits, which applies to every client
            regardless; a value below it is refused at registration.
        jwks:
          oneOf:
            - $ref: '#/components/schemas/JsonWebKeySet'
            - type: 'null'
          description: |
            RFC 7523 §2.2 `private_key_jwt`: the public keys this client signs its client
            assertions with. `null` means the client does not use the method.
        requireSignedRequestObject:
          type: boolean
          description: |
            RFC 9101 §10.5: the client states its authorization request in a request object it
            signed, so a plain parameter set from it is refused with `invalid_request`.
            Needs `jwks` - a request object is verified against no other keys.
        mtlsAuth:
          oneOf:
            - $ref: '#/components/schemas/MutualTlsAuth'
            - type: 'null'
          description: |
            RFC 8705 §2 mutual-TLS client authentication. `null` means the client authenticates
            with something other than a certificate.
        certificateBoundAccessTokens:
          type: boolean
          description: |
            RFC 8705 §3.4: access tokens issued to this client are bound to the certificate it
            presented, and a resource request carrying one over another certificate is refused.
        requirePushedAuthorizationRequests:
          type: boolean
          description: |
            RFC 9126 §6.2: the client pushes its authorization request to `/par` first, so one
            arriving at `/authorize` without a `request_uri` is refused with `invalid_request`.
        template:
          oneOf:
            - $ref: '#/components/schemas/ClientTemplate'
            - type: 'null'
          description: |
            The wizard combination the client was registered from. `null` for a client
            registered without naming one, which is every client registered through this API
            rather than the console.
        kind:
          $ref: '#/components/schemas/ClientKind'
          description: |
            What kind of client this is, and so which of `/configuration/clients/web`, `/native`
            and `/service` its update is sent to. Fixed for the client's life. Read from
            `template` where there is one; otherwise `native` for an `applicationType` of
            `native`, `web` for a client with redirect URIs or a sign-in flow, `service` for the
            rest.
        createdAt:
          type: string
          format: date-time
          description: |
            When the registration was accepted. Set once, by the service that accepted it, and
            never patched - an update states what the client is now, not when it appeared.
        themeOverrides:
          oneOf:
            - $ref: '#/components/schemas/ThemeOverrides'
            - type: 'null'
          description: |
            What this client changes in the theme it uses, laid over it on its sign-in pages.
            `null` (or absent) when it changes nothing.
        est:
          oneOf:
            - $ref: '#/components/schemas/ClientEstState'
            - type: 'null'
          description: |
            Where the client stands when it obtains its certificate through EST (`estEnrollment`);
            `null` (or absent) when it does not.
      required:
