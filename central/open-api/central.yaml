          description: |
            Replaces the limits set for audience clients as a whole: absent leaves them (those of clients removed from the audience in this request are dropped), an empty list removes them all.
      required: [resourceId, audience, deleteEndpoints, createEndpoints]
    CreateResourceResponse:
      type: object
      properties:
        resourceId:
          $ref: '#/components/schemas/ResourceId'
        secret:
          description: Present only for internal resources; non-internal resources are issued no secret.
          oneOf:
            - $ref: '#/components/schemas/Secret'
            - type: 'null'
      required: [resourceId]
    RotateResourceSecretResponse:
      type: object
      properties:
        secret:
          $ref: '#/components/schemas/Secret'
      required: [secret]
    ResourceValidationError:
      type: object
      description: |
        A single-member object naming the rejected case, e.g.
        `{"InvalidAllowExpression": {"endpointId": "...", "expression": "...", "message": "..."}}`.
      minProperties: 1
      maxProperties: 1
      properties:
        InvalidResourceId:
          type: object
        ReservedResourceId:
          type: object
        InvalidAllowExpression:
          type: object
          properties:
            endpointId:
              $ref: '#/components/schemas/ResourceEndpointId'
            expression:
              type: string
            message:
              type: string
          required: [endpointId, expression, message]
        InvalidInjectExpression:
          type: object
          properties:
            endpointId:
              $ref: '#/components/schemas/ResourceEndpointId'
            ruleName:
              type: string
            expression:
              type: string
            message:
              type: string
          required: [endpointId, ruleName, expression, message]
        InvalidStepUpConditionExpression:
          type: object
          properties:
            endpointId:
              $ref: '#/components/schemas/ResourceEndpointId'
            expression:
              type: string
            message:
              type: string
          required: [endpointId, expression, message]
        InvalidEndpointPath:
          type: object
          properties:
            endpointId:
              $ref: '#/components/schemas/ResourceEndpointId'
          required: [endpointId]
        InvalidRateLimit:
          type: object
          description: The endpoint's `rateLimit` breaks a rule of a rate limit policy; `message` names the rule.
          properties:
            endpointId:
              $ref: '#/components/schemas/ResourceEndpointId'
            message:
              type: string
          required: [endpointId, message]
        InvalidAudienceRateLimit:
          type: object
          description: A limit set for an audience client breaks a rule of a rate limit policy, names a client that is not in the audience, or repeats a client.
          properties:
            clientId:
              $ref: '#/components/schemas/ClientId'
            message:
              type: string
          required: [clientId, message]
        AmbiguousEndpointPath:
          type: object
          description: |
            Another endpoint with the same method matches exactly the same requests, differing
            only in its path parameter names.
          properties:
            endpointId:
              $ref: '#/components/schemas/ResourceEndpointId'
            path:
              type: string
          required: [endpointId, path]
    CreateClaim:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Claim'
        description:
          $ref: '#/components/schemas/LocalizedText'
      required: [id, description]
    ClaimResponse:
      type: object
      properties:
        claim:
          $ref: '#/components/schemas/Claim'
        description:
          $ref: '#/components/schemas/LocalizedText'
      required: [claim, description]
    ScopeWithClaimsResponse:
      type: object
      properties:
        scope:
          $ref: '#/components/schemas/ScopeToken'
        description:
          $ref: '#/components/schemas/LocalizedText'
        claims:
          type: array
          items:
            $ref: '#/components/schemas/ClaimResponse'
      required: [scope, description, claims]
    GetAllScopesResponse:
      type: object
      properties:
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopeWithClaimsResponse'
      required: [scopes]
    CreateScopeRequest:
      type: object
      properties:
        tenantId:
          $ref: '#/components/schemas/TenantId'
        id:
          $ref: '#/components/schemas/ScopeToken'
        description:
          $ref: '#/components/schemas/LocalizedText'
        claims:
          type: array
          items:
            $ref: '#/components/schemas/CreateClaim'
      required: [tenantId, id, description, claims]
    PatchClaim:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Claim'
        description:
          $ref: '#/components/schemas/PatchDescription'
      required: [id, description]
    PatchScope:
      type: object
      properties:
        add:
          type: array
          items:
            $ref: '#/components/schemas/CreateClaim'
        update:
          type: array
          items:
            $ref: '#/components/schemas/PatchClaim'
        delete:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Claim'
        description:
          $ref: '#/components/schemas/PatchDescription'
      required: [add, update, delete, description]
    UpdateScopeRequest:
      type: object
      properties:
        tenantId:
          $ref: '#/components/schemas/TenantId'
        id:
          $ref: '#/components/schemas/ScopeToken'
        patch:
          $ref: '#/components/schemas/PatchScope'
      required: [tenantId, id, patch]

    # ──────────────────────────── Permissions ────────────────────────────
    PermissionResponse:
      type: object
      properties:
        permission:
          $ref: '#/components/schemas/Permission'
        description:
          $ref: '#/components/schemas/LocalizedText'
        endpointIds:
          type: array
          uniqueItems: true
          description: Resource endpoints this permission unlocks.
          items:
            $ref: '#/components/schemas/ResourceEndpointId'
      required: [permission, description, endpointIds]
    GetAllPermissionsResponse:
      type: object
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionResponse'
      required: [permissions]
    CreatePermissionRequest:
      type: object
      properties:
        tenantId:
          $ref: '#/components/schemas/TenantId'
        permission:
          $ref: '#/components/schemas/Permission'
        description:
          $ref: '#/components/schemas/LocalizedText'
        endpointIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ResourceEndpointId'
      required: [tenantId, permission, description, endpointIds]
    UpdatePermissionRequest:
      type: object
      properties:
        tenantId:
          $ref: '#/components/schemas/TenantId'
        permission:
          $ref: '#/components/schemas/Permission'
        description:
          $ref: '#/components/schemas/PatchDescription'
        endpointIds:
          type: [array, 'null']
          uniqueItems: true
          description: Replaces the endpoint set when present; leaves it unchanged when absent.
          items:
            $ref: '#/components/schemas/ResourceEndpointId'
      required: [tenantId, permission, description]
    RoleResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/RoleId'
        description:
          $ref: '#/components/schemas/LocalizedText'
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
        active:
          type: boolean
      required: [id, description, permissions, active]
    GetAllRolesResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleResponse'
      required: [roles]
    CreateRoleRequest:
      type: object
      properties:
        tenantId:
          $ref: '#/components/schemas/TenantId'
        id:
          $ref: '#/components/schemas/RoleId'
        description:
          $ref: '#/components/schemas/LocalizedText'
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
        active:
          type: boolean
          default: true
          description: >-
            Whether the role grants anything from the start. An inactive role is listed and can
            be assigned, but `edge` resolves it to no permissions. Omitted means `true`, which
            is what every role was created with before the field existed.
      required: [tenantId, id, description, permissions]
    UpdateRoleRequest:
      type: object
      properties:
        tenantId:
          $ref: '#/components/schemas/TenantId'
        id:
          $ref: '#/components/schemas/RoleId'
        description:
          $ref: '#/components/schemas/PatchDescription'
        permissions:
          $ref: '#/components/schemas/PatchPermissions'
        active:
          type: boolean
          description: Patch semantics like the other members, omitted or `null` leaves the flag as it is.
      required: [tenantId, id, description, permissions]
    AuthorizationDetailTypeResponse:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AuthorizationDetailType'
        description:
          $ref: '#/components/schemas/LocalizedText'
        schema:
          type: object
          additionalProperties: true
          description: JSON Schema the authorization detail object must satisfy.
      required: [type, description, schema]
    GetAllAuthorizationDetailTypesResponse:
      type: object
      properties:
        types:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizationDetailTypeResponse'
      required: [types]
    CreateAuthorizationDetailTypeRequest:
      type: object
      properties:
        tenantId:
          $ref: '#/components/schemas/TenantId'
        type:
          $ref: '#/components/schemas/AuthorizationDetailType'
        description:
          $ref: '#/components/schemas/LocalizedText'
        schema:
          type: object
          additionalProperties: true
      required: [tenantId, type, description, schema]
    UpdateAuthorizationDetailTypeRequest:
      $ref: '#/components/schemas/CreateAuthorizationDetailTypeRequest'
    AuthorizationDetailTypeValidationError:
      type: object
      description: 'Always the single-member form `{"InvalidSchema": {"errors": [...]}}`.'
      properties:
        InvalidSchema:
          type: object
          properties:
            errors:
              type: array
              items:
                type: string
          required: [errors]
      required: [InvalidSchema]

    # ────────────────────────────── Users ──────────────────────────────
    CreateUserRequest:
      type: object
      properties:
        email:
          oneOf:
            - $ref: '#/components/schemas/Email'
            - type: 'null'
        phone:
          oneOf:
            - $ref: '#/components/schemas/Phone'
            - type: 'null'
        login:
          oneOf:
            - $ref: '#/components/schemas/Login'
            - type: 'null'
    CreateUserResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserId'
      required: [id]
    PatchUserRequest:
      type: object
      description: 'Merge-patch semantics: absent leaves unchanged, `null` clears, a value sets.'
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        email:
          oneOf:
            - $ref: '#/components/schemas/Email'
            - type: 'null'
        phone:
          oneOf:
            - $ref: '#/components/schemas/Phone'
            - type: 'null'
        login:
          oneOf:
            - $ref: '#/components/schemas/Login'
            - type: 'null'
      required: [id]
    PatchUserClaimsRequest:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        claims:
          type: object
          additionalProperties: true
      required: [id, claims]
    UpdateUserRolesRequest:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        tenantId:
          $ref: '#/components/schemas/TenantId'
        add:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RoleId'
        remove:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RoleId'
      required: [userId, tenantId, add, remove]
    ResetUserLimitsRequest:
      type: object
      description: |
        Counters are keyed by credential as well as by user, so pass the `email` or `phone`
        whose limits should be cleared.
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        tenantId:
          $ref: '#/components/schemas/TenantId'
        email:
          oneOf:
            - $ref: '#/components/schemas/Email'
            - type: 'null'
        phone:
          oneOf:
            - $ref: '#/components/schemas/Phone'
            - type: 'null'
      required: [userId, tenantId]
    UserSearchRecord:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UserId'
        email:
          oneOf:
            - $ref: '#/components/schemas/Email'
            - type: 'null'
        phone:
          oneOf:
            - $ref: '#/components/schemas/Phone'
            - type: 'null'
        login:
          oneOf:
            - $ref: '#/components/schemas/Login'
            - type: 'null'
        claims:
          type: object
          additionalProperties: true
      required: [id, claims]
    UserSearchResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserSearchRecord'
      required: [users]
    UserRolesResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleId'
      required: [roles]
    PasskeyInfo:
      type: object
      properties:
        id:
          type: string
          description: The WebAuthn credential id.
        name:
          type: [string, 'null']
        deviceType:
          type: string
        transports:
          type: array
          items:
            type: string
        backedUp:
          type: boolean
        backupEligible:
          type: boolean
        lastUsedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, deviceType, transports, backedUp, backupEligible, createdAt]
    ListPasskeysResponse:
      type: object
      properties:
        passkeys:
          type: array
          items:
            $ref: '#/components/schemas/PasskeyInfo'
      required: [passkeys]
    RenamePasskeyRequest:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        credentialId:
          type: string
        name:
          type: [string, 'null']
      required: [userId, credentialId]
    DeliveryChannel:
      type: string
      enum: [email, sms, show]
      description: '`show` returns the plaintext to the caller and is rejected in production.'
    ResetPasswordRequest:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        expiresInSeconds:
          type: integer
          format: int64
        channel:
          description: |
            When omitted, no password is delivered and none is returned, but the temporary
            password is still created and takes priority over the user's current password
            at login until it expires.
          oneOf:
            - $ref: '#/components/schemas/DeliveryChannel'
            - type: 'null'
      required: [userId, expiresInSeconds]
    ResetPasswordResponse:
      type: object
      properties:
        password:
          type: string
      required: [password]
    SetPasswordRequest:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        password:
          type: string
      required: [userId, password]
    ClientSessionEntry:
      type: object
      properties:
        clientId:
          $ref: '#/components/schemas/ClientId'
        enteredAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Derived from the client's access token TTL.
      required: [clientId, enteredAt, expiresAt]
    SessionResponse:
      type: object
      properties:
        publicId:
          type: string
        clients:
          type: array
          items:
            $ref: '#/components/schemas/ClientSessionEntry'
        platform:
          type: [string, 'null']
        os:
          type: [string, 'null']
        browser:
          type: [string, 'null']
        version:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When the session ends regardless of activity.
        idleExpiresAt:
          type: string
          format: date-time
          description: |
            When the session ends if it stays idle, pushed forward by activity. Absent when no idle
            timeout applies to the session.
        userAgent:
          $ref: '#/components/schemas/UserAgentResponse'
          description: The user agent the session runs under. Absent only if its row has expired and been swept.
      required: [publicId, clients, createdAt, expiresAt]
    UserAgentResponse:
      type: object
      description: A user agent (browser or app install) as auth stores it.
      properties:
        id:
          type: string
          format: uuid
        userAgent:
          type: string
          description: The raw `User-Agent` header as last seen on sign-in. Absent when none was sent.
        platform:
          type: string
          enum: [ios, android, desktop]
          description: Parsed from the header; absent when it matched none.
        os:
          type: string
        browser:
          type: string
        version:
          type: string
          description: The browser's major version.
        createdAt:
          type: string
          format: date-time
          description: When auth first saw this user agent.
        expiresAt:
          type: string
          format: date-time
          description: The device is remembered until then; it slides forward on every sign-in.
      required: [id, createdAt, expiresAt]
    DeviceResponse:
      type: object
      properties:
        userAgent:
          $ref: '#/components/schemas/UserAgentResponse'
          description: Absent only for a live session whose user agent row has expired and been swept.
        session:
          oneOf:
            - $ref: '#/components/schemas/SessionResponse'
            - type: 'null'
          description: The live session under this user agent; `null` once signed out.
        endedSessionIds:
          type: array
          items:
            type: string
          description: |
            Public ids of this user agent's sessions that ended and are still stored. Empty while
            signed in. A refresh token's `sessionId` matches one of these when it was issued on this
            device.
      required: [session, endedSessionIds]
    RefreshTokenResponse:
      type: object
      properties:
        sessionId:
          type: string
          description: |
            The session this token was issued under. May no longer resolve to a live session:
            a refresh token's expiry is fixed at issuance and independent of a session's,
            so a token routinely outlives it.
        clientId:
          $ref: '#/components/schemas/ClientId'
        scope:
          type: array
          items:
            type: string
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        dpopBound:
          type: boolean
          description: |
            RFC 9449: true once this grant is bound to a DPoP key and can no longer be
            refreshed by anyone else who obtains a copy of it.
      required: [sessionId, clientId, scope, issuedAt, expiresAt, dpopBound]

    # ──────────────────────────── Challenges ────────────────────────────
    OtpTemplatePurpose:
      type: string
      enum: [otp, password]
    OtpTemplateChannel:
      type: string
      enum: [sms, email]
    OtpTemplateRecord:
      type: object
      properties:
        id:
          type: string
        tenantId:
          $ref: '#/components/schemas/TenantId'
        localizations:
          $ref: '#/components/schemas/LocalizedText'
        purpose:
          $ref: '#/components/schemas/OtpTemplatePurpose'
        channel:
          $ref: '#/components/schemas/OtpTemplateChannel'
      required: [id, tenantId, localizations, purpose, channel]
    GetOtpTemplatesResponse:
      type: object
      properties:
        templates:
          type: array
          items:
            $ref: '#/components/schemas/OtpTemplateRecord'
      required: [templates]
    UpsertOtpTemplateRequest:
      $ref: '#/components/schemas/OtpTemplateRecord'
    DeleteOtpTemplateRequest:
      type: object
      properties:
        id:
          type: string
        tenantId:
          $ref: '#/components/schemas/TenantId'
        purpose:
          $ref: '#/components/schemas/OtpTemplatePurpose'
        channel:
          $ref: '#/components/schemas/OtpTemplateChannel'
      required: [id, tenantId, purpose, channel]
    RateLimit:
      type: object
      properties:
        maxAttempts:
          type: integer
        windowSeconds:
          type: integer
      required: [maxAttempts, windowSeconds]
    SubmissionLimits:
      type: object
      description: Sliding-window limits per action, and how long a breach bans the credential.
      properties:
        otpRequest:
          type: array
          items:
            $ref: '#/components/schemas/RateLimit'
        otpSubmit:
          type: array
          items:
            $ref: '#/components/schemas/RateLimit'
        passwordSubmit:
          type: array
          items:
            $ref: '#/components/schemas/RateLimit'
        passkeyAssertion:
          type: array
          items:
            $ref: '#/components/schemas/RateLimit'
        banDurationSeconds:
          type: integer
      required:
        - otpRequest
        - otpSubmit
        - passwordSubmit
        - passkeyAssertion
        - banDurationSeconds
    PhoneRegion:
      type: object
      description: |
        One country a tenant's phone sign-in accepts. Several regions may share a `dialCode` (`KZ` and `RU`
        both use `+7`); a number is accepted when it fits the `length` and `regex` of at least one of them.
      properties:
        region:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2 code. Unique within the list.
        dialCode:
          type: string
          pattern: '^\+[1-9][0-9]{0,3}$'
        length:
          type: integer
          minimum: 4
          maximum: 14
          description: Number of digits after the dial code. `dialCode` plus `length` digits is at most 15 (E.164).
        regex:
          type: string
          description: Java regular expression the digits after the dial code must match in full.
        registration:
          type: boolean
          description: |
            Whether a number of this region may create an account on its own. Self-registration by phone is
            decided by the country, not by the client: a client that signs in by phone registers a new user
            only when the number's region says `true`. A tenant that lists no regions registers no phone number.
            Email is decided the same way for the whole tenant by `emailRegistration`.
      required: [region, dialCode, length, regex, registration]
    EmailRegistrationMode:
      type: string
      enum: [closed, open, allowlist]
      description: |
        Who may create an account with an email address.
        - `closed`: nobody. Existing accounts still sign in with their email.
        - `open`: any domain, except the ones listed in `domains`.
        - `allowlist`: only the domains listed in `domains`.
    EmailRegistration:
      type: object
      description: |
        Whether an email address may create an account, decided by the tenant for every client that
        signs in by email. The same rules apply when an existing user changes their address. The user
        always proves ownership of the address with a one-time code before the account is created.
      properties:
        mode:
          $ref: '#/components/schemas/EmailRegistrationMode'
        domains:
          type: array
          maxItems: 500
          items:
            type: string
          description: |
            A blocklist in `open` mode and an allowlist in `allowlist` mode; stored but ignored when
            `closed`. An entry is a domain (`example.com`, which matches that domain only) or
            `*.example.com`, which matches its subdomains and not `example.com` itself. Entries are
            lower-cased and internationalized labels converted to punycode when stored; an entry that
            is not a domain, or that appears twice, is refused with `400`.
        blockSubaddress:
          type: boolean
          description: Refuse a local part containing `+`, `=` or `#` (`user+tag@example.com`).
      required: [mode, domains, blockSubaddress]
    PhoneRegions:
      type: array
      description: |
        Phone regions the login form offers, in the order the form lists them. Empty means any number in
        E.164 is accepted and the form shows a single free-form field. When every region shares one
        `dialCode` the form locks it; otherwise it offers a selector of the distinct dial codes.
      items:
        $ref: '#/components/schemas/PhoneRegion'
    PasskeySettings:
      type: object
      properties:
        rpId:
          type: string
          description: The WebAuthn relying party id.
        rpName:
          type: string
        origins:
          type: array
          items:
            type: string
        userVerification:
          type: string
          description: 'The WebAuthn user verification requirement, e.g. `preferred`.'
      required: [rpId, rpName, origins, userVerification]
    ChallengeSettingsRecord:
      type: object
      properties:
        tenantId:
          $ref: '#/components/schemas/TenantId'
        phoneRegions:
          $ref: '#/components/schemas/PhoneRegions'
        emailRegistration:
          $ref: '#/components/schemas/EmailRegistration'
        defaultRoles:
          type: array
          uniqueItems: true
          minItems: 1
          description: |
            Roles granted to every self-registered account, whichever credential it registers with. At
            least one. While any credential can register (an email mode other than `closed`, or a phone
            region with `registration: true`) every role must exist in the tenant, or the request is
            refused with `400`.
          items:
            $ref: '#/components/schemas/RoleId'
        submissionLimits:
          $ref: '#/components/schemas/SubmissionLimits'
        otpLength:
          type: integer
        otpResendAfter:
          type: integer
          description: Seconds before a new code can be requested.
        passkeySettings:
          $ref: '#/components/schemas/PasskeySettings'
        authConversationTtlSeconds:
          type: integer
        sessionTtlSeconds:
          type: integer
        sessionIdleTtlSeconds:
          type: [integer, 'null']
        userAgentTtlSeconds:
          type: integer
        ipHeader:
          type: string
          description: Header edge reads the client IP from.
        acrVocabulary:
          type: [object, 'null']
          description: '`acr` value to the authentication methods that satisfy it.'
          additionalProperties:
            type: array
            items:
              type: string
        postLogoutRedirectUris:
          type: array
          items:
            type: string
        requireDpopNonce:
          type: boolean
          description: >-
            RFC 9449 §8. When true, a DPoP proof presented at auth's token or userinfo
            endpoint by one of this tenant's clients must carry a server-issued nonce; a
            request without one is answered with `use_dpop_nonce` and a fresh nonce to retry
            over. Costs each client an extra round trip and breaks any client that does not
            implement the retry, so it is off for every tenant until switched on.
        mtlsCertificateHeader:
          type: [string, 'null']
          description: >-
            Header this tenant's reverse proxy sets with the client certificate it terminated
            mTLS for. Null means the proxy does not terminate mTLS for this tenant.
        mtlsCertificateEncoding:
          $ref: '#/components/schemas/MtlsCertificateEncoding'
        signingKeyId:
          type: [string, 'null']
          description: >-
            The `kid` of the published JWKS key this tenant's tokens are signed with. Null
            falls back to auth matching its configured private key against the synced JWKS,
            which is all a deployment whose keys are verify-only can do.
        clientAssertionMaxLifetimeSeconds:
          type: integer
          description: >-
            RFC 7523 §3: how far into the future a `private_key_jwt` client assertion from one
            of this tenant's clients may set its `exp`. A `jti` is remembered against replay
            for as long as the assertion bearing it is acceptable, so this also sizes that
            retention. Between 30 and 900 seconds.
        securityProfile:
          $ref: '#/components/schemas/SecurityProfile'
        logoLight:
          type: [string, 'null']
          description: >-
            Absolute HTTP(S) URL of the tenant's logo for the light colour scheme (dark
            artwork), shown bare above its sign-in card. Set together with `logoDark` or not at
            all. When neither is set the forms show the Versola wordmark.
        logoDark:
          type: [string, 'null']
          description: The same for the dark colour scheme (light artwork). See `logoLight`.
      required:
        - tenantId
        - phoneRegions
        - emailRegistration
        - defaultRoles
        - submissionLimits
        - otpLength
        - otpResendAfter
        - passkeySettings
        - authConversationTtlSeconds
        - sessionTtlSeconds
        - userAgentTtlSeconds
        - ipHeader
        - postLogoutRedirectUris
        - requireDpopNonce
        - clientAssertionMaxLifetimeSeconds
    MtlsCertificateEncoding:
      type: [string, 'null']
      description: How the certificate in mtlsCertificateHeader is encoded. Null iff mtlsCertificateHeader is null.
      enum: [urlEncodedPem, base64Der, null]
    GetChallengeSettingsResponse:
      type: object
      properties:
        settings:
          oneOf:
            - $ref: '#/components/schemas/ChallengeSettingsRecord'
            - type: 'null'
    UpsertChallengeSettingsRequest:
      type: object
      properties:
        tenantId:
          $ref: '#/components/schemas/TenantId'
        phoneRegions:
          $ref: '#/components/schemas/PhoneRegions'
        emailRegistration:
          $ref: '#/components/schemas/EmailRegistration'
        defaultRoles:
          type: array
          uniqueItems: true
          minItems: 1
          description: |
            Roles granted to every self-registered account, whichever credential it registers with. At
            least one. While any credential can register (an email mode other than `closed`, or a phone
            region with `registration: true`) every role must exist in the tenant, or the request is
            refused with `400`.
          items:
            $ref: '#/components/schemas/RoleId'
        submissionLimits:
          $ref: '#/components/schemas/SubmissionLimits'
        otpLength:
          type: integer
        otpResendAfter:
          type: integer
        passkeySettings:
          $ref: '#/components/schemas/PasskeySettings'
        authConversationTtlSeconds:
          type: [integer, 'null']
          description: Keeps the stored value when omitted; defaults to 900 for a new tenant.
        sessionTtlSeconds:
          type: [integer, 'null']
          description: Keeps the stored value when omitted; defaults to 86400 for a new tenant.
        sessionIdleTtlSeconds:
          type: [integer, 'null']
        userAgentTtlSeconds:
          type: [integer, 'null']
          description: Keeps the stored value when omitted; defaults to 15552000 for a new tenant.
        ipHeader:
          type: string
        acrVocabulary:
          type: [object, 'null']
          additionalProperties:
            type: array
            items:
              type: string
        postLogoutRedirectUris:
          type: [array, 'null']
          items:
            type: string
        requireDpopNonce:
          type: [boolean, 'null']
          description: Keeps the stored value when omitted; defaults to false for a new tenant.
        securityProfile:
          oneOf:
            - $ref: '#/components/schemas/SecurityProfile'
            - type: 'null'
          description: >-
            Fixed when the tenant is created. Omitted, or naming the stored profile, it leaves
            the profile as it is; naming any other is refused with `400`.
        mtlsCertificateHeader:
          type: [string, 'null']
          description: >-
            Keeps the stored value when omitted; null clears it, which is how a tenant's
            mutual TLS is turned off. Sent together with mtlsCertificateEncoding -- a header
            with no encoding cannot be parsed, and an encoding with no header names nothing.
        mtlsCertificateEncoding:
          $ref: '#/components/schemas/MtlsCertificateEncoding'
        signingKeyId:
          type: [string, 'null']
          description: >-
            Keeps the stored selection when omitted; null clears it, falling back to auth's
            configured private key. Refused unless central holds a private key for that kid,
            and refused for an RS256 key when the tenant is on the `fapi2` profile -- a
            `standard` tenant may sign under RS256, which OpenID Connect Core requires every OP
            to support.
        clientAssertionMaxLifetimeSeconds:
          type: [integer, 'null']
          description: >-
            Keeps the stored value when omitted; defaults to 300 for a new tenant. Refused
            outside 30..900 -- below that ordinary clock skew starts rejecting honestly minted
            assertions, above it auth could no longer remember a `jti` for the whole life of
            the assertion carrying it.
        logoLight:
          type: [string, 'null']
          description: >-
            Keeps the stored value when omitted; null clears it. An absolute HTTP(S) URL of the
            logo for the light colour scheme (dark artwork). After both are applied `logoLight`
            and `logoDark` must be set or cleared together, otherwise the request is refused
            with 400: one file reused for both schemes would vanish on one of them. An SVG must
            have its text converted to outlines, as fonts are not loaded inside an image.
        logoDark:
          type: [string, 'null']
          description: The same for the dark colour scheme (light artwork). See `logoLight`.
      required:
        - tenantId
        - phoneRegions
        - emailRegistration
        - defaultRoles
        - submissionLimits
        - otpLength
        - otpResendAfter
        - passkeySettings
        - ipHeader

    PatchChallengeSettingsRequest:
      type: object
      description: >-
        A JSON merge patch (RFC 7396) of the record `PUT` writes, at the level of its members:
        absent keeps the stored value, a value replaces it whole, `null` clears an optional member.
        Members that are not listed here are refused. Types are those of
        `UpsertChallengeSettingsRequest`, except that none of the members but `tenantId` is
        required and only the ones marked nullable accept `null`.
      additionalProperties: false
      properties:
        tenantId:
          $ref: '#/components/schemas/TenantId'
        phoneRegions:
          $ref: '#/components/schemas/PhoneRegions'
        emailRegistration:
          $ref: '#/components/schemas/EmailRegistration'
        defaultRoles:
          type: array
          uniqueItems: true
          minItems: 1
          items:
            $ref: '#/components/schemas/RoleId'
        submissionLimits:
          $ref: '#/components/schemas/SubmissionLimits'
        otpLength:
          type: integer
        otpResendAfter:
          type: integer
        passkeySettings:
          $ref: '#/components/schemas/PasskeySettings'
        authConversationTtlSeconds:
          type: integer
        sessionTtlSeconds:
          type: integer
        sessionIdleTtlSeconds:
          type: [integer, 'null']
          description: Null clears the idle timeout.
        userAgentTtlSeconds:
          type: integer
        ipHeader:
          type: string
        acrVocabulary:
          type: [object, 'null']
          description: Replaced whole; null clears the vocabulary.
          additionalProperties:
            type: array
            items:
              type: string
        postLogoutRedirectUris:
          type: array
          items:
            type: string
        requireDpopNonce:
          type: boolean
        mtlsCertificateHeader:
          type: [string, 'null']
          description: >-
            Null clears it. After the patch it and mtlsCertificateEncoding must both be set or both
            be absent.
        mtlsCertificateEncoding:
          oneOf:
            - $ref: '#/components/schemas/MtlsCertificateEncoding'
            - type: 'null'
        signingKeyId:
          type: [string, 'null']
          description: >-
            Null clears the selection, falling back to auth's configured private key. Validated as
            in `UpsertChallengeSettingsRequest`.
        clientAssertionMaxLifetimeSeconds:
          type: integer
          description: Refused outside 30..900.
        securityProfile:
          $ref: '#/components/schemas/SecurityProfile'
          description: >-
            Fixed when the tenant is created: naming the stored profile changes nothing, any other
            is refused with `400`.
        logoLight:
          type: [string, 'null']
          description: >-
            Null clears it. After the patch `logoLight` and `logoDark` must both be set or both be
            absent.
        logoDark:
          type: [string, 'null']
          description: The same for the dark colour scheme.
      required:
        - tenantId

    # ────────────────────────────── Forms ──────────────────────────────
    BackendProperty:
      type: object
      description: A form setting the login UI exposes to the deployment.
      discriminator:
        propertyName: type
      oneOf:
        - $ref: '#/components/schemas/BooleanProperty'
        - $ref: '#/components/schemas/StringArrayProperty'
        - $ref: '#/components/schemas/NumberProperty'
    BooleanProperty:
      type: object
      title: BooleanProperty
      properties:
        type:
          type: string
          const: BooleanProperty
        name:
          type: string
      required: [type, name]
    StringArrayProperty:
      type: object
      title: StringArrayProperty
      properties:
        type:
          type: string
          const: StringArrayProperty
        name:
          type: string
        allowedValues:
          type: array
          items:
            type: string
      required: [type, name, allowedValues]
    NumberProperty:
      type: object
      title: NumberProperty
      properties:
        type:
          type: string
          const: NumberProperty
        name:
          type: string
        default:
          type: integer
        min:
          type: [integer, 'null']
        max:
          type: [integer, 'null']
      required: [type, name, default]
    FormRecord:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/FormId'
        version:
          type: integer
        active:
          type: boolean
        style:
          type: string
          description: The form's CSS.
        jsSource:
          type: [string, 'null']
          description: TypeScript source, kept so the console can edit the form.
        jsCompiled:
          type: [string, 'null']
          description: The JavaScript auth actually serves.
        localizations:
          type: object
          description: Language tag to message key to text.
          additionalProperties:
            $ref: '#/components/schemas/LocalizedText'
        properties:
          type: array
          items:
            $ref: '#/components/schemas/BackendProperty'
      required: [id, version, active, style, localizations, properties]
    GetAllFormsResponse:
      type: object
      properties:
        forms:
          type: array
          items:
            $ref: '#/components/schemas/FormRecord'
      required: [forms]
    GetFormPreviewsResponse:
      type: object
      properties:
        previews:
          type: array
          items:
            $ref: '#/components/schemas/FormPreview'
      required: [previews]
    FormPreview:
      type: object
      properties:
        formId:
          type: string
          description: The id of a built-in form, for example `consent`.
        scenarios:
          type: array
          items:
            $ref: '#/components/schemas/PreviewScenario'
      required: [formId, scenarios]
    PreviewScenario:
      type: object
      properties:
        id:
          type: string
          description: Unique within the form.
        title:
          type: object
          additionalProperties:
            type: string
          description: A short name for the state, by language code (`en`, `ru`).
        step:
          type: object
          additionalProperties: true
          description: |
            The `step` the form receives, shaped like the step `auth` serialises for that form (its `type` is the
            form id).
        error:
          type: string
          description: The error key shown above the form in this state, when there is one.
      required: [id, title, step]
    UpdateFormRequest:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/FormId'
        style:
          type: string
        jsSource:
          type: [string, 'null']
        jsCompiled:
          type: [string, 'null']
        localizations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LocalizedText'
        properties:
          type: array
          items:
            $ref: '#/components/schemas/BackendProperty'
      required: [id, style, localizations, properties]
    SetActiveVersionRequest:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/FormId'
        version:
          type: integer
      required: [id, version]

    # ───────────────────────────── Locales ─────────────────────────────
    LocaleRecord:
      type: object
      properties:
        code:
          type: string
          description: A BCP 47 language tag.
        name:
          type: string
          description: The locale's name in its own language.
        isDefault:
          type: boolean
        active:
          type: boolean
      required: [code, name, isDefault, active]
    GetLocalesResponse:
      type: object
      properties:
        locales:
          type: array
          items:
            $ref: '#/components/schemas/LocaleRecord'
      required: [locales]
    UpdateLocalesRequest:
      type: object
      properties:
        add:
          type: array
          items:
            $ref: '#/components/schemas/LocaleRecord'
        delete:
          type: array
          items:
            type: string
      required: [add, delete]
    SetDefaultLocaleRequest:
      type: object
      properties:
        code:
          type: string
      required: [code]
    LocaleActivationError:
      type: object
      properties:
        locale:
          type: string
        missing:
          type: array
          description: Keys that have no content in this locale.
          items:
            type: string
      required: [locale, missing]
    ThemeRecord:
      type: object
      properties:
        id:
          type: string
        css:
          type: string
        tenantId:
          description: '`null` for a global theme.'
          oneOf:
            - $ref: '#/components/schemas/TenantId'
            - type: 'null'
        tokens:
          $ref: '#/components/schemas/ThemeTokens'
      required: [id, css]
      description: |
        A theme is a built-in base theme with overrides (`tokens`) and optional custom CSS (`css`, may be empty).
        `auth` lays the current default stylesheet, then the CSS generated from the tokens, then `css`, so a custom rule
        wins over the generated value it targets. A theme stored before tokens existed has `css` and no `tokens`: its
        `css` is then the whole stylesheet, until the theme is saved with tokens.
    ThemeTokens:
      type: object
      description: A built-in base theme, the values a theme sets over it and the forms' CSS variables it sets one by one.
      properties:
        base:
          type: string
          description: The id of a built-in theme, from `GET /configuration/themes/presets`.
        overrides:
          $ref: '#/components/schemas/ThemeOverrides'
        variables:
          type: object
          description: |
            Token overrides: CSS variables of the forms' theming API, each with its value. Written as one `:root` block
            after the CSS the five values generate and before the theme's `css`, so the order is base theme, five values,
            token overrides, custom CSS, and a later one wins over an earlier one that sets the same variable. Absent
            means none. Only the names listed by `GET /configuration/themes/variables` are accepted. A value is a string
            of the token's kind (a colour, a length, a shadow, a weight or a font list) of at most 120 characters, made of
            letters, digits and `# % . , ( ) - + _ /` and spaces, balanced in parentheses, without `;`, `{`, `}`, `!`, `@`,
            `\`, a comment, `url(` or `expression(`. A token that is a pair (`pair: true` in the list) also takes
            `{ "light": "...", "dark": "..." }`, written as `light-dark(light, dark)`; any other token refuses it. An unknown
            name or a refused value answers 400 with the reason and stores nothing.
          additionalProperties:
            $ref: '#/components/schemas/ThemeVariableValue'
      required: [base]
    ThemeOverrides:
      type: object
      description: Each value that is absent is the base theme's.
      properties:
        brand:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          description: The accent colour, as `#rrggbb`. Nothing else is accepted, because it is written into a stylesheet.
        shape:
          type: string
          enum: [round, soft, sharp]
          description: How round the corners of fields, buttons and the card are.
        surface:
          type: string
          enum: [bold, soft, neutral]
          description: What fills the page behind the card.
        mode:
          type: string
          enum: [auto, light, dark]
          description: The colour scheme; `auto` follows the visitor's device.
        background:
          type: string
          enum: [glow, linear, horizon, flat]
          description: >-
            What is drawn over the page colour behind the card. `glow` is the brand glowing from behind the card (dark
            scheme only; the look before this token existed), `linear` a soft diagonal wash, `horizon` a light rising from
            the bottom edge, `flat` the plain page colour. Single-hue: each is a tint of the brand. The strength of the
            tint follows the surface and the scheme and keeps the text above the card readable.
    ThemePreset:
      type: object
      properties:
        id:
          type: string
        title:
          type: object
          additionalProperties:
            type: string
        tokens:
          $ref: '#/components/schemas/ResolvedThemeTokens'
      required: [id, title, tokens]
    ResolvedThemeTokens:
      type: object
      description: Every token, with its value.
      properties:
        brand:
          type: string
        shape:
          type: string
          enum: [round, soft, sharp]
        surface:
          type: string
          enum: [bold, soft, neutral]
        mode:
          type: string
          enum: [auto, light, dark]
        background:
          type: string
          enum: [glow, linear, horizon, flat]
      required: [brand, shape, surface, mode, background]
    ThemeVariableValue:
      description: One value for both colour schemes, or, for a token that is a pair, one value per scheme.
      oneOf:
        - type: string
          maxLength: 120
          example: '#d9480f'
        - type: object
          properties:
            light:
              type: string
              maxLength: 120
            dark:
              type: string
              maxLength: 120
          required: [light, dark]
          additionalProperties: false
          example: { light: '#d9480f', dark: '#ff922b' }
    ThemeVariableGroup:
      type: object
      properties:
        id:
          type: string
        title:
          type: object
          description: The group's name by language (`en`, `ru`).
          additionalProperties:
            type: string
      required: [id, title]
    ThemeVariable:
      type: object
      properties:
        name:
          type: string
          example: '--btn'
        group:
          type: string
          description: The `id` of the group the token is listed in.
        kind:
          type: string
          enum: [colour, length, shadow, weight, font]
          description: |
            What a value is, which decides the rule it must pass. `colour`: hex, a colour name, or a colour function
            (`rgb()`, `hsl()`, `oklch()`, `color-mix()`, `var(--name)`). `length`: a non-negative number with `px`, `rem`, `em`,
            `vw`, `vh` or `%`, or `0`. `shadow`: `none` or one to four `[inset] x y [blur [spread]] colour` layers. `weight`: a
            whole number from 100 to 900. `font`: a comma-separated list of font names, without quotes.
        pair:
          type: boolean
          description: Whether the token takes `{ light, dark }` as well as one value. Only colours can.
        description:
          type: object
          description: One line saying what the token paints, by language (`en`, `ru`).
          additionalProperties:
            type: string
        default:
          type: string
          description: What `forms/common.css` declares for it, as written there.
        start:
          $ref: '#/components/schemas/ThemeVariableValue'
      required: [name, group, kind, pair, description, default, start]
    GetThemeVariablesResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ThemeVariableGroup'
        variables:
          type: array
          items:
            $ref: '#/components/schemas/ThemeVariable'
          description: In the order they are written and listed.
      required: [groups, variables]
    GetThemePresetsResponse:
      type: object
      properties:
        presets:
          type: array
          items:
            $ref: '#/components/schemas/ThemePreset'
      required: [presets]
    RenderThemeRequest:
      type: object
      description: |
        What to render: a theme with tokens (`tokens` present: the foundation stylesheet, what the tokens set, then `css`) or a
        theme stored with CSS only (`tokens` absent: `css` alone is the stylesheet, as it replaces the foundation; with no `css` either,
        the foundation). `overrides` are a client's own, laid after all of that exactly as the authorization server does for
        that client, so the result is the client's effective stylesheet.
      properties:
        tokens:
          $ref: '#/components/schemas/ThemeTokens'
        css:
          type: string
          description: >-
            The theme's custom CSS, laid after the generated one (with no `tokens` it is the whole stylesheet); absent means none.
        overrides:
          $ref: '#/components/schemas/ThemeOverrides'
    RenderThemeResponse:
      type: object
      properties:
        css:
          type: string
          description: The whole stylesheet - the current default, what the tokens set, the theme's own CSS, then the client's overrides.
        generated:
          type: string
          description: Only what the theme's tokens set; empty for a theme stored with CSS only (the client's overrides are in `css` only).
      required: [css, generated]
    GetAllThemesResponse:
      type: object
      properties:
        themes:
          type: array
          items:
            $ref: '#/components/schemas/ThemeRecord'
      required: [themes]
    CreateThemeRequest:
      $ref: '#/components/schemas/ThemeRecord'
    UpdateThemeRequest:
      type: object
      properties:
        id:
          type: string
        css:
          type: string
        tokens:
          $ref: '#/components/schemas/ThemeTokens'
      required: [id, css]

    # ─────────────────────────── System settings ───────────────────────────
    SystemSettingsRecord:
      type: object
      description: |
        Global settings. The password policy lives here because password credentials are
        stored per user, not per tenant.
      properties:
        passwordRegex:
          type: string
          description: A password must match this regular expression.
        passwordHistorySize:
          type: integer
          description: How many previous passwords a new one is compared against.
        passwordNumDifferent:
          type: integer
          description: How many characters a new password must differ by.
      required: [passwordRegex, passwordHistorySize, passwordNumDifferent]

    # ─────────────────────────── Delivery settings ───────────────────────────
    SmtpDeliverySettings:
      type: object
      description: |
        The SMTP server auth sends email through, without its password. `enabled` keeps the
        server on record while nothing is sent through it.
      properties:
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        username:
          type: string
        from:
          type: string
          format: email
          description: The sender address.
        subject:
          type: string
          description: Subject line of every message.
        startTls:
          type: boolean
          description: Whether the connection is upgraded with STARTTLS.
        enabled:
          type: boolean
      required: [host, port, username, from, subject, startTls, enabled]

    OtpProviderDeliverySettings:
      type: object
      description: |
        The HTTP request auth sends for each SMS, without its password. `{{phone}}` and
        `{{message}}` in a body entry stand for the recipient and the text. A `username` makes
        the request carry HTTP Basic credentials.
      properties:
        method:
          type: string
          enum: [GET, POST, PUT, PATCH]
        url:
          type: string
          format: uri
          description: |
            Absolute HTTP(S) URL of the provider, without credentials in it (`user:secret@host` is
            refused; the query string is stored and returned as sent, see `body`).
        username:
          type: string
          nullable: true
        body:
          type: object
          additionalProperties:
            type: string
          description: |
            The JSON body, one string per entry. Stored and returned as sent, like the URL and its
            query string, so neither must hold credentials: a provider that authenticates with HTTP
            Basic takes `username` and the write-only password; one that wants its key in the body
            or the query is not supported by this record.
        enabled:
          type: boolean
      required: [method, url, body, enabled]

    DeliverySettings:
      type: object
      description: The stored settings as the admin surface sees them. No password is ever returned.
      properties:
        smtp:
          allOf:
            - $ref: '#/components/schemas/SmtpDeliverySettings'
          nullable: true
        hasSmtpPassword:
          type: boolean
          description: Whether an SMTP password is on record.
        otpProvider:
          allOf:
            - $ref: '#/components/schemas/OtpProviderDeliverySettings'
          nullable: true
        hasOtpProviderPassword:
          type: boolean
          description: Whether an OTP provider password is on record.
      required: [hasSmtpPassword, hasOtpProviderPassword]

    DeliverySettingsUpdate:
      type: object
      description: |
        What `PUT /configuration/delivery-settings` stores. A password field that is absent or
        `null` keeps the stored password; an empty string clears it.
      properties:
        smtp:
          allOf:
            - $ref: '#/components/schemas/SmtpDeliverySettings'
          nullable: true
        smtpPassword:
          type: string
          nullable: true
          description: Write-only. Absent or `null` keeps the stored password, empty clears it.
        otpProvider:
          allOf:
            - $ref: '#/components/schemas/OtpProviderDeliverySettings'
          nullable: true
        otpProviderPassword:
          type: string
          nullable: true
          description: Write-only. Absent or `null` keeps the stored password, empty clears it.

    # ─────────────────────────────── Edges ───────────────────────────────
    RegisterEdgeRequest:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/EdgeId'
        groupId:
          type: string
          description: The group the edge joins and never leaves. `default` when absent.
      required: [id]
    EdgeGroup:
      type: object
      properties:
        id:
          type: string
          pattern: '^[a-z][a-z0-9-]*$'
        kind:
          type: string
          enum: [first_party, partner]
          description: Who runs the edges of the group. Set once, by the operator, never changed.
      required: [id, kind]
    GetEdgeGroupsResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/EdgeGroup'
      required: [groups]
    EstEnrollmentTokenResponse:
      type: object
      properties:
        token:
          type: string
          description: Shown once; only its hash is stored.
        expiresAt:
          type: string
          format: date-time
        subject:
          type: string
          description: |
            The subject (RFC 4514) the certificate request must say, and the certificate will carry.
      required: [token, expiresAt, subject]
    ClientEstState:
      type: object
      properties:
        pending:
          type: boolean
          description: 'No certificate has been issued yet: the client has not enrolled.'
        certificateExpiresAt:
          type: [string, 'null']
          format: date-time
          description: When the latest certificate issued to the client expires.
        chainEndsAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the chain of renewals ends and renewing is refused until an operator extends it; `null` where
            `client-identity.auto-extend` is on, or the client has not enrolled.
      required: [pending]
    EnrollmentTokenResponse:
      type: object
      properties:
        token:
          type: string
          description: Shown once; only its hash is stored.
        expiresAt:
          type: string
          format: date-time
      required: [token, expiresAt]
    EdgeResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/EdgeId'
        hasOldKey:
          type: boolean
          description: Whether a rotation is open and the previous key still verifies.
        requireDpopNonce:
          type: boolean
          description: |
            RFC 9449 §9: whether every DPoP proof this edge checks on a proxied call must
            carry a nonce it issued. Governs that edge only, and only the calls it proxies —
            auth's own endpoints follow the tenant setting of the same name.
        overloadPolicy:
          $ref: '#/components/schemas/OverloadPolicy'
          description: The edge's overload policy; absent when none is set.
        accessLogPolicy:
          $ref: '#/components/schemas/AccessLogPolicy'
          description: The edge's access-log policy; absent when none is set.
        rateLimitPolicies:
          $ref: '#/components/schemas/RateLimitPolicies'
          description: The edge's rate limit policies; absent when none are set.
        policyRevisions:
          type: object
          additionalProperties: { type: integer }
          description: The revision of each policy section that has ever changed (`overload`, `accessLog`, `rateLimits`); for `expectedRevisions` of `PATCH /configuration/edges/policies`.
        groupId:
          type: string
          description: The group of edges this edge belongs to.
        identityChainEndsAt:
          type: string
          format: date-time
          description: |
            When central stops renewing the certificate of this edge, if it will: only for an edge of a
            partner group, where `edge-identity.auto-extend` is off. Absent otherwise. Extend it with
            `POST /configuration/edges/extend` before then.
      required: [id, hasOldKey, requireDpopNonce]
    OverloadPolicy:
      type: object
      description: |
        A patch over the settings an edge starts with; every field is optional.
      properties:
        inbound:
          $ref: '#/components/schemas/InboundOverloadPolicy'
        outbound:
          $ref: '#/components/schemas/OutboundOverloadPolicy'
    OverloadMode:
      type: string
      enum: [off, shadow, enforce]
      description: |
        `off` does nothing; `shadow` counts what `enforce` would refuse and refuses nothing;
        `enforce` refuses. The default is `shadow`.
    InboundOverloadPolicy:
      type: object
      description: Admission control at the edge's entry; a refusal is `503` with `Retry-After`.
      properties:
        mode:
          $ref: '#/components/schemas/OverloadMode'
        maxInFlight:
          type: integer
          minimum: 1
          maximum: 100000
          description: |
            Where the learned limit starts, in requests in flight at once, clamped into
            `adaptive.minLimit`..`adaptive.maxLimit`. The limit then follows the pod. Default 256.
        continuationShare:
          type: number
          minimum: 0.01
          maximum: 1
          description: |
            The share of the limit work already begun (code exchange, logout) may use; above it
            such requests are refused. New logins use `startShare`, proxied calls the whole limit.
            Default 0.85.
        startShare:
          type: number
          minimum: 0.01
          maximum: 1
          description: |
            The share of the limit a new login may use; must not exceed `continuationShare`.
            Default 0.65.
        retryAfterSeconds:
          type: integer
          minimum: 1
          maximum: 60
          description: The `Retry-After` of a refusal, in seconds. Default 1.
        adaptive:
          type: object
          description: |
            Bounds and gains of the learned limit. The limit shrinks when call times rise or the
            executor stalls and grows back while calls are fast, inside `[minLimit, maxLimit]`; it is
            learned whenever `mode` is not `off` (in `shadow` nothing is refused, but the refusals
            `enforce` would make are counted). There is no switch.
          properties:
            minLimit:
              type: integer
              minimum: 1
              maximum: 100000
              description: The limit never goes below this. Default 16.
            maxLimit:
              type: integer
              minimum: 1
              maximum: 100000
              description: The limit never goes above this. Default 1024.
            tolerance:
              type: number
              minimum: 1
              maximum: 5
              description: |
                How much slower than usual a call may get before the limit shrinks (1.5: half
                again). Default 1.5.
            smoothing:
              type: number
              minimum: 0.01
              maximum: 1
              description: The share of each new estimate that replaces the limit. Default 0.2.
            lagTargetMillis:
              type: integer
              minimum: 5
              maximum: 10000
              description: |
                How late the executor may run a timer before it counts as stalled. Default 50.
    OutboundOverloadPolicy:
      type: object
      description: |
        Bounds on the edge's calls to auth and to resource backends, per peer. A refusal is `503`
        with `Retry-After`, a call that took too long is `504`. Queueing and timeouts apply in
        `enforce` only.
      properties:
        mode:
          $ref: '#/components/schemas/OverloadMode'
        maxConcurrent:
          type: integer
          minimum: 1
          maximum: 100000
          description: Calls in flight towards one peer. Defaults to the connection pool size (128).
        maxQueue:
          type: integer
          minimum: 1
          maximum: 100000
          description: Calls allowed to wait for a place; one more is refused. Default 256.
        queueTimeoutMillis:
          type: integer
          minimum: 1
          maximum: 600000
          description: The longest a call waits for a place. Default 1000.
        requestTimeoutMillis:
          type: integer
          minimum: 1
          maximum: 600000
          description: The longest a call may take to the response headers. Default 10000.
        breaker:
          type: object
          description: |
            Opens when `failureRatio` of the calls in the window fail (a transport error, a
            timeout, or a `502`/`503`/`504`), refuses at once while open, then lets `probeCalls`
            probes through. Off unless `enabled`.
          properties:
            enabled:
              type: boolean
              description: Default false.
            failureRatio:
              type: number
              minimum: 0.01
              maximum: 1
              description: Default 0.5.
            minCalls:
              type: integer
              minimum: 1
              maximum: 10000
              description: Calls the window must hold before the ratio counts. Default 20.
            windowSeconds:
              type: integer
              minimum: 1
              maximum: 300
              description: Default 10.
            openSeconds:
              type: integer
              minimum: 1
              maximum: 600
              description: How long the circuit stays open before probing. Default 5.
            probeCalls:
              type: integer
              minimum: 1
              maximum: 100
              description: Default 3.
        retryBudget:
          type: object
          description: What retries may add to the load on a peer, as a share of its calls.
          properties:
            ratio:
              type: number
              minimum: 0
              maximum: 1
              description: Retries allowed per call made. Default 0.1.
            minPerSecond:
              type: number
              minimum: 0
              maximum: 1000
              description: Retries per second always allowed, whatever the ratio. Default 5.
    AccessLogPolicy:
      type: object
      description: |
        A patch over the access-log settings an edge starts with; every field is optional.
      properties:
        mode:
          type: string
          enum: [full, sampled, off]
          description: |
            `full` logs every request. `sampled` logs failures, slow requests and a share of the rest
            (`successSampleRate`, chosen per trace so every hop of a trace agrees). `off` logs failures and slow requests only.
            The edge's default is `off`.
        slowMillis:
          type: integer
          format: int64
          minimum: 0
          maximum: 600000
          description: A request at least this slow is always logged. Default 500.
        successSampleRate:
          type: number
          minimum: 0
          maximum: 1
          description: In `sampled`, the share of traces whose successful requests are logged. Default 0.05.
    RateLimitPolicies:
      type: object
      properties:
        replicas:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
          description: |
            How many edge pods share the traffic. Each pod enforces `limit / replicas` of every window (and `burst / replicas`,
            rounded up, never below `cost`), so the edge as a whole allows about the limit written here. As exact as the balancer
            is even; there is no shared counter. Set it to the number of pods of this edge.
        policies:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/RateLimitPolicy'
    RateLimitPolicy:
      type: object
      required: [name, limits]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,47}$'
          description: Stable identifier; appears in metrics and, later, in the response. Unique in the set.
        by:
          type: array
          items:
            type: string
            enum: [ip, certificate, client, subject, session, jkt]
          description: |
            What a bucket is keyed on; empty means one bucket for the whole scope. `client`, `subject`, `session` and `jkt`
            come from the verified access token, never from what the caller sent. `ip` (the caller's address on the plain
            listener, failed and unauthenticated attempts only, see `client-ip` in the edge's config) and `certificate` (the
            verified client certificate of the mutual-TLS listener, every call) are counted before the token is read, so they
            stand alone and take scope `edge-wide`. A request that lacks a value (a bearer token has no
            `jkt`) is not counted by that policy.
        scope:
          type: string
          enum: [edge-wide, resource, endpoint]
          default: edge-wide
          description: |
            `edge-wide` keeps one bucket per key; `resource` and `endpoint` one per key and resource, or per key and
            registered endpoint template. A policy narrower than the edge is checked after the caller's permissions are
            resolved; the others are checked right after the access token is verified.
        limits:
          type: array
          minItems: 1
          maxItems: 8
          description: Every window must pass. Windows of one policy are distinct.
          items:
            type: object
            required: [limit, windowSeconds]
            properties:
              limit:
                type: integer
                minimum: 1
                maximum: 1000000
              windowSeconds:
                type: integer
                minimum: 1
                maximum: 86400
        burst:
          type: integer
          minimum: 1
          default: 1
          description: How many requests may arrive together. Not above the smallest `limit`. `1` is strict spacing.
        cost:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
          description: What one request takes from the bucket. Not above `burst`.
        mode:
          type: string
          enum: [off, shadow, enforce]
          default: shadow
          description: '`off` ignores the policy; `shadow` counts what would be refused and refuses nothing; `enforce` refuses with `429` and `Retry-After`.'
    DeclaredRateLimit:
      type: object
      required: [limits]
      description: |
        A rate limit declared by the owner of an API (on a resource endpoint, or for a client of a resource's audience), not in the
        edge's own set. The rules are those of `RateLimitPolicy` (windows, burst, mode); `cost` is always 1. It applies together
        with the edge's policies and a request must pass all of them, so the smallest limit wins. In metrics it is the policy
        `resource-endpoint` or `resource-client`, never an id.
      properties:
        limits:
          type: array
          minItems: 1
          maxItems: 8
          description: Every window must pass. Windows are distinct.
          items:
            type: object
            required: [limit, windowSeconds]
            properties:
              limit:
                type: integer
                minimum: 1
                maximum: 1000000
              windowSeconds:
                type: integer
                minimum: 1
                maximum: 86400
        burst:
          type: integer
          minimum: 1
          default: 1
          description: How many calls may arrive together. Not above the smallest `limit`. `1` is strict spacing.
        by:
          type: string
          enum: [subject, client, none]
          default: none
          description: |
            What a bucket is keyed on. On an endpoint, `none` is one bucket for the endpoint, `client` one per client and
            `subject` one per user. On an audience client, `none` is one bucket for that client on the resource and `subject` one per
            user of it; `client` is refused there, since it would mean the same as `none`.
        mode:
          type: string
          enum: [off, shadow, enforce]
          default: shadow
          description: '`off` ignores the limit; `shadow` counts what would be refused and refuses nothing; `enforce` refuses with `429` and `Retry-After`.'
    AudienceRateLimit:
      type: object
      required: [clientId, rateLimit]
      description: |
        What the owner of a resource lets one client of its audience take from it. It applies to that client's calls to this resource,
        checked together with the edge's own rate limit policies (the smaller limit wins). The client's own owner sets nothing.
        In metrics it is the policy `resource-client`.
      properties:
        clientId:
          $ref: '#/components/schemas/ClientId'
        rateLimit:
          $ref: '#/components/schemas/DeclaredRateLimit'
    EdgePolicies:
      type: object
      required: [edgeId]
      properties:
        edgeId: { type: string }
        overload:
          $ref: '#/components/schemas/OverloadPolicy'
        accessLog:
          $ref: '#/components/schemas/AccessLogPolicy'
        rateLimits:
          $ref: '#/components/schemas/RateLimitPolicies'
        revisions:
          type: object
          additionalProperties: { type: integer }
          description: How many times each section has changed, by section name. A section that never changed is absent (revision 0).
        updatedAt:
          type: object
          additionalProperties: { type: string, format: date-time }
          description: When each section last changed, by section name.
    EdgePoliciesPatch:
      type: object
      description: The sections to change. A key that is not listed here is refused.
      properties:
        overload:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/OverloadPolicy' }]
        accessLog:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/AccessLogPolicy' }]
        rateLimits:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/RateLimitPolicies' }]
        expectedRevisions:
          type: object
          description: The revision of each named section the client last read; the patch is applied only if all still match.
          properties:
            overload: { type: integer, minimum: 0 }
            accessLog: { type: integer, minimum: 0 }
            rateLimits: { type: integer, minimum: 0 }
          additionalProperties: false
    EdgePoliciesError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        section:
          type: string
          enum: [overload, accessLog, rateLimits]
        current:
          $ref: '#/components/schemas/EdgePolicies'
    SetEdgeDpopRequest:
      type: object
      properties:
        requireDpopNonce:
          type: boolean
      required: [requireDpopNonce]
    GetAllEdgesResponse:
      type: object
      properties:
        edges:
          type: array
          items:
            $ref: '#/components/schemas/EdgeResponse'
      required: [edges]
    ServiceKeyResponse:
      type: object
      properties:
        keyId:
          type: string
        privateKey:
          type: string
          description: The base64url-encoded PKCS#8 private key. Returned only once.
      required: [keyId, privateKey]
    AntifraudListType:
      type: string
      enum: [deny, allow, watch, fake]
      description: |
        `deny` blocks; `fake` answers as if the step succeeded and does nothing (a real person on it is told a code was
        sent and gets none: confirmed fraud only); `watch` adds to the score; `allow` takes score off, for an exact
        subject only, and never overrides a deny of the same specificity.
    AntifraudValueType:
      type: string
      enum: [phone_hash, prefix, ip, cidr, asn, device_id, ua_hash, ja4_hash, email_domain]
    AntifraudListEntryRequest:
      type: object
      description: Give `value`, or for a `phone_hash` entry `phone` instead.
      properties:
        listType: { $ref: '#/components/schemas/AntifraudListType' }
        valueType: { $ref: '#/components/schemas/AntifraudValueType' }
        value:
          type: string
          description: |
            What is matched, up to 256 characters: the keyed hash (`phone_hash`), digits of a number without the `+`
            (`prefix`, at most 4), an address, a network `address/length`, an AS number, a device id, the lower-case hex
            SHA-256 of a user agent, a JA4 fingerprint or a domain name.
        phone:
          type: string
          description: |
            A phone number, for `valueType: phone_hash` only. Auth hashes it the way the event log stores a destination
            and keeps the hash, never the number. Rotating `security.antifraud-subject-secret` stops such entries from matching.
        tenantId:
          allOf: [{ $ref: '#/components/schemas/TenantId' }]
          description: "The tenant the entry applies to. Omitted: every tenant (operators only)."
        expiresAt: { type: string, format: date-time }
        reason: { type: string }
        source:
          type: string
          description: Who or what put it on the list. Defaults to `manual`; anything else needs `expiresAt`.
        shadow:
          type: boolean
          description: Matched and counted, enforces nothing (the fired rule is `shadow_list:<value type>`). Defaults to `false`.
        userId: { $ref: '#/components/schemas/UserId' }
      required: [listType, valueType, userId]
    AntifraudListEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        listType: { $ref: '#/components/schemas/AntifraudListType' }
        valueType: { $ref: '#/components/schemas/AntifraudValueType' }
        value: { type: string }
        tenantId: { $ref: '#/components/schemas/TenantId' }
        expiresAt: { type: string, format: date-time }
        reason: { type: string }
        source: { type: string }
        shadow: { type: boolean }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        hitCount:
          type: integer
          description: Kept in memory by each instance and written every 30 seconds, so it lags.
        lastHitAt: { type: string, format: date-time }
      required: [id, listType, valueType, value, source, shadow, createdBy, createdAt, hitCount]
    AntifraudListEntriesResponse:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/AntifraudListEntry' }
      required: [entries]
    AntifraudListAuditResponse:
      type: object
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/AntifraudListAudit' }
      required: [records]
    AntifraudListAudit:
      type: object
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        action: { type: string, enum: [create, delete, expire] }
        actor: { type: string }
        entryId: { type: string, format: uuid }
        listType: { $ref: '#/components/schemas/AntifraudListType' }
        valueType: { $ref: '#/components/schemas/AntifraudValueType' }
        value: { type: string }
        tenantId: { $ref: '#/components/schemas/TenantId' }
        expiresAt: { type: string, format: date-time }
        reason: { type: string }
      required: [id, at, action, actor, entryId, listType, valueType, value]
