    CreateClientResponse:
      type: object
      description: |
        `secret` is absent for a client registered with any method other than `client_secret` --
        there is none to hand back, and an empty string would read as a usable one.
      properties:
        secret:
          $ref: '#/components/schemas/Secret'
        createdAt:
          type: string
          format: date-time
          description: |
            When central recorded the registration, so a caller holding the client it just
            sent can state its age without reading it back.
        privateKey:
          oneOf:
            - $ref: '#/components/schemas/PrivateJsonWebKey'
            - type: 'null'
          description: |
            The `private_key_jwt` key generated for this registration, present only where
            `generateJwks` asked for one.

            The only time it is readable: nothing stores it, so a caller that does not keep
            it registers another key rather than asking again. Handed back the way a client
            secret is, and to be treated the same way.
      required: [createdAt]
    RotateSecretResponse:
      type: object
      properties:
        secret:
          $ref: '#/components/schemas/Secret'
      required: [secret]
    ResponseType:
      type: string
      enum: [code, 'code id_token']
    SecurityProfile:
      type: string
      description: |
        Which profile a tenant's clients are held to, at registration and at runtime.
        Chosen when the tenant is created, and never changed afterwards. `fapi2` is the default
        for a new tenant; `standard` is plain OAuth 2.1, which also admits a reverse-domain
        private-use redirect scheme (RFC 8252 §7.1).
      enum: [standard, fapi2]
    ApplicationType:
      type: string
      description: |
        OIDC Dynamic Client Registration §2 `application_type`: what kind of program the
        client is, held apart from how it authenticates. Only a `native` client may register
        a loopback `http` redirect URI (RFC 8252 §7.3), and only a `native` one is served by
        an edge's native endpoints.
      enum: [web, native]
    AuthMethod:
      type: string
      description: |
        RFC 7591 `token_endpoint_auth_method`, minus the distinction between
        `client_secret_basic` and `client_secret_post` - both carry the same credential, and
        this server accepts either transport for a client registered with `client_secret`.
      enum: [client_secret, private_key_jwt, tls_client_auth, self_signed_tls_client_auth, none]
    MutualTlsSubjectType:
      type: string
      description: |
        RFC 8705 §2.1.2: which registered value a presented certificate is recognised by.
        Exactly one per client - a certificate matching any of several registered values would
        authenticate the client, which only widens what one stolen certificate reaches.
      enum: [subject_dn, san_dns, san_uri, san_ip, san_email]
    MutualTlsAuth:
      type: object
      description: |
        Which of RFC 8705's two mutual-TLS methods a client registered, discriminated by
        `type`. They are alternatives rather than settings of one method: §2.1 compares the
        certificate's subject against a registered value, §2.2 compares its public key against
        the client's `jwks` and therefore registers no subject of its own.
      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum: [tls_client_auth]
            subjectType:
              $ref: '#/components/schemas/MutualTlsSubjectType'
            subjectValue:
              type: string
              description: |
                Compared literally against the certificate. For `subject_dn` that is the RFC
                4514 string form of the subject, which registration normalises rather than
                trusting the operator's spacing.
          required: [type, subjectType, subjectValue]
        - type: object
          properties:
            type:
              type: string
              enum: [self_signed_tls_client_auth]
          required: [type]
    PrivateJsonWebKey:
      type: object
      description: |
        An RFC 7517 JWK carrying its private material -- the exact document registered, not a
        narrowed model of it. Never listed back: a stored one leaves central encrypted to the
        requesting edge's public key. The one exception is a key this server generated itself,
        returned once in the registration response that asked for it and stored nowhere.

        Registration refuses a document that is not an RSA or EC key, that is marked
        `"use": "enc"`, or that carries no private material -- a signer that cannot sign is
        rejected here rather than at the first authorization request, where it would read as
        an outage.
      additionalProperties: true
      required: [kty, kid, alg]
      properties:
        kty:
          type: string
          description: RFC 7517 §4.1. Only `RSA` and `EC` can sign here.
          enum: [RSA, EC]
        kid:
          type: string
          description: |
            RFC 7517 §4.5. Required: it is what a signature made with this key names, and what
            the matching public half in the client's `jwks` is found by.
        alg:
          type: string
          description: |
            RFC 7517 §4.4. Required rather than inferred from `kty`, which does not determine
            it -- an RSA key signs `RS256` or `PS256`, and guessing would pin a deployment to
            the one it excluded.
          enum: [ES256, PS256, RS256]
