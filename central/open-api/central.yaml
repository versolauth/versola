openapi: 3.1.0

info:
  title: Versola Central API
  version: '1.0'
  description: |
    Central is the Versola control plane: the source of truth for tenants, clients,
    resources, scopes, permissions, roles, users and the branding/challenge configuration
    that auth and edge consume.

    Central is an internal service. It is never exposed to end users or to browser
    traffic — only to the admin console (`central-ui`).

    This reference covers the admin console surface. Central also exposes internal
    replication endpoints that are not part of this document:

    * `/configuration/*/sync`, `/configuration/*/registry`, `/configuration/jwks/signing-keys/sync`
      and `POST /users/registrations`, which auth reads with its shared-secret token. Every
      route outside `/edge/*` refuses a token that authenticates an edge (`403`).
    * `/edge/sync/*` (`clients`, `resources`, `roles`, `permissions`, `jwks`, `dpop`,
      `auth-request-presets`, `server-metadata`, `overload`, `access-log`, `rate-limits`), `POST /edge/clients/edge-certificate/sign`
      and `POST /edge/certificate/renew` (an edge's own certificate, over the same listener),
      the surface an edge reads with the key it was registered with. It is served only on central's
      own mutual-TLS listener (`MPORT`), never on the port this document describes: the handshake must
      present a certificate that chains to the listener's trust anchors, and the certificate must carry
      the URI name `urn:versola:edge:<id>` for the edge the token names, or the call is `401`. An edge
      is served only the tenants bound to it; the admin credential and auth's token are refused there
      (`401`). An edge of a `partner` group is refused all of `/edge/sync/*` (`401`): it is
      issued a certificate that names its group and is given no configuration.
    * `POST /edge/enroll`, which an edge reaches before it has a certificate: it trades a one-time
      token (`POST /configuration/edges/enrollment-tokens`) and a certificate request for its first
      certificate. It is served alone on central's additional listener (`APORT`, plain HTTP meant to
      sit behind the TLS terminator of the public name for central), with no client certificate;
      an unknown, spent, expired or other-edge token is one and the same `401`.

    * `POST /est/enroll` and `POST /est/renew`, which auth calls after it has authenticated an EST
      (RFC 7030) request of a client registered with `estEnrollment`: central checks the request
      against the registration and has the CA behind `client-certificates` issue. Auth's token
      alone reaches them (an edge's is refused); they are not served on the mutual-TLS listener.
      Auth holds no CA credentials, but it is in the trust zone of the mutual-TLS terminator: central takes from it
      which certificate was presented and which token was sent.

    ## Authentication

    Every operation below is called with HTTP Basic: the fixed username `central` and the
    base64url-encoded central resource secret as the password.

    ## Conventions

    * Identifiers are passed as query parameters, not path segments — `DELETE
      /configuration/tenants?tenantId=acme`, not `DELETE /configuration/tenants/acme`.
    * Localized text is a map of BCP 47 language tag to string: `{"en": "Name", "ru": "Имя"}`.
    * `PUT` bodies that contain `add`/`remove`/`delete` members are patches: only the listed
      members change. Some nullable fields follow JSON merge-patch semantics — key absent
      means "leave unchanged", `null` means "clear", a value means "set" — but others are
      plain optional overwrites where `null` and absent both mean "leave unchanged"; each
      operation states which applies to which field.
    * Secrets and private keys are returned exactly once, at creation or rotation time.
      Central stores only encrypted copies and cannot show them again.
  license:
    name: Versola Community License v1.0
    url: https://github.com/versolauth/versola/blob/main/LICENCE.md

externalDocs:
  description: Versola documentation
  url: https://docs.versola.kz

servers:
  - url: '{centralBaseUrl}'
    description: |
      Central is self-hosted and has no public address. Point this at your own deployment —
      the default is the address it listens on in the docker-compose setup.
    variables:
      centralBaseUrl:
        default: http://localhost:8090

security:
  - centralBasic: []

tags:
  - name: Tenants
    description: Isolation boundaries that own clients, resources, scopes, permissions and roles.
  - name: Clients
    description: OAuth clients, their secrets and their sign-in flows.
  - name: Authorization presets
    description: Named, server-side authorization request templates for a client.
  - name: Resources
    description: Protected APIs behind edge, their endpoints and their access policies.
  - name: Scopes
    description: OAuth scopes and the claims each scope releases.
  - name: Permissions
    description: Fine-grained rights that map to resource endpoints.
  - name: Roles
    description: Named bundles of permissions granted to users within a tenant.
  - name: Authorization detail types
    description: RFC 9396 `authorization_details` types and their JSON Schemas.
  - name: Users
    description: The user index — identifiers, claims, roles, sessions, passkeys and passwords.
  - name: Challenges
    description: OTP templates and per-tenant challenge, session and passkey settings.
  - name: Forms
    description: Versioned login form bundles (style, script, localizations, properties).
  - name: Locales
    description: Locales offered on the login UI, and the default among them.
  - name: Themes
    description: CSS themes applied to the login UI, globally or per tenant.
  - name: JWKS
    description: The central-owned JSON Web Key Set used to sign and verify admin tokens.
  - name: Server metadata
    description: Overrides merged into the RFC 8414 authorization server metadata document.
  - name: System settings
    description: Global, non-tenant-scoped settings such as the password policy.
  - name: Delivery settings
    description: |
      How auth delivers one-time codes and temporary passwords: the SMTP server for email and
      the HTTP provider for SMS. One record per deployment; it replaces the `smtp` and
      `otp-provider` blocks of `auth.conf` once stored. Passwords are write-only.
  - name: Edges
    description: Registered edge deployments and their signing keys.
  - name: Antifraud lists
    description: Values the antifraud rules block, fake, watch or allow at once. Stored and enforced by auth.
  - name: Service
    description: Operational endpoints that return `404 Not Found` in production.

paths:
  # ─────────────────────────────── Tenants ───────────────────────────────
  /configuration/tenants:
    get:
      tags: [Tenants]
      summary: List tenants
      operationId: getAllTenants
      responses:
        '200':
          description: Every tenant known to central.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllTenantsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Tenants]
      summary: Create a tenant
      operationId: createTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Tenant created.
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Tenants]
      summary: Update a tenant
      description: Replaces the description and edge binding of an existing tenant.
      operationId: updateTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '204':
          description: Tenant updated.
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Tenants]
      summary: Delete a tenant
      operationId: deleteTenant
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
      responses:
        '204':
          description: Tenant deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────────────────── Clients ───────────────────────────────
  /configuration/clients:
    get:
      tags: [Clients]
      summary: List a tenant's clients
      operationId: getAllClients
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/OffsetQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Clients belonging to the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllClientsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Clients]
      summary: Delete a client
      operationId: deleteClient
      parameters:
        - $ref: '#/components/parameters/ClientIdQuery'
      responses:
        '204':
          description: Client deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/clients/web:
    post:
      tags: [Clients]
      summary: Register a web client
      description: |
        A site with a backend, where users sign in. See `CreateWebClientRequest`.
        The secret is returned only here, and only for `authMethod: client_secret`.
      operationId: createWebClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebClientRequest'
      responses:
        '201':
          description: Client registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClientResponse'
        '400':
          description: |
            The request carries a member this kind does not have, or the registration was
            rejected: a method or setting the kind does not allow (named in the body), or any
            consent URI that is not an absolute HTTPS URL.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A client with this id already exists.
    put:
      tags: [Clients]
      summary: Update a web client
      description: |
        Only for a client registered as a web client: a client's kind is fixed, and an
        update sent to another kind's endpoint is refused with `409` naming the right one.
      operationId: updateWebClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebClientRequest'
      responses:
        '204':
          description: Client updated.
        '400':
          description: The patch was rejected, or carries a member this kind does not have.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such client.
        '409':
          description: The client is of another kind.
          content:
            text/plain:
              schema:
                type: string
  /configuration/clients/native:
    post:
      tags: [Clients]
      summary: Register a native client
      description: |
        An app installed on a device, holding a DPoP key. See `CreateNativeClientRequest`.
        The secret is returned only here, and only for `authMethod: client_secret`.
      operationId: createNativeClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNativeClientRequest'
      responses:
        '201':
          description: Client registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClientResponse'
        '400':
          description: |
            The request carries a member this kind does not have, or the registration was
            rejected: a method or setting the kind does not allow (named in the body), or any
            consent URI that is not an absolute HTTPS URL.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A client with this id already exists.
    put:
      tags: [Clients]
      summary: Update a native client
      description: |
        Only for a client registered as a native client: a client's kind is fixed, and an
        update sent to another kind's endpoint is refused with `409` naming the right one.
      operationId: updateNativeClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNativeClientRequest'
      responses:
        '204':
          description: Client updated.
        '400':
          description: The patch was rejected, or carries a member this kind does not have.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such client.
        '409':
          description: The client is of another kind.
          content:
            text/plain:
              schema:
                type: string
  /configuration/clients/service:
    post:
      tags: [Clients]
      summary: Register a service client
      description: |
        Code calling an API with no user present. See `CreateServiceClientRequest`.
        The secret is returned only here, and only for `authMethod: client_secret`.
      operationId: createServiceClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceClientRequest'
      responses:
        '201':
          description: Client registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClientResponse'
        '400':
          description: |
            The request carries a member this kind does not have, or the registration was
            rejected: a method or setting the kind does not allow (named in the body), or any
            consent URI that is not an absolute HTTPS URL.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A client with this id already exists.
    put:
      tags: [Clients]
      summary: Update a service client
      description: |
        Only for a client registered as a service client: a client's kind is fixed, and an
        update sent to another kind's endpoint is refused with `409` naming the right one.
      operationId: updateServiceClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceClientRequest'
      responses:
        '204':
          description: Client updated.
        '400':
          description: The patch was rejected, or carries a member this kind does not have.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such client.
        '409':
          description: The client is of another kind.
          content:
            text/plain:
              schema:
                type: string

  /configuration/clients/rotate-secret:
    post:
      tags: [Clients]
      summary: Rotate a client secret
      description: |
        Issues a new secret and keeps the previous one valid until
        `DELETE /configuration/clients/previous-secret` retires it, so deployments can roll
        over without downtime.
      operationId: rotateClientSecret
      parameters:
        - $ref: '#/components/parameters/ClientIdQuery'
      responses:
        '200':
          description: The new secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateSecretResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/clients/previous-secret:
    delete:
      tags: [Clients]
      summary: Retire the previous client secret
      operationId: deletePreviousClientSecret
      parameters:
        - $ref: '#/components/parameters/ClientIdQuery'
      responses:
        '204':
          description: Previous secret removed.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/clients/est/enrollment-tokens:
    post:
      tags: [Clients]
      summary: Create a one-time token for a client to enrol with through EST
      description: |
        For a client registered with `estEnrollment`. The client trades the token, once and within 24 hours
        (`validityHours` asks for another time, at most 168), at `POST /.well-known/est/simpleenroll` on auth
        (RFC 7030; HTTP Basic with the client id as user name, or Bearer) together with a PKCS#10 request
        made with a key it generated, for its first certificate. Only a hash of the token is kept: it is
        shown here and never again; a new token replaces the client's earlier unused ones, and the enrolment it
        leads to ends the right of every earlier certificate to renew (see `POST /configuration/clients/est/revoke`).
        `subject` is what the request must say: the certificate carries
        exactly that subject, and a request that says another is refused (RFC 7030 §4.2.2 asks the same of
        a renewal). The certificate is renewed by the client itself on auth's mutual-TLS listener (see
        `POST /configuration/clients/est/extend` for how long, and what happens at the end).
      operationId: createClientEstEnrollmentToken
      parameters:
        - $ref: '#/components/parameters/ClientIdQuery'
        - name: validityHours
          in: query
          required: false
          description: How long the token is good for, in hours; 24 when absent, at most 168.
          schema:
            type: integer
            minimum: 1
            maximum: 168
      responses:
        '201':
          description: Token created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstEnrollmentTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The client is not registered with `estEnrollment`, or does not exist.
        '400':
          description: The validity asked for is out of range.

  /configuration/clients/est/extend:
    post:
      tags: [Clients]
      summary: Extend the certificate chain of a client that gets its certificate through EST
      description: |
        A client's certificates are short-lived (`client-certificates.validity`) and renewed by the client
        itself, with the certificate it has. Those renewals are a chain that began at the client's
        enrolment, and `client-identity.max-age` (a year by default) is how old the chain may get. With
        `client-identity.auto-extend` off, the default, central stops renewing at that age until this is
        called (or the client is enrolled again with a new token): the client keeps working on the
        certificate it has until it expires and is told the date in every answer
        (`Versola-Chain-Ends-At` of the EST response), and the date is in `est.chainEndsAt` of
        `GET /configuration/clients`. Calling this starts the chain over. With `auto-extend` on, central
        extends the chain itself and this has no effect on anything the client sees. The end is soft: a certificate
        issued just before it is valid for its whole `client-certificates.validity`.
      operationId: extendClientEstChain
      parameters:
        - $ref: '#/components/parameters/ClientIdQuery'
      responses:
        '204':
          description: The chain starts over now.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The client is not registered with `estEnrollment`, or does not exist.

  /configuration/clients/est/revoke:
    post:
      tags: [Clients]
      summary: End the right of a client's certificates to renew
      description: |
        For an operator who suspects the key of a client that obtains its certificate through EST is out. What is
        revoked is the right to **renew**, which is the real credential: every certificate issued so far belongs to
        a generation of the chain, and none of them can renew any more; tokens not yet used are withdrawn. The
        certificates themselves keep authenticating until they expire (change the client's `mtlsAuth` subject, or delete
        the client, to cut that too). The client enrols again with a new token, which starts a new generation (and does
        the same to every certificate before it). A certificate that a renewal replaced and that renews again after a
        grace of three minutes is the same event, detected by central: the chain is closed (`403` to that request).
      operationId: revokeClientEstChain
      parameters:
        - $ref: '#/components/parameters/ClientIdQuery'
      responses:
        '204':
          description: The right to renew is ended; `est.pending` is true until the client enrols again.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The client is not registered with `estEnrollment`, or does not exist.

  /configuration/clients/edge-certificate/renew:
    post:
      tags: [Clients]
      summary: Renew a managed edge client certificate
      description: |
        Issues a new certificate now for a client whose certificate central manages (one
        registered with `issueEdgeClientCertificate`), instead of waiting for the scheduled
        renewal -- after a change of certificate authority, say.

        Answers `404 Not Found` for a client whose certificate central does not manage: one
        registered with a certificate the operator supplied, one enrolled with
        `enrollEdgeClientCertificate`, or one that does not exist.
      operationId: renewEdgeClientCertificate
      parameters:
        - $ref: '#/components/parameters/ClientIdQuery'
      responses:
        '204':
          description: Certificate renewed.
        '400':
          description: The client's registration cannot be issued a certificate (for example no certificate authority is configured).
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Central does not manage the certificate of this client.
          content:
            text/plain:
              schema:
                type: string

  /configuration/auth-request-presets:
    get:
      tags: [Authorization presets]
      summary: List a client's presets
      operationId: getClientPresets
      parameters:
        - $ref: '#/components/parameters/ClientIdQuery'
      responses:
        '200':
          description: The client's presets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorizationPresetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Authorization presets]
      summary: Replace a client's presets
      description: The submitted list becomes the client's complete set of presets.
      operationId: saveClientPresets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAuthorizationPresetsRequest'
      responses:
        '204':
          description: Presets saved.
        '400':
          description: The presets were rejected, e.g. two presets share an id.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/resources:
    get:
      tags: [Resources]
      summary: List a tenant's resources
      operationId: getAllResources
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/OffsetQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Resources belonging to the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllResourcesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Resources]
      summary: Register a resource
      description: |
        An internal resource is issued a secret that edge presents when calling it. The
        plaintext is returned only here. Non-internal resources receive no secret.
      operationId: createResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceRequest'
      responses:
        '201':
          description: Resource registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResourceResponse'
        '400':
          description: The resource or one of its endpoints is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Resources]
      summary: Update a resource
      description: Endpoints listed in `deleteEndpoints` are removed before `createEndpoints` are added.
      operationId: updateResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourceRequest'
      responses:
        '204':
          description: Resource updated.
        '400':
          description: The resource or one of its endpoints is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Resources]
      summary: Delete a resource
      operationId: deleteResource
      parameters:
        - $ref: '#/components/parameters/ResourceIdQuery'
      responses:
        '204':
          description: Resource deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/resources/rotate-secret:
    post:
      tags: [Resources]
      summary: Rotate a resource secret
      operationId: rotateResourceSecret
      parameters:
        - $ref: '#/components/parameters/ResourceIdQuery'
      responses:
        '200':
          description: The new secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateResourceSecretResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A rotation is already in progress — retire the previous secret first.

  /configuration/resources/previous-secret:
    delete:
      tags: [Resources]
      summary: Retire the previous resource secret
      description: |
        Edge keeps using the previous secret until it is retired here, so this call is what
        completes a rotation.
      operationId: deletePreviousResourceSecret
      parameters:
        - $ref: '#/components/parameters/ResourceIdQuery'
      responses:
        '204':
          description: Previous secret removed.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /configuration/scopes:
    get:
      tags: [Scopes]
      summary: List a tenant's scopes
      operationId: getAllScopes
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/OffsetQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Scopes with their claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllScopesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Scopes]
      summary: Create a scope
      operationId: createScope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScopeRequest'
      responses:
        '201':
          description: Scope created.
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Scopes]
      summary: Update a scope
      description: Adds, updates and deletes claims and description translations in one patch.
      operationId: updateScope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScopeRequest'
      responses:
        '204':
          description: Scope updated.
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Scopes]
      summary: Delete a scope
