    GetAllClientsResponse:
      type: object
      properties:
        clients:
          type: array
          items:
            $ref: '#/components/schemas/OAuthClientResponse'
      required: [clients]
    CreateWebClientRequest:
      type: object
      additionalProperties: false
      description: |
        A site with a backend: users sign in, and tokens stay on the server. Confidential, so
        `authMethod` is `client_secret`, `private_key_jwt`, `tls_client_auth` or
        `self_signed_tls_client_auth` -- never `none` -- and at least one redirect URI is required.

        Fronted by edge (`issueEdgeClientCertificate`, `enrollEdgeClientCertificate` or a supplied
        certificate) it cannot set `requireSignedRequestObject`: edge holds no key to sign one with.

        Recorded as a `web` client. `frontChannelLogoutUri` and `backChannelLogoutUri` are never both
        set, and `logoUri`, `policyUri` and `tosUri` must be absolute HTTPS URLs.
        Members that are not listed here are refused, not ignored.
      properties:
        tenantId:
          $ref: '#/components/schemas/TenantId'
        id:
          $ref: '#/components/schemas/ClientId'
        clientName:
          $ref: '#/components/schemas/LocalizedText'
        redirectUris:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RedirectUri'
        allowedScopes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ScopeToken'
        accessTokenTtl:
          type: integer
          description: Seconds.
        refreshTokenTtl:
          type: [integer, 'null']
          description: Seconds. `null` or omitted uses the default of 15552000 (180 days).
        theme:
          type: string
        authFlow:
          oneOf:
            - $ref: '#/components/schemas/AuthFlow'
            - type: 'null'
        otpTemplateId:
          type: string
        frontChannelLogoutUri:
          type: [string, 'null']
        frontChannelLogoutSessionRequired:
          type: boolean
        backChannelLogoutUri:
          type: [string, 'null']
        logoUri:
          type: [string, 'null']
        policyUri:
          type: [string, 'null']
        tosUri:
          type: [string, 'null']
        consentFlow:
          oneOf:
            - $ref: '#/components/schemas/ConsentFlowDto'
            - type: 'null'
        dpopBoundAccessTokens:
          type: boolean
          description: |
            RFC 9449 §5.2: the client always uses DPoP. A token request from it that carries no
            proof is refused with `invalid_dpop_proof` rather than answered with a bearer token.
        dpopSigningAlgs:
          type: array
          items:
            type: string
            enum: [ES256, PS256, RS256]
          description: |
            RFC 9449 §5.1: the signing algorithms a DPoP proof from this client may use,
            narrowing `dpop_signing_alg_values_supported`. An empty array registers no
            narrowing. Narrowing only ever subtracts - naming an algorithm the metadata
            document does not advertise does not make it acceptable.
        dpopMinRsaKeySize:
          type: [integer, 'null']
          description: |
            The modulus length, in bits, an RSA DPoP proof key from this client must reach.
            `null` leaves the RFC 7518 §3.3 floor of 2048 bits, which applies to every client
            regardless; a value below it is refused at registration.
        authMethod:
          $ref: '#/components/schemas/AuthMethod'
          description: |
            How the client authenticates. Fixed here for the life of the client: an update refuses
            any other value, and a client that has to change method is deleted and registered again.
        mtlsAuth:
          oneOf:
            - $ref: '#/components/schemas/MutualTlsAuth'
            - type: 'null'
          description: |
            RFC 8705 §2 mutual-TLS client authentication. `null` registers none, which is what
            a client authenticating by secret or by client assertion sends. Held to agree with
            `authMethod`: a credential the method does not read is one nothing would check.
            Refused for a tenant whose proxy terminates no mutual TLS (§6.5) - there would be
            no certificate to match it against.
        certificateBoundAccessTokens:
          type: boolean
          description: |
            RFC 8705 §3.4: bind this client's access tokens to the certificate it presents, so
            a resource request carrying one over another certificate is refused. Opt-in and
            independent of `mtlsAuth`, which implies binding on its own - a client that
            authenticates by secret can still ask for it.
        jwks:
          oneOf:
            - $ref: '#/components/schemas/JsonWebKeySet'
            - type: 'null'
          description: |
            RFC 7523 §2.2 `private_key_jwt`: the public keys this client signs its client
            assertions with. `null` means the client does not use the method, or that
            `generateJwks` asks this server for the keys instead.
        generateJwks:
          type: string
          nullable: true
          enum: [ES256, PS256, RS256]
          description: |
            Generate the `private_key_jwt` key pair here instead of registering one, signing
            with this algorithm. The public half is stored as `jwks`; the private half is
            returned as `CreateClientResponse.privateKey` and is kept nowhere.
            For the caller that holds no key and no way to make one. A FAPI 2.0 tenant admits
            no `client_secret`, so without this there is no method left whose credential this
            server issues, and registering a service client there needs a key produced
            outside the product.
            Mutually exclusive with `jwks`, and refused for any method other than
            `private_key_jwt` -- RFC 8705 §2.2 reads a key set too, but matches it against a
            certificate a generated pair would not come with.
        requireSignedRequestObject:
          type: boolean
          description: |
            RFC 9101 §10.5: the client states its authorization request in a request object it
            signed, so a plain parameter set from it is refused with `invalid_request`.
            Needs `jwks` - a request object is verified against no other keys.
        requirePushedAuthorizationRequests:
          type: boolean
          description: |
            RFC 9126 §6.2: the client pushes its authorization request to `/par` first, so one
            arriving at `/authorize` without a `request_uri` is refused with `invalid_request`.
        edgeSigningKey:
          oneOf:
            - $ref: '#/components/schemas/PrivateJsonWebKey'
            - type: 'null'
          description: |
            The private key an edge fronting this client signs and authenticates as it with.
            Must be the private half of a key `jwks` publishes - a pair that cannot verify is
            refused at registration. `null` for a client no edge fronts.
        issueEdgeClientCertificate:
          type: boolean
          description: |
            Central generates the key pair of the certificate the edge fronting this client
            presents, has a CA sign it and renews it before it expires (#440). The client is
            registered `tls_client_auth` by `mtlsAuth` where one is given; without it the subject
            is `CN=<client>,OU=<tenant>,O=Versola`. Required, never defaulted: `false` for a
            client no edge fronts or one that supplies its own certificate. Mutually exclusive with
            `enrollEdgeClientCertificate` and with supplying a certificate.
        enrollEdgeClientCertificate:
          type: boolean
          description: |
            The edge fronting this client generates its own key and enrols for a certificate
            (#463): central stores no certificate and no key, only that the client is enrolled,
            and signs the request an authenticated edge sends for the subject `mtlsAuth`
            registers (or `CN=<client>,OU=<tenant>,O=Versola` where it names none). Only for a
            native client fronted by edge. Required, never defaulted: `false` otherwise.
            Mutually exclusive with `issueEdgeClientCertificate` and with supplying a
            certificate.
        themeOverrides:
          $ref: '#/components/schemas/ThemeOverrides'
          description: |
            What this client changes in the theme it uses (`theme`), laid over it on the client's
            sign-in pages: a partner app with its own brand colour, corners, page or colour scheme.
