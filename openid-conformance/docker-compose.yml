# The OpenID Foundation conformance suite, from its published images.
#
# Same three services as the upstream docker-compose-prebuilt.yml
# (https://gitlab.com/openid/conformance-suite), with the data kept in a named volume
# instead of ./mongo/data, so a checkout of this directory stays clean.
#
# The suite answers on https://localhost.emobix.co.uk:8443, a public name that resolves to
# 127.0.0.1; its certificate is self-signed, so the runner does not verify it.
name: versola-conformance

services:
  mongodb:
    image: ${MONGODB_IMAGE:-mongo:6.0.13}
    volumes:
      - mongo-data:/data/db
    logging:
      driver: json-file
      options: {max-size: 500k, max-file: "5"}

  nginx:
    image: registry.gitlab.com/openid/conformance-suite/nginx:${IMAGE_TAG:-latest}
    ports:
      - "8443:8443"
      - "8444:8444"
    networks:
      default:
        aliases:
          # lets the suite's own outbound requests to its public hostname reach nginx
          - localhost.emobix.co.uk
    depends_on: [server]
    logging:
      driver: json-file
      options: {max-size: 500k, max-file: "5"}

  server:
    image: registry.gitlab.com/openid/conformance-suite:${IMAGE_TAG:-latest}
    environment:
      BASE_URL: https://localhost.emobix.co.uk:8443
      BASE_MTLS_URL: https://localhost.emobix.co.uk:8444
      MONGODB_HOST: mongodb
      SPRING_PROFILES_ACTIVE: dev
      OIDC_GOOGLE_CLIENTID: google-client
      OIDC_GOOGLE_SECRET: google-secret
      OIDC_GITLAB_CLIENTID: gitlab-client
      OIDC_GITLAB_SECRET: gitlab-secret
    depends_on: [mongodb]
    logging:
      driver: json-file
      options: {max-size: 500k, max-file: "5"}

volumes:
  mongo-data:
