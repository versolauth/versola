# lists, plus the velocity counters (deploy.md, "Velocity counters"): every code request is counted per number,
# source address and range, and the counts are flushed to af_velocity and read back. The limits of the stored settings
# are still 0 (`tuning/sms-budget.json`), so no velocity rule fires: the profile measures the cost of counting, flushing
# and loading, and the next one turns the limits on.
include required(file("loadgen/antifraud/auth-profiles/lists.conf"))

antifraud.velocity.enabled = true
