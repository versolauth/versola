# Off, plus the per-range SMS budget (deploy.md, "SMS budget and range statistics").
#
# prefix-length 6: the country code, a three-digit lead and one more digit, 110 ranges for the numbers the scenarios dial
# (`numbers.range-length` of loadgen.conf has to be the same). sent-per-hour 200: a range is closed for the rest of
# the hour once 200 codes were sent to it. That is above what the normal scenario sends to any one range in
# its two minutes (about 22 on average) and well below what the attack sends, which reaches it in ten seconds. It is a number
# for these runs of minutes: a deployment sets it above the busiest range's real hourly peak (deploy.md), which
# at the normal scenario's 20 requests a second held for an hour would be about 650.
#
# min-volume stays 0: the conversion breaker is never applied to a number whose region allows registration (the
# loadgen tenant's does), so it would only be dead configuration here.
include required(file("loadgen/antifraud/auth-profiles/off.conf"))

antifraud {
  sms-budget {
    sent-per-hour = 200
    prefix-length = 6
    min-volume = 0
  }
}
