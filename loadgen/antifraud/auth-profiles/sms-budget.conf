# Off, plus the per-range SMS budget (deploy.md, "SMS budget and range statistics").
#
# The budget is not configuration any more: the limit is a tuned setting, stored by central and changed through its admin
# API without a restart, and the size of a range is the one key left in config (the first digits of a number: the country code, a
# three-digit lead and one more digit, `prefix-length = 6`: `numbers.range-length` of loadgen.conf has to be the same). So
# this profile is auth as in `off.conf` with that key, and the run is made after
#
#   PUT /antifraud/settings   with the stored settings and  "smsLimits": {"default": {"sentPerHour": 200, "minVolume": 0, "minConversion": 0.1}, "byPrefix": {}}
#
# sentPerHour 200: a range is closed for the rest of the hour once 200 codes were sent to it. That is above what the normal
# scenario sends to any one range in its two minutes and well below what the attack sends, which reaches it in ten seconds.
# It is a number for these runs of minutes: a deployment sets it above the busiest range's real hourly peak (deploy.md).
include required(file("loadgen/antifraud/auth-profiles/off.conf"))

antifraud.sms-budget.prefix-length = 6
