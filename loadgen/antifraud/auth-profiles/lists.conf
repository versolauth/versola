# sms-budget, plus the lists (deploy.md, "Antifraud lists") and the decision engine that applies them. The lists hold
# no entry in these runs: what the profile measures is the cost of the lookup and of `evaluate` on every code
# request, not an effect. With the thresholds of the stored settings at 0 (`tuning/sms-budget.json`, the same as the
# profile before) the engine decides `Allow` for everything, and a list entry would be the only thing to change that.
include required(file("loadgen/antifraud/auth-profiles/sms-budget.conf"))

antifraud.decision.enabled = true
antifraud.lists.enabled = true
