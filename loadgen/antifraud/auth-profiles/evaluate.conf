# velocity, with the limits on (`tuning/evaluate.json`, applied with `tune.sh` before the run): the velocity rules fire
# and the score refuses a request at `blockAt`. The finished P0 stack, as a deployment would enable it.
#
# The proof of work is off here: a `Challenge` decision would leave the request on the code step with nothing sent,
# and this process does not solve a proof (a browser does), so a challenged legitimate user would read as refused
# while a real one would get the code a few hundred milliseconds later. `challengeAt` is 0 for the same reason: the
# run measures `Block` alone, and a profile with a solving client is a follow-up.
include required(file("loadgen/antifraud/auth-profiles/velocity.conf"))

antifraud.challenge.enabled = false
