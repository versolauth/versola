# auth under the antifraud loadgen with antifraud off: the local dev config (scripts/gen-env.scala) with the two
# changes the scenarios need, and no `antifraud` block, so every key of it is at its default.
#
#   env = prod    the only mode in which a code is sent (a non-prod auth sends nothing and always issues the same
#                 code), so the SMS provider below is only called in this one
#   otp-provider  the stub that `loadgen` itself serves on :9100; it counts what it is asked to send and keeps the
#                 last code sent to each number, which is how the scenarios enter it
#
# Each profile that turns more of antifraud on includes the one before it and adds its keys (sms-budget.conf), so a
# run differs from the one it is compared with by exactly those keys.
include required(file("auth/dev/env.conf"))

env = prod

otp-provider {
  method = "POST"
  url = "http://localhost:9100/sms"
  body {
    phone = "{{phone}}"
    message = "{{message}}"
  }
}
