# evaluate, with the proof of work on: a `Challenge` decision is put to the client, and the run measures what a client that
# answers it pays and what a client that cannot waits.
#
# The stored settings are `tuning/challenge.json` of the runbook (`"mode": "enforce"`, `challengeAt` above 0 and below
# `blockAt`, the velocity limits of `evaluate`), so that a request whose score reaches `challengeAt` is asked for work and
# not refused. Run it twice against the same settings, once per kind of client:
#
#   antifraud.otp.client = script   solves the proof (Pow.scala, the kernel of central-ui/forms/shared/pow.ts) and is sent
#                                   the code: `challenged` and `solved` in the report, `refused` only for a Block
#   antifraud.otp.client = plain    posts the form with no proof: the request is left pending, and its ask for the code is
#                                   honoured only after `antifraud.challenge.pause` (`paid by waiting`)
#
# `pause` here and `antifraud.challenge.pause` of loadgen.conf (what the plain client waits) have to be equal. The key is
# new with the pause (versolauth/versola#882): an auth without it ignores it, and then a plain client's ask is never
# honoured (`other: pending`) and a script client is given a proof as before.
include required(file("loadgen/antifraud/auth-profiles/evaluate.conf"))

antifraud.challenge {
  enabled = true
  ttl = "2 minutes"
  max-attempts = 5
  pause = "20 seconds"
}
