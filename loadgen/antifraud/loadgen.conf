# The configuration of `role = antifraud` (and of the `provision` that precedes it) against the local stack that
# `scripts/gen-env.scala` writes: auth on 9003 (diagnostics 9004), edge on 9005, central on 9001. loadgen reads
# the whole tree whatever its role, so the blocks that only other roles use are here too, with values that are
# never connected to. See loadgen/antifraud/README.md for how it is run.
#
# What changes between runs is passed in the environment:
#   AF_LABEL     names the auth configuration under test (off, sms-budget, ...); part of the report
#   AF_REPORT    where the JSON report goes (a .md is written beside it)
#   AF_BASELINE  the JSON report of the run to compare with, normally the "off" one
#   AF_OTP_CLIENT       `script` (the default: submits inline and solves a proof of work) or `plain` (a form post, which waits the pause)
#   AF_CHALLENGE_PAUSE  what a plain client waits when it is left pending; equal to `antifraud.challenge.pause` of the auth profile
#   AF_MAX_IN_FLIGHT    sessions at once; a plain client holds each for the pause, so rate x pause of them
#   AF_SMS_DELAY        what the SMS stub takes to answer (`80ms`): a real send's time, which a fake send is to match
#   AF_FAKE_PREFIX      the digits of the `fake` list entry that `fake-timing` asks for (`491599`)
#   AF_SCENARIOS is not read: choose scenarios below (`fake-timing` is only run when named; see the runbook's loadgen-fake-timing.conf)
env = "loadgen-antifraud"

role = antifraud

targets {
  auth-url = "http://localhost:9003"
  # Several `auth` instances behind one deployment: every session is given one in turn and stays on it. When set it is the
  # list that is driven (`auth-url` is still needed by the other roles); give `antifraud.auth-metrics-urls` the diagnostics of
  # each, in the same number.
  # auth-urls = ["http://localhost:9003", "http://localhost:9013"]
  edge-url = "http://localhost:9005"
  mock-url = "http://localhost:8100"
  origin   = "http://localhost:3000"
}

coordinator { url = "http://localhost:8100", poll-interval = 10s }

store {
  postgres {
    url = "jdbc:postgresql://localhost:5433/loadgen"
    user = "dev"
    password = "1234"
    maximum-pool-size = 4
    minimum-idle = 1
    connection-timeout = 30s
    max-lifetime = 30m
    leak-detection-threshold = 0s
  }
  write-behind { flush-interval = 200ms, batch-size = 500 }
}

population {
  target = 1000
  classes = [
    { name = regular, share = 1.0, active-probability = 0.40, sessions = 2 },
  ]
  platform { mobile = 1.0, web = 0.0 }
  credentials { otp = 1.0, otp-password = 0.0, passkey = 0.0 }
  roles { retail-user = 1.0, retail-basic = 0.0 }
}

session {
  full-login-probability { mobile = 1.0, web = 1.0 }
  action-count { mobile-mean = 5, web-mean = 9, dispersion = 0.6 }
  think-time { median = 4s, sigma = 0.8 }
  payment-probability = 0.25
  extra-refresh-probability = 0.25
  logout-probability { mobile = 0.05, web = 0.35 }
  access-token-ttl = 15m
  refresh-token-ttl = 30d
}

campaign {
  name = "antifraud-local"
  tenant-id = loadgen-standard
  security-profile = standard
  phases = [ { name = steady, duration = 10m, scale = 1.0 } ]
  diurnal { enabled = false, peak-factor = 1.0, peak-hour = 20, timezone = "UTC" }
  registration { enabled = false, target = 1000, duration = 1h }
}

actions = [
  { name = balance, weight = 1.0, method = GET, path = "/accounts/balance" },
]

# `provision` only: the tenant, its clients and its OTP flow. The key is the pinned local test key of the `utils`
# client that central seeds (`bootstrap.utility-client`), the one e2e's ProvisionerCredential uses.
provision {
  tenant-id = loadgen-standard
  provisioner-client-id = utils
  provisioner-private-key = """{"kty":"EC","crv":"P-256","x":"Rst-brXjn7AQChQkaCwR6Vf5-nlVw4SDw-swh8g3GdU","y":"gD6MZlaRGOf1MColB6GhG5N3TdvJGsiF1J7_jYNAgfo","d":"jWGh5lV46NJ3RwT8kJ5lfBeBTGBtXnM5V3gwgAEYpXM","use":"sig","kid":"utils-local","alg":"ES256"}"""
  mobile-redirect-uri = "https://app.versola.test/callback"
  resources {
    core-uri   = "http://af-mockapi-core.invalid:8100"
    pay-uri    = "http://af-mockapi-pay.invalid:8100"
    notify-uri = "http://af-mockapi-notify.invalid:8100"
  }
  preset { id = af-web-otp, cookie-path = "/", post-logout-redirect-uri = "http://localhost:3000/goodbye" }
  passkey { rp-id = localhost, rp-name = "Versola antifraud loadgen", user-verification = preferred }
  payment-amount-threshold = 1000000
}

antifraud {
  label = "off"
  label = ${?AF_LABEL}

  client-id = mobile-otp
  redirect-uri = "https://app.versola.test/callback"
  scope = "openid profile phone offline_access"
  auth-metrics-url = "http://localhost:9004/metrics"
  # With several instances (`targets.auth-urls`): the diagnostics of each; the counters and the queue sizes are summed.
  # auth-metrics-urls = ["http://localhost:9004/metrics", "http://localhost:9014/metrics"]

  report-path = "loadgen/antifraud/results/off.json"
  report-path = ${?AF_REPORT}
  baseline-path = ${?AF_BASELINE}

  # `stub`: auth runs with env = prod (the only mode that sends) and its otp-provider is the stub below; the code
  # is read from what the stub was sent. `fixed`: a non-prod auth, whose code is always the same; nothing is sent
  # then, so no send is counted.
  # `client`: who asks for the codes. `script` is a page with script: the form is sent inline (`proof_inline`) and a proof of
  # work is solved and sent back; `plain` is a form post with none of that, whose request is left pending when it is
  # challenged and is honoured after `challenge.pause`.
  otp { source = stub, length = 6, client = script }
  otp.client = ${?AF_OTP_CLIENT}
  sms-stub { bind-host = "0.0.0.0", port = 9100, response-delay = 0s }
  sms-stub.response-delay = ${?AF_SMS_DELAY}

  # How the client answers a challenge. `pause` is the plain client's wait (the auth profile's `antifraud.challenge.pause`: keep
  # them equal), `pause-slack` what is added to it and the wait between asks, `max-asks` how many it makes. `max-rounds` proofs
  # are answered in a row (the browser's 3), none over `max-difficulty` zero bits (what it will not pay). `solver-threads`
  # proofs are solved at once on threads of their own, 0 one per processor.
  challenge { max-rounds = 3, max-difficulty = 26, pause = 20s, pause-slack = 1s, max-asks = 3, solver-threads = 0 }
  challenge.pause = ${?AF_CHALLENGE_PAUSE}

  # The `fake-timing` scenario (run only when named in `scenarios`): `requests` requests for a code to numbers of a `fake`
  # list entry and as many to real ones, alternating at `rate` a second together, after `warmup` real ones; the verdict is
  # Fail when the medians differ by more than `tolerance`, and when a fake number was sent a code (the entry is not there).
  # The entry is made beforehand (runbook: scripts/antifraud-local/seed-fake-entry.sh): `fake-prefix` is its digits, country
  # code included (a `prefix` entry of at most 6 digits), or `fake-numbers` lists the numbers of `phone_hash` entries.
  fake-timing { requests = 200, rate = 5.0, tolerance = 25ms, warmup = 20 }
  fake-timing.fake-prefix = ${?AF_FAKE_PREFIX}

  # Numbers the tenant's phoneRegions accept (the blueprint's: +49, 11 digits, 1[5-7]...). A range is the first
  # `range-length` digits with the country code: 11 leads of three digits and one more digit, 110 of them here. (The number parser takes only these as eleven-digit German mobile numbers.) Keep range-length equal to
  # antifraud.sms-budget.prefix-length of the auth profile.
  numbers { dial-code = "+49", national-length = 11, leads = ["150", "151", "152", "155", "156", "157", "158", "159", "160", "162", "163"], range-length = 6 }

  # Where the requests come from, as auth sees it. The tenant's ipHeader is X-Forwarded-For (the blueprint's), and auth
  # takes the last value of it from whoever connects, so this process can name a source per session. Legitimate
  # sessions draw from a pool of `legit` addresses (2400 sign-ins over 2000 addresses: a few share one, as behind a NAT);
  # the distributed attack from `distributed` addresses (2400 requests over 500: about five each); every other attack
  # comes from one address of its own. An empty header sends none, and the run is one client to the counters.
  sources        { header = "X-Forwarded-For", legit = 2000, distributed = 500 }

  normal         { rate = 20.0, duration = 2m, conversion = 0.85, refreshes-min = 5, refreshes-max = 10 }
  prefix-attack  { rate = 20.0, duration = 2m }
  device-attack  { rate = 20.0, duration = 2m }
  # The prefix attack spread over the `distributed` sources: what a per-source limit does not see.
  distributed-attack { rate = 20.0, duration = 2m }
  token-control  { sessions = 1000, rate = 50.0, duration = 1m }

  # Legitimate sign-ins while one range is attacked, a tenth of the legitimate users dialling inside that range
  # (about 2 a second): what a closed range costs them.
  mixed          { normal-rate = 20.0, attack-rate = 20.0, duration = 2m, legit-in-range-share = 0.1 }
  # An attack on one range whose sender enters the code for a third of the numbers, to keep the range's conversion up.
  mimicking      { rate = 20.0, duration = 1m, verify-share = 0.3 }
  # One number asked for codes again and again.
  targeted       { rate = 5.0, duration = 1m }
  # Codes requested for new numbers, then five random codes entered for each.
  guessing       { rate = 10.0, duration = 1m, attempts = 5 }

  # What an attack may get through (a tenth of the codes it asked for are sent) and what legitimate users may lose
  # (one request in a hundred refused). Judged on every run, the "off" one included, where the attacks fail.
  attack-sms-ceiling = 0.1
  legit-refusal-ceiling = 0.01

  # Empty: all, in the order of AntifraudScenario (the attacks after the normal ones: a range the budget closes
  # stays closed for an hour; every attack draws a range of its own).
  scenarios = ["normal", "token-control", "prefix-attack", "device-attack", "distributed-attack", "mixed-attack", "conversion-mimicking", "targeted-phone", "verify-guessing"]

  # A plain client holds a session open for the pause: at 20 a second and a 20 s pause that is 400, so raise it (1024) for a
  # `plain` run, or `waited` in the report says the loadgen was the limit.
  max-in-flight = 256
  max-in-flight = ${?AF_MAX_IN_FLIGHT}
  warmup-sessions = 150
  queue-sample-every = 250ms
  added-latency-ceiling = 10ms
  control-tolerance = 5ms
}
