# Alert rules for the audit log of auth and central (#469). Prometheus rule-group format: loaded as it is by
# Prometheus (`rule_files`) and by VictoriaMetrics' vmalert (`-rule`). See dashboards/alerts/README.md.
#
# Every rule sums by namespace and by `source` (`auth`, `central`): one deployment, one alert per service. The
# writer's counters exist from the start, at 0, so the first increase of one is seen by increase(). The writer's alerts
# use 5 minutes, not the 10 of the antifraud ones.
groups:
  - name: versola-audit
    rules:
      - alert: AuditEventsDropped
        expr: sum by (namespace, source) (increase(audit_events_dropped_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Audit events are being lost in {{ $labels.namespace }} ({{ $labels.source }})"
          description: "The audit writer of {{ $labels.source }} dropped events for 5 minutes (audit.overflow = drop and a queue the writer cannot empty, or a best-effort insert that failed). Check the database and the {{ $labels.source }} log: 'could not write the audit events'."

      - alert: AuditEventsRejected
        expr: sum by (namespace, source) (increase(audit_events_rejected_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "The database refused audit events of {{ $labels.source }} in {{ $labels.namespace }}"
          description: "Audit events were refused by the database one by one (a value the table cannot hold) and are not stored: they cannot be retried, and the writer carried on without them. The {{ $labels.source }} log has the kind and id of each, never its content: 'an audit event of kind ... was refused by the database'. A value that reaches here after the cleaning auth does (U+0000, an address that is none) is a bug."

      - alert: AuditEventsFailed
        expr: sum by (namespace, source) (increase(audit_events_failed_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "Audit events of {{ $labels.source }} were not written in {{ $labels.namespace }}"
          description: "Events counted by audit_events_failed_total: a batch the writer could not write (the database was unreachable or refused it) and a write that was interrupted before it finished. The {{ $labels.source }} log has a line per window with the kinds."

      - alert: AuditEventsUnavailable
        expr: sum by (namespace, source) (increase(audit_events_unavailable_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Requests of {{ $labels.source }} are refused with audit_unavailable in {{ $labels.namespace }}"
          description: "Requests were answered 503 audit_unavailable for 5 minutes: audit.overflow = block and the queue had no room within audit.block-timeout, or the service was stopping. The writer is slower than the load or the database is unreachable; check audit_queue_size and the write latency of auth_audit_event."

      - alert: AuditQueueHigh
        expr: max by (namespace, source) (audit_queue_size) > 25000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The audit queue of {{ $labels.source }} is above 25000 events in {{ $labels.namespace }}"
          description: "{{ $value }} events wait for the writer of {{ $labels.source }} (the queue holds 50000). The writer is behind: check the database and the log line 'could not write the audit events'."

      - alert: AuditEventsBlocked
        expr: sum by (namespace, source) (increase(audit_events_blocked_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Requests wait for the audit writer in {{ $labels.namespace }} ({{ $labels.source }})"
          description: "The audit queue of {{ $labels.source }} was full for 5 minutes (audit.overflow = block): requests waited up to audit.block-timeout for room. The writer is slower than the load; check the database's write latency and audit_queue_size."

      - alert: AuditPartitionsRunningOut
        expr: min by (namespace, source) (audit_partitions_ahead) < 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Audit log of {{ $labels.source }} has fewer than 3 days of partitions ahead in {{ $labels.namespace }}"
          description: "Only {{ $value }} days of the audit log of {{ $labels.source }} have a partition (14 when healthy, made hourly). At 0 the events of the day go to the default partition ({{ $labels.source }}_audit_event_default), from which they are never moved: AuditEventsInDefault follows. Fix the maintenance failure (the {{ $labels.source }} log: 'could not maintain the audit event partitions', or AuditPartitionOwnerMismatch)."

      - alert: AuditEventsInDefault
        expr: max by (namespace, source) (audit_events_in_default) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Audit events sit in the default partition in {{ $labels.namespace }} ({{ $labels.source }})"
          description: "{{ $value }} days of audit events of {{ $labels.source }} were written to {{ $labels.source }}_audit_event_default because the day had no partition, and they stay there (the table is append-only and the long-term copy is an insert-only replication, so rows are never moved). A query on auth_audit_event reads them like any other row, and they leave with the retention. The day cannot get a partition while they are there. Find why the maintenance was late (AuditPartitionsRunningOut, AuditPartitionOwnerMismatch)."

      - alert: AuditPartitionOwnerMismatch
        expr: max by (namespace, source) (audit_partition_owner_mismatch) == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.source }} does not own its audit log table in {{ $labels.namespace }}"
          description: "The role {{ $labels.source }} connects as neither owns {{ $labels.source }}_audit_event nor is a member of its owner, so no partition is created or dropped. The {{ $labels.source }} log has the statement to run: ALTER TABLE {{ $labels.source }}_audit_event OWNER TO <role>."

      # The database's own replication slots, read by each service from pg_replication_slots (PostgresWalMetrics). Not specific to
      # one service: the slot of the audit log's logical replication is one of them, and one that is not consumed keeps the WAL on
      # the primary. Every service reads the same database, so the series are taken once per slot.
      - alert: AuditReplicationSlotRetainsWal
        expr: max by (namespace, slot) (db_replication_slot_retained_bytes) > 10 * 1024 * 1024 * 1024
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Replication slot {{ $labels.slot }} retains {{ $value | humanize1024 }}B of WAL in {{ $labels.namespace }}"
          description: "The slot {{ $labels.slot }} holds back more than 10 GiB of WAL on the primary for 15 minutes: its subscriber (the long-term copy of an audit table, see deploy.md) is not reading, or is far behind. The WAL is kept until the slot is read or dropped (DROP_REPLICATION_SLOT / pg_drop_replication_slot), and it fills the primary's disk meanwhile. db_replication_slot_active says whether a subscriber is connected."
