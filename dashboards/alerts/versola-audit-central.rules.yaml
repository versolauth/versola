# Alert rules for what central records of administrators' actions (#469). Prometheus rule-group format: loaded as it is by
# Prometheus (`rule_files`) and by VictoriaMetrics' vmalert (`-rule`). See dashboards/alerts/README.md.
#
# The audit writer's own alerts (events dropped, refused, failed, the queue) are in versola-audit.rules.yaml. Every rule here sums
# by namespace. The counters are created by the first increment, so a single occurrence on a fresh pod is not seen by
# increase(); an occurrence that repeats is.
groups:
  - name: versola-audit-central
    rules:
      - alert: AuditActorMissing
        expr: sum by (namespace) (increase(audit_actor_missing_total[15m])) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Administrators' actions are recorded without an actor in {{ $labels.namespace }}"
          description: "Calls to central's admin API reached it without the actor edge adds (reason=absent), or with one that is no user and no client (reason=invalid), for an hour: the audit rows say 'service' with no id. With reason=invalid_ip the actor is right and the address is not an address: the row has no ip. Either an edge has not read the registrations of the central resource yet (it syncs every few minutes after central's start), or something calls central around edge, or the inject rules of the central resource were changed."

      - alert: AuditActorRefused
        expr: sum by (namespace, reason) (increase(audit_actor_refused_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Calls to central's admin API are refused for want of an actor in {{ $labels.namespace }} ({{ $labels.reason }})"
          description: "audit.require-actor is on and calls to central's admin API reached it without a valid actor (reason=absent: none, reason=invalid: no user and no client) and were answered 401, for 15 minutes. Either an edge has not read the registrations of the central resource yet, or something calls central around edge, or the inject rules of the central resource were changed."

      - alert: AuditReportWithoutAuth
        expr: sum by (namespace, reason) (increase(audit_report_partial_total[15m])) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The per-user audit report is served without auth's part in {{ $labels.namespace }} ({{ $labels.reason }})"
          description: "For an hour the per-user report (GET /users/audit) was served from central's rows alone. reason=endpoint_missing: auth answers 404 to GET /users/audit-events (an older auth, or a path that does not match): it does not pass by itself. reason=unavailable: auth is down, busy or answers 5xx. reason=unreadable: auth's answer could not be read."

      - alert: AuditEventWithoutTarget
        expr: sum by (namespace, kind) (increase(audit_event_without_target_total[15m])) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "A change of {{ $labels.kind }} was recorded without a target in {{ $labels.namespace }}"
          description: "A route that acts on a named thing succeeded and its handler did not name the target (and, on a user's route, the user): the row is not found by target and does not appear in the user's report. It is a defect in the route, not in the data: a route that acts on the deployment's one record says so in its declaration."
